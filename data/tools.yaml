# Tool profiles for the AI Tool Selection Guide
# Last verified: 3 October 2026
# FX: 1 USD ≈ 278 PKR (Pakistan open-market selling ~278.3; interbank ~277.07). Approx PKR = USD × 278, rounded to nearest 50.
# Status values: verified | partially_verified | unverified

meta:
  last_verified: "3 October 2026"
  usd_to_pkr: 278
  fx_note: "Open-market selling ~PKR 278.3 on 3 Oct 2026 (Pakistan Observer / Daily Pakistan). Interbank ~277.07."
  disclaimer: "Prices and limits change quickly. Confirm on the vendor site before you pay. This is not financial, legal, or tax advice."

tools:
  - id: chatgpt
    name: ChatGPT
    category: assistants
    status: verified
    best_for: Everyday writing, brainstorming, coding help, file analysis, images on paid tiers
    avoid_when: You need guaranteed peer-reviewed citations only, or must keep data fully off third-party servers
    free_tier: Unlimited everyday text chats subject to abuse limits; limited uploads, images, voice, deep research, memory. Ads may appear on Free/Go in some markets.
    paid_usd: "Go $8/mo; Plus $20/mo; Pro $200/mo (US list)"
    paid_pkr_approx: "Go ~PKR 2,200; Plus ~PKR 5,550; Pro ~PKR 55,600 /mo"
    pakistan_access: "Widely usable. Billing usually USD card; Go is the budget paid option for students."
    privacy: "Consumer chats may be used to improve models unless you opt out in settings. Never paste passwords, CNIC, bank details, or client secrets."
    learning_curve: Beginner
    sources:
      - "https://openai.com/chatgpt/pricing"
      - "https://openai.com/index/introducing-chatgpt-go/"
      - "https://help.openai.com/en/articles/11989085-what-is-chatgpt-go"


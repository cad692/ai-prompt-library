  prompt: 'Serve as a strategy facilitator running an evidence-aware SWOT for a specific choice, not a
    generic company description.


    Decision to inform: [DECISION]

    Organization or project: [ORGANIZATION]

    Internal evidence: [INTERNAL_EVIDENCE]

    External evidence: [EXTERNAL_EVIDENCE]

    Time horizon: [TIME_HORIZON]

    Geography or market: [MARKET]


    Begin by restating the decision boundary. Sort candidate observations by internal strengths/weaknesses
    and external opportunities/threats, but attach one label to every item: verified fact, informed interpretation,
    or untested assumption. Remove vague entries such as “competition” or “good team” unless made specific
    and comparative.


    Prioritize no more than four items per quadrant using impact on the decision and confidence in evidence.
    For the top items, show the evidence, why it matters now, and what could disconfirm it. Then cross
    the quadrants to form four strategic moves: use a strength to capture an opportunity, use a strength
    to reduce a threat, repair a weakness to capture an opportunity, and limit exposure where weakness
    meets threat.


    Convert the best two moves into small experiments with owner, signal, time box, and stop/continue
    rule. End with five research questions that would most change the analysis. Do not present assumptions
    as market facts.

    '

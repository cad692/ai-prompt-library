    as a gap: missing context, neglected population, methodological weakness, inconsistent result, untested
    mechanism, outdated evidence, or implementation problem. Do not equate “few papers I saw” with “no
    research exists.”


    Build a coverage grid crossing major themes with populations, locations, methods, and time periods.
    Populate it only from traceable sources and include citations or source IDs. Mark cells as well covered,
    partly covered, apparently sparse, or not assessed.


    For each apparent gap, perform an adversarial check: propose two search strings, likely databases,
    alternate terminology, and neighbouring disciplines where overlooked work may exist. If browsing is
    available, report what that check found; otherwise label it pending.


    Rank the surviving gaps by significance, originality within scope, feasibility, ethical access, and
    value for Pakistan or [TARGET_CONTEXT]. For the top three, draft a cautious gap statement, a possible
    research question, suitable evidence, and a reason the study matters. End with wording to avoid—such
    as “no one has studied”—and a defensible replacement tied to the reviewed corpus.


  usage: Use this to see exactly how a vague prompt becomes specific and testable.
  use_case: A beginner can compare a weak instruction with stronger revisions and learn which changes
    improve output.
  preview: 'Diagnose and improve this weak prompt as a practical prompt-writing teacher: [WEAK_PROMPT].
    The intended outcome is [OUTCOME], the user is [USER], and the output will be used for [USE]. Preserve
    the...'

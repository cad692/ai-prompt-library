- id: '032'
  slug: weak-prompt-makeover
  title: Weak Prompt Makeover
  category: prompting
  difficulty: Beginner
  usage: Use this to see exactly how a vague prompt becomes specific and testable.
  use_case: A beginner can compare a weak instruction with stronger revisions and learn which 
    changes improve output.
  preview: 'Diagnose and improve this weak prompt as a practical prompt-writing teacher: [WEAK_PROMPT].
    The intended outcome is [OUTCOME], the user is [USER], and the output will be used for [USE]. Preserve
    the...'
  best_tools:
  - tool: ChatGPT
    reason: Provides clear prompt rewrites and demonstrates their likely output differences.
  - tool: Gemini
    reason: Generates varied reformulations and explains practical prompt improvements.
  tip: Improve the missing information that affects success; extra words alone do not improve a 
    prompt.
  expected_output: An annotated before-and-after prompt with a reusable lesson.
  tags:
  - prompt-rewrite
  - before-after
  - clarity
  - beginners
  next_id:
  prompt: 'Diagnose and improve this weak prompt as a practical prompt-writing teacher: [WEAK_PROMPT].


    The intended outcome is [OUTCOME], the user is [USER], and the output will be used for [USE]. Preserve
    the legitimate goal; do not quietly change the task or add requirements unsupported by me.


    Start by marking the original prompt with inline labels for five possible weaknesses: vague action,
    missing context, undefined audience, absent output format, and untestable quality words. If a category
    is already strong, say so.


    Create three successive rewrites:

    Version 1 — Minimal Repair: change as little as possible.

    Version 2 — Reliable Prompt: add necessary context, constraints, and output shape.

    Version 3 — Reusable Template: replace variable details with bracketed tokens from [PLACEHOLDERS].
    If that list is blank, propose sensible placeholder names.


    Under each version, explain the likely change in output using one short “because” statement. Show
    a tiny mock output fragment—not a full completion—to make the difference visible.


    Then run a deletion test on Version 2: remove one instruction that does not materially affect success,
    or state that every instruction earns its place. End with a three-rule lesson tailored to the original
    weaknesses and one challenge asking me to revise a second prompt myself.

    '
- id: '033'
  slug: grounded-answer-guardrails
  title: Grounded Answer Guardrails
  category: prompting
  difficulty: Advanced
  usage: Use this to design prompts that reduce unsupported claims and invented details.
  use_case: A researcher or workplace team can make document-based AI answers more traceable and 
    safer to verify.
  preview: Design a grounded-answer prompt for [TASK] where unsupported claims would create [RISK]. 
    Allowed evidence is [APPROVED_SOURCES]. The user’s question will appear as [QUESTION]. Build 
    instructions that...
  best_tools:
  - tool: NotebookLM
    reason: Grounds responses in user-provided sources and exposes supporting source locations.
  - tool: Claude
    reason: Follows detailed evidence constraints across long source material.
  tip: Require an abstention phrase and source locations, then test the prompt with an unanswerable 
    question.
  expected_output: A hallucination-resistant prompt with evidence rules and adversarial tests.
  tags:
  - hallucination
  - grounding
  - verification
  - prompt-safety
  next_id:
  prompt: 'Design a grounded-answer prompt for [TASK] where unsupported claims would create [RISK].


    Allowed evidence is [APPROVED_SOURCES]. The user’s question will appear as [QUESTION]. Build instructions
    that force a clean boundary between supplied evidence, general background knowledge if allowed, and
    inference. Require the exact abstention phrase NOT SUPPORTED BY PROVIDED SOURCES (plain text, not
    a fill-in field) whenever the evidence is insufficient.


    The resulting prompt must require:

    - a source location beside each material claim;

    - quotations only when exact wording is available;

    - uncertainty labels for ambiguous passages;

    - no invented citations, links, statistics, names, or dates;

    - a conflict note when approved sources disagree;

    - a request for missing information when it would change the answer.


    Choose an output structure suited to [AUDIENCE] rather than a generic essay. Include a final evidence
    ledger mapping conclusions to source IDs.


    Stress-test the prompt with three probes: one answerable question, one partly answerable question,
    and one plausible but absent claim. Predict the compliant behaviour for each without answering the
    domain question. Identify any instruction that could still reward confident guessing and tighten it.


    Return the production prompt first, followed by the tests and a short human verification protocol.
    Do not claim these controls eliminate hallucinations; state their limits and recommend review proportional
    to the risk.

    '
- id: '034'

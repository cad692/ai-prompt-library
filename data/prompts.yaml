  prompt: 'Compare [PDF_A] and [PDF_B] as two separate evidence sources, never blending their claims.


    My comparison purpose is [PURPOSE]. Use these criteria: [CRITERIA]. If no criteria are supplied, propose
    a set and ask for approval before proceeding. Identify each document’s title, author, date, version,
    intended audience, and scope. Flag if editions or time periods make direct comparison unfair.


    Create a comparison matrix. For every criterion provide Document A’s position with page reference,
    Document B’s position with page reference, the relationship—agreement, partial overlap, conflict,
    or silence—and a concise interpretation. Use [NOT STATED] when a document does not address something.


    Add separate sections for:

    - terminology that looks similar but is defined differently;

    - evidence quality and methodology;

    - changes in numbers, requirements, or recommendations;

    - unique contributions from each document;

    - unresolved contradictions.



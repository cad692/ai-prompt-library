- id: '071'
  slug: spreadsheet-cleaning-blueprint
  title: Spreadsheet Cleaning Blueprint
  category: data-productivity
  difficulty: Beginner
  usage: Use to plan safe cleaning before changing a messy spreadsheet.
  use_case: Creates a reversible, auditable cleaning plan for Excel or Google Sheets. It preserves raw
    data and defines validation checks.
  preview: 'Work as a cautious data steward planning a spreadsheet cleanup that can be audited and reversed.
    File purpose: [PURPOSE] Columns and sample rows: [SCHEMA_SAMPLE] Known problems: [PROBLEMS] Intended...'
  best_tools:
  - tool: Excel/Sheets
    reason: Provides filters, formulas, validation, and reproducible cleaning steps.
  - tool: ChatGPT
    reason: Helps diagnose column issues and draft transformation logic.
  tip: Never clean the only copy; preserve a read-only raw tab with an import date.
  expected_output: A staged cleaning plan with rules, checks, and rollback safeguards.
  tags:
  - spreadsheet
  - data-cleaning
  - quality
  next_id: null
  prompt: 'Work as a cautious data steward planning a spreadsheet cleanup that can be audited and reversed.


    File purpose: [PURPOSE]

    Columns and sample rows: [SCHEMA_SAMPLE]

    Known problems: [PROBLEMS]

    Intended analysis: [ANALYSIS]

    Tool: [EXCEL_OR_SHEETS]

    Locale, date, and number conventions: [LOCALE]


    Do not clean values immediately. First profile each column by expected type, missingness, uniqueness,
    range, pattern, and likely business rule. Build an issue register covering duplicate rows, inconsistent
    categories, whitespace, casing, dates, decimal separators, units, impossible values, broken formulas,
    and personally identifying data.


    Propose a staged workflow: preserve raw import, create a working copy, standardize formats, map categories,
    handle missing values, resolve duplicates, validate relationships, and publish a clean table. For
    every transformation, state the rule, example before/after, formula or menu approach appropriate to
    the named tool, and rollback method. Never recommend deleting an outlier solely because it looks unusual.


    Define reconciliation checks: row count, unique key count, totals before/after, unmatched mappings,
    formula error count, and spot-check sample. Mark decisions that require a domain owner. Finish with
    a data dictionary template and a cleaning log containing date, operator, rule, affected rows, and
    approval.

    '
- id: '072'
  slug: chart-to-decision-narrative
  title: Chart to Decision Narrative
  category: data-productivity
  difficulty: Beginner
  usage: Use to explain a chart in plain language without overstating it.
  use_case: Converts chart evidence into a concise narrative for reports or meetings. It surfaces alternative
    explanations and action limits.
  preview: 'You are a data interpreter writing the honest story of a chart for a non-specialist decision-maker.
    Chart or data: [CHART_DATA] Metric definition: [METRIC] Audience and decision: [AUDIENCE_DECISION]...'
  best_tools:
  - tool: ChatGPT
    reason: Synthesizes supplied chart details into an audience-aware narrative.
  - tool: Excel/Sheets
    reason: Allows direct verification of values, labels, and chart construction.
  tip: Read the narrative beside the chart and verify every directional claim.
  expected_output: A chart narrative with takeaway, caveats, and decision implications.
  tags:
  - charts
  - data-storytelling
  - reporting
  next_id: null
  prompt: 'You are a data interpreter writing the honest story of a chart for a non-specialist decision-maker.


    Chart or data: [CHART_DATA]

    Metric definition: [METRIC]

    Audience and decision: [AUDIENCE_DECISION]

    Comparison period: [PERIOD]

    Source and caveats: [SOURCE_CAVEATS]


    Inspect the evidence in four passes. First describe only what is visible: level, direction, variation,
    and notable comparisons. Second identify the strongest decision-relevant pattern with exact values
    and units. Third test that pattern against base effects, seasonality, denominators, target changes,
    missing periods, small samples, and category redefinitions. Fourth consider at least one plausible
    alternative explanation.


    Write three narrative layers: a 12-word chart headline, a 60-word executive explanation, and a 150-word
    analytical note. Each must distinguish observation from interpretation and implication. If the data
    does not support a firm conclusion, use appropriately cautious language rather than manufacturing
    certainty.


    Add two annotations that should appear on the chart, one question the audience is likely to ask, and
    the precise additional data needed to answer it. Conclude with a decision statement formatted as “This
    evidence supports [ACTION] within [BOUNDARY], while we monitor [UNCERTAINTY].” Do not infer causation
    from timing alone.

    '
- id: '073'
  slug: assumptions-first-analysis
  title: Assumptions First Analysis
  category: data-productivity
  difficulty: Beginner
  usage: Use before quantitative analysis to expose definitions, assumptions, and decision thresholds.
  use_case: Frames an analysis so hidden choices become reviewable before calculations begin. It reduces
    confident answers to the wrong question.
  preview: 'Act as an analytical reviewer who pauses calculation until the question and assumptions are
    explicit. Decision to be made: [DECISION] Available data: [DATA] Proposed method: [METHOD] Stakeholders...'
  best_tools:
  - tool: Claude
    reason: Handles complex analytical context and tracks assumptions across a long brief.
  - tool: ChatGPT
    reason: Structures decision questions, sensitivity tests, and evidence gaps.
  tip: Ask the decision owner to approve definitions before calculating results.
  expected_output: An analysis contract with assumptions, tests, and stop conditions.
  tags:
  - analysis
  - assumptions
  - decision-science
  next_id: null
  prompt: 'Act as an analytical reviewer who pauses calculation until the question and assumptions are
    explicit.


    Decision to be made: [DECISION]

    Available data: [DATA]

    Proposed method: [METHOD]

    Stakeholders: [STAKEHOLDERS]

    Constraints: [CONSTRAINTS]

    Deadline: [DEADLINE]


    Produce an “analysis contract.” Define the outcome variable, unit of analysis, population, comparison,
    time window, success threshold, and decision rule. Then create an assumption ledger grouped into data
    quality, measurement, sampling, method, external conditions, and stakeholder values. For each assumption,
    state why it matters, current evidence, confidence, and how failure would bias the result.


    Identify the five assumptions with the highest combination of uncertainty and decision impact. Design
    a sensitivity test or validation check for each. Draw a boundary between questions the data can answer,
    questions it can only indicate, and questions it cannot address.


    Propose the smallest defensible analysis sequence, including baseline, segmentation, robustness checks,
    and uncertainty reporting. Add stop conditions for data that is too incomplete or definitions that
    remain unresolved. End with a pre-analysis sign-off containing choices the decision owner must confirm.
    Do not perform calculations or invent missing values unless explicitly asked after this framing is
    approved.

    '

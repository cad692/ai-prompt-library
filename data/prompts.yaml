    first generated answer.
  preview: Build a critique-then-revise loop for improving [DRAFT_TYPE] against [GOAL]. The draft will
    be supplied as [DRAFT]. The audience is [AUDIENCE], constraints are [CONSTRAINTS], and non-negotiable...
  best_tools:
  - tool: Claude

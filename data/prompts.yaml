    one credible reporting/institutional. Trace syndicated copies back to origin. Treat press-release
    reprints as one family.


    STEP 3 — Triangulation matrix

    Rows = major claim components; columns = sources. Cells = supports / qualifies / contradicts / not
    addressed + short quoted or precise paraphrase basis.


    STEP 4 — Confidence and next step

    Explain independence, relevance, and method strength. Highlight conflicts from definitions, samples,
    dates, or incentives. Assign high / medium / low / unresolved confidence per component. State what

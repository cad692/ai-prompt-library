    Build a register with: action stated as a verb, named owner, due date, priority, dependency, completion
    evidence, and source location. If the text says “we,” leaves the owner unclear, or gives a relative
    date such as “next Friday,” mark [CONFIRM OWNER] or [CONFIRM DATE]; do not guess.



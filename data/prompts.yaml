prompts:
- id: '001'
  slug: decision-lens-builder
  title: Decision Lens Builder
  category: assistants
  difficulty: Intermediate
  usage: Use this to compare important options without outsourcing the final decision.
  use_case: A student choosing a degree or a professional weighing job offers can expose trade-offs, assumptions,
    and low-risk tests.
  preview: Act as a decision-framing partner whose goal is to clarify my choice, not make it for me. My
    decision is [DECISION]. The options are [OPTIONS]. My deadline is [DEADLINE], and the people affected
    are...
  best_tools:
  - tool: ChatGPT
    reason: Supports an interactive comparison and can reorganize changing priorities quickly.
  - tool: Claude
    reason: Handles nuanced personal context and long option descriptions well.
  tip: Choose criteria before scoring options so a favourite does not quietly shape the framework.
  expected_output: A balanced decision map with trade-offs, uncertainties, and next actions.
  tags:
  - decisions
  - trade-offs
  - priorities
  - planning
  next_id: null
  prompt: 'Act as a decision-framing partner whose goal is to clarify my choice, not make it for me.


    My decision is [DECISION]. The options are [OPTIONS]. My deadline is [DEADLINE], and the people affected
    are [STAKEHOLDERS]. What matters to me includes [VALUES_OR_PRIORITIES]. My practical limits are [TIME_MONEY_LOCATION_OR_FAMILY_CONSTRAINTS].


    Begin by restating the decision neutrally. Identify any false either/or framing and add a realistic
    hybrid or reversible option if one exists. Then build a decision map with:

    - five to seven criteria derived from my priorities;

    - a suggested weight for each criterion, clearly marked as editable;

    - evidence supporting and challenging each option;

    - unknowns that could change the outcome;

    - the cost of delaying the choice.


    Do not pretend subjective scores are facts. Show a concise, visible rationale for each proposed weight
    and rating. Separate facts I supplied from your assumptions.


    Finish with two low-risk experiments I can run before [DEADLINE], three questions to ask relevant
    people, and a short reflection: “Which regret would be easier to live with, and why?” End by reminding
    me that I retain the decision.

    '
- id: '002'
  slug: realistic-week-designer
  title: Realistic Week Designer
  category: assistants
  difficulty: Beginner
  usage: Use this to turn crowded commitments into a workable week with recovery time.
  use_case: A university student or early-career professional can plan classes, work, commuting, family
    duties, and rest in one realistic schedule.
  preview: 'You are my realistic weekly planner, protecting both important outcomes and sustainable energy.
    Plan the week of [DATES]. Fixed commitments: [CLASSES_MEETINGS_COMMUTE_FAMILY_DUTIES]. Tasks and...'
  best_tools:
  - tool: ChatGPT
    reason: Turns task lists and calendar constraints into clear schedules through conversation.
  - tool: Microsoft Copilot
    reason: Works well when planning information already sits in Microsoft productivity apps.
  tip: Estimate each task pessimistically and keep at least one buffer block unassigned.
  expected_output: A seven-day plan with priorities, buffers, and a fallback version.
  tags:
  - weekly-planning
  - time-management
  - priorities
  - wellbeing
  next_id: null
  prompt: 'You are my realistic weekly planner, protecting both important outcomes and sustainable energy.


    Plan the week of [DATES]. Fixed commitments: [CLASSES_MEETINGS_COMMUTE_FAMILY_DUTIES]. Tasks and deadlines:
    [TASKS]. My strongest focus hours are [FOCUS_HOURS], typical energy pattern is [ENERGY_PATTERN], and
    available study or work time is [AVAILABLE_TIME]. I also need [SLEEP_EXERCISE_PRAYER_MEALS_OR_REST].


    First sort tasks into Must Finish, Should Advance, and Can Wait. Flag any workload that cannot fit
    honestly; do not compress impossible work into tiny blocks. Create a Monday-to-Sunday schedule using
    time ranges, task names, and a clear stopping point. Place demanding work in high-energy periods and
    group small administrative tasks.


    Include:

    1. one daily buffer;

    2. a maximum of three priority outcomes per day;

    3. a “not this week” list;

    4. a 15-minute weekly review;

    5. a reduced plan for a day disrupted by transport, illness, or load-shedding.


    Close with the first action for Monday, written so it takes under ten minutes to begin. Keep the plan
    practical for my context in [CITY_OR_SETTING].

    '
- id: '003'
  slug: skill-practice-coach
  title: Skill Practice Coach
  category: assistants
  difficulty: Intermediate
  usage: Use this to learn a skill through diagnosis, practice, feedback, and reflection.
  use_case: A learner can build confidence in presentations, spreadsheets, coding, writing, or another
    practical skill without receiving dishonest completed work.
  preview: 'Serve as a practice-first learning coach helping me improve [SKILL] for [REAL_WORLD_GOAL].
    Before teaching, ask me exactly four questions: my current level, previous attempts, time available,
    and the...'
  best_tools:
  - tool: ChatGPT
    reason: Provides adaptive exercises, immediate feedback, and conversational coaching.
  - tool: Gemini
    reason: Can support learning from mixed text and visual examples when supplied.
  tip: Attempt each exercise before revealing the model example; productive struggle improves recall.
  expected_output: A tailored mini-lesson, practice task, feedback method, and follow-up plan.
  tags:
  - learning
  - coaching
  - practice
  - feedback
  - skills
  next_id: null
  prompt: 'Serve as a practice-first learning coach helping me improve [SKILL] for [REAL_WORLD_GOAL].


    Before teaching, ask me exactly four questions: my current level, previous attempts, time available,
    and the situation where I must use the skill. Wait for my answers. Then give me a quick diagnostic
    task that takes no more than [MINUTES] minutes.


    Use my response to choose one priority weakness. Teach that point with a simple explanation, one analogy
    relevant to life in [PAKISTAN_CONTEXT_OR_INDUSTRY], and one worked example. Do not complete graded
    coursework or impersonate my own work; coach me to produce it.


    Next, create a three-round practice ladder:

    - Round A: guided practice with hints;

    - Round B: a changed situation with fewer hints;

    - Round C: a realistic challenge completed independently.


    After each answer, use “Keep / Change / Try” feedback. Ask me to explain one decision in my own words
    before moving on. At the end, summarize the error pattern you observed, give one five-minute drill
    for tomorrow, and propose a spaced review on [REVIEW_DATE]. Adjust difficulty if I score below or
    above [SUCCESS_THRESHOLD].

    '
- id: '004'
  slug: tone-safe-email-rewriter
  title: Tone-Safe Email Rewriter
  category: assistants
  difficulty: Beginner
  usage: Use this to improve an email while preserving facts, intent, and your voice.
  use_case: A student contacting faculty or an employee writing to a manager can sound clear and respectful
    without becoming stiff or vague.
  preview: 'Rewrite my email as a careful communications editor while preserving every verified fact and
    my intended request. Draft: [PASTE_EMAIL] Recipient and relationship: [RECIPIENT_CONTEXT] Desired
    outcome...'
  best_tools:
  - tool: ChatGPT
    reason: Quickly rewrites short messages across professional tones while following constraints.
  - tool: Claude
    reason: Useful for preserving nuance and intent in sensitive correspondence.
  tip: Name the relationship and desired response; tone depends more on context than vocabulary.
  expected_output: Two polished email versions plus a brief explanation of tone choices.
  tags:
  - email
  - tone
  - workplace
  - communication
  next_id: null
  prompt: 'Rewrite my email as a careful communications editor while preserving every verified fact and
    my intended request.


    Draft: [PASTE_EMAIL]

    Recipient and relationship: [RECIPIENT_CONTEXT]

    Desired outcome: [OUTCOME]

    Tone: [WARM_DIRECT_FORMAL_DIPLOMATIC]

    Cultural or workplace considerations: [CONSIDERATIONS]

    Maximum length: [WORD_LIMIT]


    Apply these non-negotiable constraints: do not invent dates, promises, attachments, titles, or reasons;
    do not add exaggerated praise; retain any necessary Urdu terms; and keep the request easy to answer.
    If the original sounds accusatory, remove blame without hiding the issue.


    Produce Version A as the safest professional rewrite. Produce Version B as a slightly warmer alternative.
    For each, provide a subject line and complete email. Afterward, list no more than four important edits
    in the form “Changed X → Y because…”.


    Check names, dates, pronouns, and the requested action against my draft. If an essential detail is
    absent, insert [CONFIRM DETAIL] rather than guessing. End with a one-line recommendation naming which
    version better suits [RECIPIENT_CONTEXT]. Avoid clichés such as “I hope this email finds you well”
    unless I explicitly request them.

    '
- id: '005'
  slug: meeting-readiness-brief
  title: Meeting Readiness Brief
  category: assistants
  difficulty: Intermediate
  usage: Use this to enter a meeting with clear outcomes, questions, and fallback positions.
  use_case: A project team member can prepare for a client, supervisor, faculty, or internal meeting when
    time and attention are limited.
  preview: 'Act as my meeting strategist and prepare a concise briefing for [MEETING_NAME] on [DATE].
    Context: [BACKGROUND] Participants and roles: [PARTICIPANTS] My desired outcome: [IDEAL_OUTCOME] Minimum...'
  best_tools:
  - tool: Claude
    reason: Synthesizes lengthy background notes into a coherent preparation brief.
  - tool: ChatGPT
    reason: Supports agenda design and realistic rehearsal of likely questions.
  tip: Define one minimum acceptable outcome so the meeting remains useful even if time runs short.
  expected_output: A one-page meeting brief with agenda, questions, risks, and follow-up language.
  tags:
  - meetings
  - preparation
  - agenda
  - stakeholders
  next_id: null
  prompt: 'Act as my meeting strategist and prepare a concise briefing for [MEETING_NAME] on [DATE].


    Context: [BACKGROUND]

    Participants and roles: [PARTICIPANTS]

    My desired outcome: [IDEAL_OUTCOME]

    Minimum acceptable outcome: [MINIMUM_OUTCOME]

    Sensitive points: [SENSITIVE_POINTS]

    Evidence or documents available: [MATERIALS]

    Duration: [MINUTES]


    Build a one-page readiness brief. Open with a two-sentence purpose statement I can say aloud. Arrange
    an agenda that fits the stated duration, including explicit minutes for decisions and questions. Add
    a stakeholder read: what each participant may care about, labelled as either known or inferred.


    Create five high-value questions, ordered from exploratory to decision-focused. Anticipate three difficult
    questions I may receive and draft honest, compact responses that do not fabricate missing data. For
    each sensitive point, suggest neutral wording and a phrase for redirecting discussion if it becomes
    unproductive.


    Add a mini decision log with columns for decision, owner, deadline, and evidence needed. Finish with
    a 30-second closing summary and a follow-up email skeleton. If the meeting goal is too broad for [MINUTES],
    explicitly recommend what to defer.

    '
- id: '006'
  slug: constraint-led-idea-lab
  title: Constraint-Led Idea Lab
  category: assistants
  difficulty: Intermediate
  usage: Use this to generate feasible ideas within real limits instead of generic brainstorming.
  use_case: A student society, small business, NGO, or project team can create options suited to a tight
    budget and local conditions.
  preview: Run a constraint-led idea lab for the goal [GOAL], prioritising usefulness over sheer quantity.
    The audience is [AUDIENCE]. We have [BUDGET], [TIME], [TEAM_SIZE], and access to [RESOURCES]. We must...
  best_tools:
  - tool: Gemini
    reason: Generates and reorganizes diverse concepts from detailed contextual constraints.
  - tool: DeepSeek
    reason: Offers capable text brainstorming and structured option comparison.
  tip: Include one unusual constraint; it often produces more distinctive ideas than asking for creativity.
  expected_output: A diverse shortlist of feasible concepts with tests and rejection reasons.
  tags:
  - brainstorming
  - constraints
  - innovation
  - feasibility
  next_id: null
  prompt: 'Run a constraint-led idea lab for the goal [GOAL], prioritising usefulness over sheer quantity.


    The audience is [AUDIENCE]. We have [BUDGET], [TIME], [TEAM_SIZE], and access to [RESOURCES]. We must
    respect [NON_NEGOTIABLES], avoid [EXCLUSIONS], and account for [LOCAL_CONTEXT]. Success means [MEASURE_OF_SUCCESS].


    Generate ideas in three deliberately different waves:

    Wave 1 — five dependable ideas using familiar methods.

    Wave 2 — five combinations that borrow a mechanism from [OTHER_FIELD].

    Wave 3 — three “reverse assumption” ideas that challenge how this is normally done.


    Each idea must fit on three lines: concept, why it fits the constraints, and its weakest point. Do
    not repeat the same core mechanism under new names.


    Next, apply a hard filter: eliminate anything that exceeds a non-negotiable limit and explain each
    rejection in one sentence. Score the survivors from 1–5 for impact, effort, inclusion, and testability.
    Select a portfolio of three: one safe, one balanced, and one bold.


    For each finalist, design a [DAYS]-day pilot requiring no more than [PILOT_BUDGET]. End with the single
    piece of evidence that would make us stop, adapt, or scale each pilot.

    '
- id: '007'
  slug: interview-pressure-rehearsal
  title: Interview Pressure Rehearsal
  category: assistants
  difficulty: Advanced
  usage: Use this to rehearse an interview through realistic role-play and direct critique.
  use_case: A graduate or professional can practise behavioural and technical answers for a target role,
    including difficult follow-up questions.
  preview: 'Role-play a demanding but fair interviewer for [ROLE] at [ORGANISATION_TYPE]. Use this vacancy
    description: [JOB_DESCRIPTION]. My background is [BACKGROUND], and I want special practice on...'
  best_tools:
  - tool: ChatGPT
    reason: Maintains interactive interviewer role-play and gives targeted response feedback.
  - tool: Meta AI
    reason: Provides accessible conversational practice for common interview scenarios.
  tip: Answer aloud before typing a summary to practise delivery as well as content.
  expected_output: An interactive mock interview with scored critique and improved answer outlines.
  tags:
  - interview
  - role-play
  - careers
  - feedback
  - practice
  next_id: null
  prompt: 'Role-play a demanding but fair interviewer for [ROLE] at [ORGANISATION_TYPE].


    Use this vacancy description: [JOB_DESCRIPTION]. My background is [BACKGROUND], and I want special
    practice on [WEAK_AREA]. Conduct an eight-question interview one question at a time. Wait for my response
    after every question. Mix behavioural, situational, role-specific, and ethical judgement questions;
    do not reveal the next question early.


    Stay in interviewer character during each exchange. Ask one probing follow-up whenever my answer is
    vague, unsupported, or avoids the question. Never invent experience for me.


    After each response, briefly score four dimensions from 1–5: relevance, evidence, structure, and delivery.
    Give one strength and one precise correction, but let me retry before showing any model outline.


    At the end, leave character and become a hiring-panel coach. Identify recurring patterns across my
    answers. Select my weakest answer and provide:

    - a STAR or role-appropriate outline using only facts I supplied;

    - two stronger opening sentences;

    - the missing evidence I should verify;

    - a 60-second practice version.


    Finish with a realistic hiring signal—strong, mixed, or weak—and explain it against [SELECTION_CRITERIA],
    not personal preference.

    '
- id: 008
  slug: two-level-concept-explainer
  title: Two-Level Concept Explainer
  category: assistants
  difficulty: Beginner
  usage: Use this to understand a concept first simply and then at professional depth.
  use_case: A learner can build intuition before encountering technical vocabulary, equations, caveats,
    or domain-specific applications.
  preview: 'Teach me [CONCEPT] twice: first as if I am 15, then as if I am entering the profession. My
    current knowledge is [WHAT_I_ALREADY_KNOW]. I need this for [PURPOSE], in the field of [FIELD]. Use
    examples...'
  best_tools:
  - tool: ChatGPT
    reason: Adapts explanations to different knowledge levels and supports follow-up questions.
  - tool: Gemini
    reason: Explains concepts using varied examples and can work with supplied visuals.
  tip: After reading both levels, explain the connection between them in your own words.
  expected_output: A teen-friendly explanation, expert treatment, and bridge between the two.
  tags:
  - explanation
  - learning
  - concepts
  - expertise
  next_id: null
  prompt: 'Teach me [CONCEPT] twice: first as if I am 15, then as if I am entering the profession.


    My current knowledge is [WHAT_I_ALREADY_KNOW]. I need this for [PURPOSE], in the field of [FIELD].
    Use examples relevant to [LOCAL_OR_PERSONAL_CONTEXT].


    Part One — Build Intuition

    Explain the idea in plain language with one everyday analogy and a small concrete example. Define
    no more than three essential terms. Include one common misunderstanding and a quick “check yourself”
    question. Avoid saying something is “just simple” or “obvious.”


    Part Two — Add Expert Precision

    Revisit the same example using correct terminology, mechanisms, assumptions, and limitations. If equations
    matter, define every symbol and walk through a tiny numerical example. Distinguish what experts generally
    agree on from what depends on context.


    The Bridge

    Map each element of the first analogy to the technical explanation and state where the analogy breaks
    down. Show three visible reasoning steps for applying the concept to [APPLICATION], without claiming
    access to hidden internal reasoning.


    End with a five-item ladder: what to learn next, from easiest to hardest. Ask me one transfer question
    that requires applying the concept to a new situation; do not answer it until I try.

    '
- id: 009
  slug: habit-experiment-partner
  title: Habit Experiment Partner
  category: assistants
  difficulty: Intermediate
  usage: Use this to design a small, compassionate habit experiment grounded in your routine.
  use_case: A busy learner or worker can improve sleep, movement, focus, or study consistency without
    unrealistic motivation plans.
  preview: 'Be a compassionate behaviour-change coach helping me test, not perfect, the habit [HABIT].
    Here is my normal routine: [ROUTINE]. The habit matters because [PERSONAL_REASON]. Likely obstacles
    include...'
  best_tools:
  - tool: ChatGPT
    reason: Supports iterative coaching, check-ins, and practical adjustment of routines.
  tip: Track whether you started the habit, not whether every session was perfect.
  expected_output: A two-week habit experiment with triggers, tracking, recovery, and review.
  tags:
  - habits
  - wellbeing
  - behaviour
  - consistency
  next_id: null
  prompt: 'Be a compassionate behaviour-change coach helping me test, not perfect, the habit [HABIT].


    Here is my normal routine: [ROUTINE]. The habit matters because [PERSONAL_REASON]. Likely obstacles
    include [OBSTACLES], and I can realistically spend [TIME_OR_MONEY]. Previous attempts went like this:
    [PAST_ATTEMPTS]. Avoid medical diagnosis or treatment advice; if my goal raises a health concern,
    recommend an appropriate qualified professional.


    Design a 14-day experiment around the smallest meaningful version of the habit. Specify the cue, action,
    location, duration, and immediate reward. Give three versions: minimum for difficult days, standard,
    and stretch. Attach the habit to an existing routine rather than relying on motivation.


    Create a tracking line I can copy daily using only four fields. Set a success threshold that allows
    imperfect days. Write “if–then” responses for my top three obstacles and a restart rule after a missed
    day that contains no guilt language.


    On Day 7, ask me to review evidence and choose: continue, simplify, change the cue, or stop. On Day
    14, evaluate fit, consistency, and wellbeing separately. Finish with one supportive message I can
    send myself after a setback, using my stated reason rather than generic inspiration.

    '
- id: '010'
  slug: respectful-conflict-message
  title: Respectful Conflict Message
  category: assistants
  difficulty: Advanced
  usage: Use this to draft a calm message about conflict while keeping boundaries clear.
  use_case: A student, colleague, or team lead can address missed work, disrespect, or misunderstanding
    without escalating the situation.
  preview: 'Help me draft a respectful conflict message that names the issue without attacking the person.
    Relationship: [RELATIONSHIP] What happened, using observable facts: [EVENTS] Impact on me or the work...'
  best_tools:
  - tool: Claude
    reason: Handles sensitive interpersonal nuance and preserves boundaries in careful drafts.
  - tool: ChatGPT
    reason: Produces alternative tones and supports rehearsal of likely replies.
  tip: Describe observable behaviour and impact; avoid guessing the other person's motives.
  expected_output: A de-escalating message, firmer alternative, and response plan.
  tags:
  - conflict
  - boundaries
  - messaging
  - communication
  next_id: null
  prompt: 'Help me draft a respectful conflict message that names the issue without attacking the person.


    Relationship: [RELATIONSHIP]

    What happened, using observable facts: [EVENTS]

    Impact on me or the work: [IMPACT]

    What I need next: [REQUEST_OR_BOUNDARY]

    Communication channel: [WHATSAPP_EMAIL_SMS_OR_OTHER]

    Safety or power concerns: [CONCERNS]


    Before drafting, separate facts from interpretations in two short lists. Flag loaded labels, mind-reading,
    threats, or claims I cannot verify. If there is a credible safety risk, harassment, or serious power
    imbalance, do not encourage direct confrontation; suggest seeking support through [TRUSTED_PERSON_OR_FORMAL_CHANNEL].


    Write three components: a neutral opening, an “observation–impact–request” core, and a closing that
    allows a practical response. Keep the complete message under [WORD_LIMIT] words. Then provide a firmer
    version for use if the first request has already been ignored.


    Role-play two plausible replies from the recipient: one defensive and one constructive. Under each,
    draft a calm one-sentence response that repeats the boundary without debating motives. Finally, run
    a heat check: identify any phrase that could inflame the exchange and replace it. Preserve my natural
    formality and any necessary Urdu greeting in [LANGUAGE_PREFERENCE].

    '
- id: '011'
  slug: three-source-triangulator
  title: Three-Source Triangulator
  category: research
  difficulty: Advanced
  usage: Use this to compare independent sources before trusting a consequential claim.
  use_case: A researcher or professional can test a policy, health, market, or education claim against
    varied evidence instead of one repeated story.
  preview: Act as an evidence triangulator investigating the claim [CLAIM] for [DECISION_OR_PROJECT].
    Scope the claim by geography [LOCATION], period [DATE_RANGE], population [POPULATION], and key terms...
  best_tools:
  - tool: Perplexity
    reason: Finds current web sources and exposes citations for direct inspection.
  - tool: Gemini
    reason: Can compare web-grounded material and organise disagreements across sources.
  tip: Independence matters more than quantity; three articles repeating one press release count as one
    source.
  expected_output: A triangulation matrix showing agreement, conflict, provenance, and confidence.
  tags:
  - research
  - triangulation
  - sources
  - verification
  next_id: null
  prompt: 'Act as an evidence triangulator investigating the claim [CLAIM] for [DECISION_OR_PROJECT].


    Scope the claim by geography [LOCATION], period [DATE_RANGE], population [POPULATION], and key terms
    [DEFINITIONS]. If you have web access, locate at least three genuinely independent source types: one
    primary source or dataset, one scholarly or technical analysis, and one credible reporting or institutional
    source. If browsing is unavailable, stop after giving me a search plan; never invent citations.


    For every candidate source, record title, author or institution, date, direct link or identifier,
    source type, and who produced the underlying evidence. Trace syndicated stories, summaries, and press
    releases back to their origin.


    Build a triangulation matrix with rows for the claim’s major components and columns for each source.
    Use “supports,” “qualifies,” “contradicts,” or “not addressed,” followed by a short quoted or precisely
    paraphrased basis. Explain visible reasoning steps used to judge independence, relevance, and methodological
    strength.


    Highlight conflicts caused by different definitions, samples, dates, or incentives. Assign confidence—high,
    medium, low, or unresolved—to each component, with a one-sentence justification. Conclude with what
    can responsibly be said now, what cannot, and the next source most likely to change the assessment.

    '
- id: '012'
  slug: literature-landscape-mapper
  title: Literature Landscape Mapper
  category: research
  difficulty: Advanced
  usage: Use this to map a field's themes, methods, debates, and landmark studies.
  use_case: A student beginning a dissertation or professional review can understand how a topic is organised
    before reading narrowly.
  preview: 'Map the research landscape around [TOPIC] so I can plan an ethical, focused literature review.
    Boundaries: [DISCIPLINE], [GEOGRAPHY], [YEARS], [POPULATION], and [LANGUAGES]. My purpose is...'
  best_tools:
  - tool: Perplexity
    reason: Supports discovery of scholarly and institutional sources with inspectable links.
  - tool: NotebookLM
    reason: Synthesizes themes across a user-provided collection while grounding answers in those sources.
  tip: Build the map from abstracts and metadata first, then read pivotal papers in full.
  expected_output: A thematic literature map with clusters, debates, methods, and reading priorities.
  tags:
  - literature-review
  - themes
  - scholarship
  - mapping
  next_id: null
  prompt: 'Map the research landscape around [TOPIC] so I can plan an ethical, focused literature review.


    Boundaries: [DISCIPLINE], [GEOGRAPHY], [YEARS], [POPULATION], and [LANGUAGES]. My purpose is [COURSE_DISSERTATION_POLICY_OR_WORK_PROJECT].
    Use only sources I provide in [SOURCE_LIST] or sources you can actually retrieve and cite. Mark any
    item known only from metadata; do not imply that you read a full paper when you did not.


    Organise the field as a map, not a chronological essay:

    - major conceptual clusters and how they connect;

    - recurring research methods and data sources;

    - landmark or frequently cited works;

    - active disagreements;

    - underrepresented settings, especially Pakistan or comparable contexts where relevant.


    For each cluster, name two to four representative sources with stable links, DOI, or complete citation
    details. Add a one-sentence reason each source belongs there. Distinguish empirical findings, theoretical
    proposals, and reviews.


    Then draw a text-based pathway for reading: five foundation items, three contrasting items, and two
    recent items. Explain the selection criteria. End with six database search strings using synonyms
    and Boolean operators, plus inclusion and exclusion rules I can apply consistently. Remind me to verify
    every citation and read original sources before making academic claims.

    '
- id: '013'
  slug: claim-evidence-auditor
  title: Claim Evidence Auditor
  category: research
  difficulty: Intermediate
  usage: Use this to separate claims, evidence, assumptions, and overstatement in a text.
  use_case: A learner reviewing an article, report, or draft can see exactly which statements are well
    supported and which need qualification.
  preview: Audit [PASTED_TEXT_OR_DOCUMENT] as a critical reader, separating what is asserted from what
    is demonstrated. The intended audience is [AUDIENCE], and the standard of evidence is...
  best_tools:
  - tool: Claude
    reason: Handles long passages and nuanced distinctions between claims and support.
  - tool: ChatGPT
    reason: Extracts structured claim-evidence relationships from pasted material.
  tip: Audit one section at a time so evidence links remain precise and traceable.
  expected_output: A claim-versus-evidence table with support ratings and revision advice.
  tags:
  - claims
  - evidence
  - critical-reading
  - audit
  next_id: null
  prompt: 'Audit [PASTED_TEXT_OR_DOCUMENT] as a critical reader, separating what is asserted from what
    is demonstrated.


    The intended audience is [AUDIENCE], and the standard of evidence is [ACADEMIC_POLICY_BUSINESS_OR_OTHER].
    Work only from the supplied text and references unless I explicitly enable research. Do not fill evidence
    gaps from memory.


    Create a table with these columns: exact or shortened claim, claim type, cited evidence, evidence-to-claim
    fit, hidden assumption, severity, and recommended repair. Classify claim type as factual, causal,
    predictive, normative, or interpretive. Rate fit as direct, partial, indirect, absent, or cannot verify.


    Pay special attention to absolute language, causal conclusions from correlation, tiny or unrepresentative
    samples, old data presented as current, and references that support a nearby but different point.
    Preserve paragraph or page locations so I can find each issue.


    After the table, select the three highest-risk claims. For each, give a constraint-based rewrite that
    is accurate without becoming evasive: retain the core meaning, add only justified qualifiers, and
    stay within [MAX_WORDS] words. Finish with a short evidence shopping list naming the source type—not
    a fabricated citation—needed to strengthen each unresolved claim.

    '
- id: '014'
  slug: cited-brief-producer
  title: Cited Brief Producer
  category: research

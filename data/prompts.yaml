    Verified account facts: [FACTS]

    Policy or limits: [POLICY]

    Actions already taken: [ACTIONS]

    Authorized remedy options: [REMEDIES]

    Follow-up timing: [TIMING]

    Channel and tone: [CHANNEL_TONE]


    Identify the customer''s core problem, practical impact, and requested outcome. Draft a reply that:
    acknowledges the specific experience, apologizes for the impact where appropriate, distinguishes confirmed
    facts from what is still being checked, states the next action and owner, offers only authorized remedies,
    and gives a realistic update time.


    Do not blame the customer, quote policy as a shield, promise a result outside the supplied authority,
    or admit legal liability. Avoid overly cheerful language and repetitive apologies. If the message
    includes threats, safety concerns, discrimination, fraud, or legal escalation, mark it for the correct
    human escalation rather than improvising.


    Provide the final send-ready response first. After it, add an internal-only note containing facts
    to verify, system records to update, and the promised follow-up. Include a one-sentence SMS version
    only if [CHANNEL_TONE] requires it. Preserve privacy by omitting unnecessary account details.


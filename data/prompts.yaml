  preview: 'Produce a decision-ready cited brief on [TOPIC] for [AUDIENCE] as of [CUT_OFF_DATE]. Answer
    this central question: [QUESTION]. Prioritise primary documents, official statistics, peer-reviewed...'
  best_tools:
  - tool: Perplexity

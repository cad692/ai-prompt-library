  prompt: 'Work as an ethical outreach writer creating a first email that respects the recipient''s time.


    Sender and credibility: [SENDER]

    Recipient role: [RECIPIENT]

    Verified relevance trigger: [RELEVANCE]

    Offer or reason to connect: [OFFER]

    Evidence: [EVIDENCE]

    Desired next step: [NEXT_STEP]

    Tone: [TONE]


    Draft an email of 80-130 words. The opening must refer to the verified relevance trigger without pretending
    you know the recipient personally. Connect that context to one concrete problem or opportunity, explain
    the offer in plain language, and support it with only the evidence supplied. Ask for one low-friction

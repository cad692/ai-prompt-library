  prompt: 'Act as a survey methodologist designing the shortest instrument that can answer [RESEARCH_OBJECTIVE].


    Target population: [POPULATION]

    Sampling and distribution plan: [SAMPLING]

    Decisions based on results: [DECISIONS]

    Required topics: [TOPICS]

    Languages and accessibility needs: [LANGUAGES_ACCESS]

    Maximum completion time: [TIME]

    Sensitive questions: [SENSITIVE]


    Begin with a construct map: what must be measured, what is merely interesting, and what should be
    excluded. Then draft the survey in respondent order: brief consent and purpose, screening if necessary,
    easy behavioral questions, core measures, optional open text, demographics only when analytically
    justified, and close.



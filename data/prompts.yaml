  expected_output: A labelled pack of concise templates with placeholders and escalation rules.
  tags:
  - pakistan
  - whatsapp-business
  - customer-service
  - messaging
  next_id: null
  prompt: 'Role: Act as a WhatsApp Business conversation designer; build a message pack for [BUSINESS]
    serving [CUSTOMER_TYPE].


    Use the brand voice [VOICE], operating hours [HOURS], languages [LANGUAGES], and confirmed policies
    [POLICIES]. Draft distinct templates for first enquiry, information request, order confirmation, payment-pending
    reminder, delay update, appointment reminder, complaint acknowledgement, resolution follow-up, and
    opt-out confirmation.


    Keep each message short enough for chat and give it one clear action. Use visible placeholders such
    as [CUSTOMER_NAME], [ORDER_ID], [DATE], and [SUPPORT_CONTACT]; never insert imagined policy details.
    For sensitive cases, state when a human should take over. Do not request passwords, PINs, full card
    details, or unnecessary CNIC images.


    Provide English and [SECOND_LANGUAGE] versions where requested, adapting rather than literally translating.
    Mark promotional templates separately from service messages and include consent and frequency notes.
    Avoid pressure tactics, repeated unsolicited follow-ups, and fake scarcity.


    Finish with a mini style guide covering greetings, emoji restraint, response timing, escalation, and
    how staff should record customer consent or opt-out.

    '

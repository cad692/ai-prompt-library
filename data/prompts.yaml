- id: '109'
  slug: chain-research-brief
  title: Chain Step 1 - Research Brief
  category: chains
  difficulty: Intermediate
  usage: Define a precise research brief that can support the rest of a presentation workflow.
  use_case: Establish scope, audience, questions, and evidence standards before collecting sources.
  preview: 'Role: You are the research lead beginning a seven-step presentation chain; produce a decision-ready
    brief for [TOPIC]. Review any earlier context in [PREVIOUS_OUTPUT]. Because this is step one, it...'
  best_tools:
  - tool: ChatGPT
    reason: Can turn an initial request into a structured and testable research brief.
  tip: Resolve scope disputes now; later chain steps inherit them.
  expected_output: A signed-off research brief with questions, boundaries, and deliverables.
  tags:
  - chain
  - research
  - briefing
  - chain-step-1
  next_id: '110'
  prompt: 'Role: You are the research lead beginning a seven-step presentation chain; produce a decision-ready
    brief for [TOPIC].


    Review any earlier context in [PREVIOUS_OUTPUT]. Because this is step one, it may contain a rough
    request, stakeholder note, or “none.” Treat it as input to clarify, not as completed research. Define
    the intended audience [AUDIENCE], decision or learning goal [GOAL], delivery date [DEADLINE], and
    constraints [CONSTRAINTS].


    Write a brief containing: background, central research question, five subordinate questions, in-scope
    and out-of-scope boundaries, required geographies and dates, key definitions, stakeholder perspectives,
    acceptable source types, and evidence quality rules. List assumptions separately and turn important
    unknowns into clarification questions.


    Specify the downstream artifacts: evidence notes, synthesis, outline, slide draft, speaker notes,
    and final review. Add completion criteria so the next step can judge whether research coverage is
    adequate.


    Do not research the topic yet or fabricate sources. End with a clearly labelled “HANDOFF TO STEP 2”
    block containing the approved brief and a compact search plan that can be pasted as [PREVIOUS_OUTPUT].

    '
- id: '110'
  slug: chain-evidence-notes
  title: Chain Step 2 - Evidence Notes
  category: chains
  difficulty: Advanced
  usage: Convert the approved research brief into traceable, source-level evidence notes.
  use_case: Collect relevant claims and limitations before interpretation begins.
  preview: 'Goal: Act as the evidence analyst for step two; complete evidence notes from the research
    brief in [PREVIOUS_OUTPUT]. If that input lacks scope, audience, research questions, or source standards...'
  best_tools:
  - tool: Perplexity
    reason: Supports source discovery with links that can be checked against originals.
  tip: Save quotations with page numbers or section locations at capture time.
  expected_output: An evidence ledger mapped to the brief's research questions.
  tags:
  - chain
  - evidence
  - sources
  - chain-step-2
  next_id: '111'
  prompt: 'Goal: Act as the evidence analyst for step two; complete evidence notes from the research brief
    in [PREVIOUS_OUTPUT].


    If that input lacks scope, audience, research questions, or source standards, state what is missing
    and reconstruct a provisional brief from [TOPIC] before proceeding. For each supplied or discovered
    source [SOURCES], record author or organisation, title, date, URL or document identifier, source type,
    and access date.


    Build notes around the brief''s subordinate questions. Each note must contain one claim, a short exact
    quotation or precise location, relevant figures with units and period, the source''s method or basis,
    limitations, and a relevance label. Distinguish primary evidence, analysis, opinion, and promotional
    content. Record contradictory findings side by side instead of forcing agreement.


    Do not invent citations or imply that an inaccessible source was read. Mark weak coverage, stale evidence,
    and claims needing corroboration. Include a coverage matrix linking questions to sources.


    Finish with “HANDOFF TO STEP 3”: a clean evidence ledger, unresolved gaps, and a list of claims safe—or
    unsafe—to synthesise. This handoff must stand alone when reused as [PREVIOUS_OUTPUT].

    '
- id: '111'
  slug: chain-evidence-synthesis
  title: Chain Step 3 - Evidence Synthesis
  category: chains
  difficulty: Advanced
  usage: Turn verified evidence notes into findings, tensions, and calibrated implications.
  use_case: Interpret the evidence without losing uncertainty, disagreement, or source provenance.
  preview: 'Role: You are the synthesis editor at step three; transform [PREVIOUS_OUTPUT] from evidence
    notes into defensible findings. First check whether claims have source identifiers, dates, quotations
    or...'
  best_tools:
  - tool: Claude
    reason: Can compare a long evidence ledger and preserve nuanced disagreements.
  tip: A synthesis should explain relationships, not merely shorten every source.
  expected_output: Thematic findings with confidence, caveats, and traceable evidence IDs.
  tags:
  - chain
  - synthesis
  - findings
  - chain-step-3
  next_id: '112'
  prompt: 'Role: You are the synthesis editor at step three; transform [PREVIOUS_OUTPUT] from evidence
    notes into defensible findings.


    First check whether claims have source identifiers, dates, quotations or locations, and limitations.
    If not, flag the deficiency and avoid upgrading uncertain material. Group evidence by meaningful themes
    or causal relationships rather than by source. Within each theme, show convergence, contradiction,
    contextual differences, and missing voices.


    Produce four to seven findings. For each, write the finding in one sentence, list supporting evidence
    IDs, note counterevidence, assign a confidence level with a short justification, and explain why it
    matters to [AUDIENCE]. Keep observed facts separate from interpretation and recommendation. Do not
    turn correlation into causation or majority repetition into quality.


    Add a section for surprises, unresolved tensions, and claims excluded from use. Then formulate a coherent
    synthesis narrative of no more than [WORD_LIMIT], preserving important numbers and conditions.


    Conclude with “HANDOFF TO STEP 4”: ranked findings, evidence references, audience implications, and
    non-negotiable caveats. It must be understandable independently when inserted as [PREVIOUS_OUTPUT].

    '
- id: '112'
  slug: chain-presentation-outline
  title: Chain Step 4 - Presentation Outline
  category: chains
  difficulty: Intermediate
  usage: Shape synthesised findings into a persuasive and logically paced presentation outline.
  use_case: Decide the narrative sequence and slide jobs before writing slide content.
  preview: 'Goal: Serve as the presentation architect for step four; build an outline from the synthesis
    in [PREVIOUS_OUTPUT]. Confirm the audience [AUDIENCE], desired outcome [OUTCOME], time available...'
  best_tools:
  - tool: ChatGPT
    reason: Can organise findings into audience-focused narrative structures and transitions.
  tip: Give each proposed slide one job and one takeaway.
  expected_output: A slide-by-slide outline with evidence mapping and timing.
  tags:
  - chain
  - outline
  - presentation
  - chain-step-4
  next_id: '113'
  prompt: 'Goal: Serve as the presentation architect for step four; build an outline from the synthesis
    in [PREVIOUS_OUTPUT].


    Confirm the audience [AUDIENCE], desired outcome [OUTCOME], time available [DURATION], and delivery
    setting [SETTING]. If these are absent, state reasonable provisional assumptions. Choose a narrative
    shape—problem/response, question/answer, chronological, comparison, or another justified structure—based
    on the findings rather than habit.


    Propose [SLIDE_COUNT] slides. For each, specify its single purpose, headline takeaway, evidence IDs
    to use, suitable visual form, and transition to the next idea. Include an opening that earns attention
    without sensationalism, a short method or evidence note, space for contradictions, and a close aligned
    with the requested outcome.


    Check pacing against the duration and remove redundant slides. Do not draft full slide copy, design
    decoration, or speaker notes yet. Flag any finding that cannot be simplified without distortion.


    End with “HANDOFF TO STEP 5”: the numbered slide architecture, evidence-to-slide map, visual cautions,
    and exact narrative through-line. Make the block complete enough to function alone as [PREVIOUS_OUTPUT].

    '
- id: '113'
  slug: chain-slide-draft
  title: Chain Step 5 - Slide Draft
  category: chains
  difficulty: Intermediate
  usage: Draft concise slide content from an approved evidence-mapped presentation outline.
  use_case: Create readable slide copy and visual specifications without inventing evidence.
  preview: 'Role: You are the slide writer at step five; turn the approved outline in [PREVIOUS_OUTPUT]
    into a restrained, evidence-faithful draft. For every numbered slide, create a short assertion-style
    title...'
  best_tools:
  - tool: Microsoft Copilot
    reason: Can help draft presentation content within PowerPoint from a structured outline.
  tip: Keep nuance in evidence labels and reserve explanation for speaker notes.
  expected_output: A complete textual slide draft with source footers and visual directions.
  tags:
  - chain
  - slides
  - drafting
  - chain-step-5
  next_id: '114'
  prompt: 'Role: You are the slide writer at step five; turn the approved outline in [PREVIOUS_OUTPUT]
    into a restrained, evidence-faithful draft.


    For every numbered slide, create a short assertion-style title and only the minimum body copy needed
    for [AUDIENCE] to grasp the takeaway. Prefer one visual idea over stacked bullet lists. Where a chart
    is proposed, define chart type, categories, measure, unit, period, source, and the message it should
    reveal; never fabricate data points.


    Add source footers using the evidence IDs supplied. Preserve confidence labels and caveats where omission
    could mislead. Use [BRAND_GUIDANCE] for terminology and tone, but do not prioritise style over readability.
    Include an accessible text alternative for each substantive visual.


    Mark slides that require an image, permission, updated figure, or manual data build. Avoid tiny citations,
    decorative clutter, unsupported quotations, and exaggerated headlines. Keep detailed explanation out
    of slide bodies.


    Close with “HANDOFF TO STEP 6”: all slide titles, on-slide text, visual briefs, footers, and unresolved
    production tasks. The handoff must work as standalone [PREVIOUS_OUTPUT] for speaker-note creation.

    '
- id: '114'
  slug: chain-speaker-notes
  title: Chain Step 6 - Speaker Notes
  category: chains
  difficulty: Intermediate
  usage: Create natural speaker notes that add context without reading the slides aloud.
  use_case: Equip the presenter with transitions, nuance, timing, and likely audience questions.
  preview: 'Goal: Act as the presentation coach for step six; write speaker notes for the slide draft
    contained in [PREVIOUS_OUTPUT]. Use the presenter''s voice [VOICE], audience knowledge [AUDIENCE_LEVEL],
    and...'
  best_tools:
  - tool: Claude
    reason: Can maintain narrative continuity across a complete slide draft and its evidence context.
  tip: Rehearse aloud and replace any phrase that does not sound like the actual presenter.
  expected_output: Timed notes for every slide plus transitions and Q&A preparation.
  tags:
  - chain
  - speaker-notes
  - delivery
  - chain-step-6
  next_id: '115'
  prompt: 'Goal: Act as the presentation coach for step six; write speaker notes for the slide draft contained
    in [PREVIOUS_OUTPUT].


    Use the presenter''s voice [VOICE], audience knowledge [AUDIENCE_LEVEL], and total duration [DURATION].
    For each slide, provide an opening sentence, the explanation that is not already visible, evidence
    nuance, a natural transition, and an estimated speaking time. Expand abbreviations on first use and
    give pronunciation cues for unfamiliar names where verified.


    Notes should sound spoken, not like an essay. Preserve uncertainty and explain chart denominators
    or baselines that audiences may miss. Add a pause or interaction cue only when it advances the goal.
    Never introduce new facts without an evidence reference; mark unsupported additions [VERIFY].


    Prepare five likely questions, concise evidence-based responses, and an honest fallback for questions
    outside the research. Include reminders for accessibility, remote delivery, or handouts from [SETTING].


    Finish with “HANDOFF TO STEP 7”: the slide-linked notes, timing total, Q&A sheet, and all [VERIFY]
    items. Ensure this block can be reviewed independently as [PREVIOUS_OUTPUT].

    '
- id: '115'
  slug: chain-final-quality-review
  title: Chain Step 7 - Final Quality Review
  category: chains
  difficulty: Advanced
  usage: Conduct a final evidence, narrative, design, accessibility, and delivery review.
  use_case: Catch consequential weaknesses across the full presentation package before release.
  preview: 'Role: You are the independent quality reviewer for the final chain step; audit the presentation
    package in [PREVIOUS_OUTPUT] before release. Review against the original goal [GOAL], audience...'
  best_tools:
  - tool: ChatGPT
    reason: Can apply a structured multi-criterion review to slides and speaker notes.
  tip: A human owner should resolve every critical issue and rehearse the corrected deck.
  expected_output: A prioritised issue log, corrected items, and a release decision.
  tags:
  - chain
  - quality-review
  - presentation
  - chain-step-7
  next_id: null
  prompt: 'Role: You are the independent quality reviewer for the final chain step; audit the presentation
    package in [PREVIOUS_OUTPUT] before release.


    Review against the original goal [GOAL], audience [AUDIENCE], duration [DURATION], and source requirements
    [SOURCE_STANDARD]. If earlier artifacts are missing, list the resulting review limits. Test six dimensions
    separately: evidence accuracy and traceability; logic and narrative; slide readability; chart integrity;
    accessibility; and speaker-note timing and consistency.


    Create an issue log with slide number, severity—critical, major, or minor—problem, consequence, and
    exact corrective action. Check totals, units, dates, labels, quotations, source footers, caveats,
    contrast, text alternatives, terminology, transitions, and whether notes contradict slides. Identify
    any claim that exceeds its evidence.


    Apply safe wording corrections where possible, but do not silently repair unknown facts. Provide a
    rehearsal checklist and a final timing estimate with recommended cuts if over time.


    End with one release decision: ready, ready after listed fixes, or not ready. Summarise the blocking
    issues, named human approvals required, and the final files that should be archived.

    '

    For each step, state found, not found, or cannot access, with links where available. Never invent
    a browsing result. Classify the final status as true, mostly true, missing context, unsupported, false,
    or unresolved, and separate confidence from verdict.


    End with a two-sentence share-safe summary, a list of remaining checks, and the date of verification.
    If the claim could create immediate health, financial, legal, or safety harm, advise pausing action
    and consulting a qualified or official source.

    '

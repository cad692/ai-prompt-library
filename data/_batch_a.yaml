prompts:
  - id: "001"
    slug: decision-lens-builder
    title: Decision Lens Builder
    category: assistants
    difficulty: Intermediate
    usage: "Use this to compare important options without outsourcing the final decision."
    use_case: "A student choosing a degree or a professional weighing job offers can expose trade-offs, assumptions, and low-risk tests."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Supports an interactive comparison and can reorganize changing priorities quickly."
      - tool: Claude
        reason: "Handles nuanced personal context and long option descriptions well."
    tip: "Choose criteria before scoring options so a favourite does not quietly shape the framework."
    expected_output: "A balanced decision map with trade-offs, uncertainties, and next actions."
    tags: [decisions, trade-offs, priorities, planning]
    next_id: null
    prompt: |
      Act as a decision-framing partner whose goal is to clarify my choice, not make it for me.

      My decision is [DECISION]. The options are [OPTIONS]. My deadline is [DEADLINE], and the people affected are [STAKEHOLDERS]. What matters to me includes [VALUES_OR_PRIORITIES]. My practical limits are [TIME_MONEY_LOCATION_OR_FAMILY_CONSTRAINTS].

      Begin by restating the decision neutrally. Identify any false either/or framing and add a realistic hybrid or reversible option if one exists. Then build a decision map with:
      - five to seven criteria derived from my priorities;
      - a suggested weight for each criterion, clearly marked as editable;
      - evidence supporting and challenging each option;
      - unknowns that could change the outcome;
      - the cost of delaying the choice.

      Do not pretend subjective scores are facts. Show a concise, visible rationale for each proposed weight and rating. Separate facts I supplied from your assumptions.

      Finish with two low-risk experiments I can run before [DEADLINE], three questions to ask relevant people, and a short reflection: “Which regret would be easier to live with, and why?” End by reminding me that I retain the decision.
  - id: "002"
    slug: realistic-week-designer
    title: Realistic Week Designer
    category: assistants
    difficulty: Beginner
    usage: "Use this to turn crowded commitments into a workable week with recovery time."
    use_case: "A university student or early-career professional can plan classes, work, commuting, family duties, and rest in one realistic schedule."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Turns task lists and calendar constraints into clear schedules through conversation."
      - tool: Microsoft Copilot
        reason: "Works well when planning information already sits in Microsoft productivity apps."
    tip: "Estimate each task pessimistically and keep at least one buffer block unassigned."
    expected_output: "A seven-day plan with priorities, buffers, and a fallback version."
    tags: [weekly-planning, time-management, priorities, wellbeing]
    next_id: null
    prompt: |
      You are my realistic weekly planner, protecting both important outcomes and sustainable energy.

      Plan the week of [DATES]. Fixed commitments: [CLASSES_MEETINGS_COMMUTE_FAMILY_DUTIES]. Tasks and deadlines: [TASKS]. My strongest focus hours are [FOCUS_HOURS], typical energy pattern is [ENERGY_PATTERN], and available study or work time is [AVAILABLE_TIME]. I also need [SLEEP_EXERCISE_PRAYER_MEALS_OR_REST].

      First sort tasks into Must Finish, Should Advance, and Can Wait. Flag any workload that cannot fit honestly; do not compress impossible work into tiny blocks. Create a Monday-to-Sunday schedule using time ranges, task names, and a clear stopping point. Place demanding work in high-energy periods and group small administrative tasks.

      Include:
      1. one daily buffer;
      2. a maximum of three priority outcomes per day;
      3. a “not this week” list;
      4. a 15-minute weekly review;
      5. a reduced plan for a day disrupted by transport, illness, or load-shedding.

      Close with the first action for Monday, written so it takes under ten minutes to begin. Keep the plan practical for my context in [CITY_OR_SETTING].
  - id: "003"
    slug: skill-practice-coach
    title: Skill Practice Coach
    category: assistants
    difficulty: Intermediate
    usage: "Use this to learn a skill through diagnosis, practice, feedback, and reflection."
    use_case: "A learner can build confidence in presentations, spreadsheets, coding, writing, or another practical skill without receiving dishonest completed work."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Provides adaptive exercises, immediate feedback, and conversational coaching."
      - tool: Gemini
        reason: "Can support learning from mixed text and visual examples when supplied."
    tip: "Attempt each exercise before revealing the model example; productive struggle improves recall."
    expected_output: "A tailored mini-lesson, practice task, feedback method, and follow-up plan."
    tags: [learning, coaching, practice, feedback, skills]
    next_id: null
    prompt: |
      Serve as a practice-first learning coach helping me improve [SKILL] for [REAL_WORLD_GOAL].

      Before teaching, ask me exactly four questions: my current level, previous attempts, time available, and the situation where I must use the skill. Wait for my answers. Then give me a quick diagnostic task that takes no more than [MINUTES] minutes.

      Use my response to choose one priority weakness. Teach that point with a simple explanation, one analogy relevant to life in [PAKISTAN_CONTEXT_OR_INDUSTRY], and one worked example. Do not complete graded coursework or impersonate my own work; coach me to produce it.

      Next, create a three-round practice ladder:
      - Round A: guided practice with hints;
      - Round B: a changed situation with fewer hints;
      - Round C: a realistic challenge completed independently.

      After each answer, use “Keep / Change / Try” feedback. Ask me to explain one decision in my own words before moving on. At the end, summarize the error pattern you observed, give one five-minute drill for tomorrow, and propose a spaced review on [REVIEW_DATE]. Adjust difficulty if I score below or above [SUCCESS_THRESHOLD].
  - id: "004"
    slug: tone-safe-email-rewriter
    title: Tone-Safe Email Rewriter
    category: assistants
    difficulty: Beginner
    usage: "Use this to improve an email while preserving facts, intent, and your voice."
    use_case: "A student contacting faculty or an employee writing to a manager can sound clear and respectful without becoming stiff or vague."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Quickly rewrites short messages across professional tones while following constraints."
      - tool: Claude
        reason: "Useful for preserving nuance and intent in sensitive correspondence."
    tip: "Name the relationship and desired response; tone depends more on context than vocabulary."
    expected_output: "Two polished email versions plus a brief explanation of tone choices."
    tags: [email, tone, workplace, communication]
    next_id: null
    prompt: |
      Rewrite my email as a careful communications editor while preserving every verified fact and my intended request.

      Draft: [PASTE_EMAIL]
      Recipient and relationship: [RECIPIENT_CONTEXT]
      Desired outcome: [OUTCOME]
      Tone: [WARM_DIRECT_FORMAL_DIPLOMATIC]
      Cultural or workplace considerations: [CONSIDERATIONS]
      Maximum length: [WORD_LIMIT]

      Apply these non-negotiable constraints: do not invent dates, promises, attachments, titles, or reasons; do not add exaggerated praise; retain any necessary Urdu terms; and keep the request easy to answer. If the original sounds accusatory, remove blame without hiding the issue.

      Produce Version A as the safest professional rewrite. Produce Version B as a slightly warmer alternative. For each, provide a subject line and complete email. Afterward, list no more than four important edits in the form “Changed X → Y because…”.

      Check names, dates, pronouns, and the requested action against my draft. If an essential detail is absent, insert [CONFIRM DETAIL] rather than guessing. End with a one-line recommendation naming which version better suits [RECIPIENT_CONTEXT]. Avoid clichés such as “I hope this email finds you well” unless I explicitly request them.
  - id: "005"
    slug: meeting-readiness-brief
    title: Meeting Readiness Brief
    category: assistants
    difficulty: Intermediate
    usage: "Use this to enter a meeting with clear outcomes, questions, and fallback positions."
    use_case: "A project team member can prepare for a client, supervisor, faculty, or internal meeting when time and attention are limited."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Synthesizes lengthy background notes into a coherent preparation brief."
      - tool: ChatGPT
        reason: "Supports agenda design and realistic rehearsal of likely questions."
    tip: "Define one minimum acceptable outcome so the meeting remains useful even if time runs short."
    expected_output: "A one-page meeting brief with agenda, questions, risks, and follow-up language."
    tags: [meetings, preparation, agenda, stakeholders]
    next_id: null
    prompt: |
      Act as my meeting strategist and prepare a concise briefing for [MEETING_NAME] on [DATE].

      Context: [BACKGROUND]
      Participants and roles: [PARTICIPANTS]
      My desired outcome: [IDEAL_OUTCOME]
      Minimum acceptable outcome: [MINIMUM_OUTCOME]
      Sensitive points: [SENSITIVE_POINTS]
      Evidence or documents available: [MATERIALS]
      Duration: [MINUTES]

      Build a one-page readiness brief. Open with a two-sentence purpose statement I can say aloud. Arrange an agenda that fits the stated duration, including explicit minutes for decisions and questions. Add a stakeholder read: what each participant may care about, labelled as either known or inferred.

      Create five high-value questions, ordered from exploratory to decision-focused. Anticipate three difficult questions I may receive and draft honest, compact responses that do not fabricate missing data. For each sensitive point, suggest neutral wording and a phrase for redirecting discussion if it becomes unproductive.

      Add a mini decision log with columns for decision, owner, deadline, and evidence needed. Finish with a 30-second closing summary and a follow-up email skeleton. If the meeting goal is too broad for [MINUTES], explicitly recommend what to defer.
  - id: "006"
    slug: constraint-led-idea-lab
    title: Constraint-Led Idea Lab
    category: assistants
    difficulty: Intermediate
    usage: "Use this to generate feasible ideas within real limits instead of generic brainstorming."
    use_case: "A student society, small business, NGO, or project team can create options suited to a tight budget and local conditions."
    preview_override: null
    best_tools:
      - tool: Gemini
        reason: "Generates and reorganizes diverse concepts from detailed contextual constraints."
      - tool: DeepSeek
        reason: "Offers capable text brainstorming and structured option comparison."
    tip: "Include one unusual constraint; it often produces more distinctive ideas than asking for creativity."
    expected_output: "A diverse shortlist of feasible concepts with tests and rejection reasons."
    tags: [brainstorming, constraints, innovation, feasibility]
    next_id: null
    prompt: |
      Run a constraint-led idea lab for the goal [GOAL], prioritising usefulness over sheer quantity.

      The audience is [AUDIENCE]. We have [BUDGET], [TIME], [TEAM_SIZE], and access to [RESOURCES]. We must respect [NON_NEGOTIABLES], avoid [EXCLUSIONS], and account for [LOCAL_CONTEXT]. Success means [MEASURE_OF_SUCCESS].

      Generate ideas in three deliberately different waves:
      Wave 1 — five dependable ideas using familiar methods.
      Wave 2 — five combinations that borrow a mechanism from [OTHER_FIELD].
      Wave 3 — three “reverse assumption” ideas that challenge how this is normally done.

      Each idea must fit on three lines: concept, why it fits the constraints, and its weakest point. Do not repeat the same core mechanism under new names.

      Next, apply a hard filter: eliminate anything that exceeds a non-negotiable limit and explain each rejection in one sentence. Score the survivors from 1–5 for impact, effort, inclusion, and testability. Select a portfolio of three: one safe, one balanced, and one bold.

      For each finalist, design a [DAYS]-day pilot requiring no more than [PILOT_BUDGET]. End with the single piece of evidence that would make us stop, adapt, or scale each pilot.
  - id: "007"
    slug: interview-pressure-rehearsal
    title: Interview Pressure Rehearsal
    category: assistants
    difficulty: Advanced
    usage: "Use this to rehearse an interview through realistic role-play and direct critique."
    use_case: "A graduate or professional can practise behavioural and technical answers for a target role, including difficult follow-up questions."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Maintains interactive interviewer role-play and gives targeted response feedback."
      - tool: Meta AI
        reason: "Provides accessible conversational practice for common interview scenarios."
    tip: "Answer aloud before typing a summary to practise delivery as well as content."
    expected_output: "An interactive mock interview with scored critique and improved answer outlines."
    tags: [interview, role-play, careers, feedback, practice]
    next_id: null
    prompt: |
      Role-play a demanding but fair interviewer for [ROLE] at [ORGANISATION_TYPE].

      Use this vacancy description: [JOB_DESCRIPTION]. My background is [BACKGROUND], and I want special practice on [WEAK_AREA]. Conduct an eight-question interview one question at a time. Wait for my response after every question. Mix behavioural, situational, role-specific, and ethical judgement questions; do not reveal the next question early.

      Stay in interviewer character during each exchange. Ask one probing follow-up whenever my answer is vague, unsupported, or avoids the question. Never invent experience for me.

      After each response, briefly score four dimensions from 1–5: relevance, evidence, structure, and delivery. Give one strength and one precise correction, but let me retry before showing any model outline.

      At the end, leave character and become a hiring-panel coach. Identify recurring patterns across my answers. Select my weakest answer and provide:
      - a STAR or role-appropriate outline using only facts I supplied;
      - two stronger opening sentences;
      - the missing evidence I should verify;
      - a 60-second practice version.

      Finish with a realistic hiring signal—strong, mixed, or weak—and explain it against [SELECTION_CRITERIA], not personal preference.
  - id: "008"
    slug: two-level-concept-explainer
    title: Two-Level Concept Explainer
    category: assistants
    difficulty: Beginner
    usage: "Use this to understand a concept first simply and then at professional depth."
    use_case: "A learner can build intuition before encountering technical vocabulary, equations, caveats, or domain-specific applications."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Adapts explanations to different knowledge levels and supports follow-up questions."
      - tool: Gemini
        reason: "Explains concepts using varied examples and can work with supplied visuals."
    tip: "After reading both levels, explain the connection between them in your own words."
    expected_output: "A teen-friendly explanation, expert treatment, and bridge between the two."
    tags: [explanation, learning, concepts, expertise]
    next_id: null
    prompt: |
      Teach me [CONCEPT] twice: first as if I am 15, then as if I am entering the profession.

      My current knowledge is [WHAT_I_ALREADY_KNOW]. I need this for [PURPOSE], in the field of [FIELD]. Use examples relevant to [LOCAL_OR_PERSONAL_CONTEXT].

      Part One — Build Intuition
      Explain the idea in plain language with one everyday analogy and a small concrete example. Define no more than three essential terms. Include one common misunderstanding and a quick “check yourself” question. Avoid saying something is “just simple” or “obvious.”

      Part Two — Add Expert Precision
      Revisit the same example using correct terminology, mechanisms, assumptions, and limitations. If equations matter, define every symbol and walk through a tiny numerical example. Distinguish what experts generally agree on from what depends on context.

      The Bridge
      Map each element of the first analogy to the technical explanation and state where the analogy breaks down. Show three visible reasoning steps for applying the concept to [APPLICATION], without claiming access to hidden internal reasoning.

      End with a five-item ladder: what to learn next, from easiest to hardest. Ask me one transfer question that requires applying the concept to a new situation; do not answer it until I try.
  - id: "009"
    slug: habit-experiment-partner
    title: Habit Experiment Partner
    category: assistants
    difficulty: Intermediate
    usage: "Use this to design a small, compassionate habit experiment grounded in your routine."
    use_case: "A busy learner or worker can improve sleep, movement, focus, or study consistency without unrealistic motivation plans."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Supports iterative coaching, check-ins, and practical adjustment of routines."
    tip: "Track whether you started the habit, not whether every session was perfect."
    expected_output: "A two-week habit experiment with triggers, tracking, recovery, and review."
    tags: [habits, wellbeing, behaviour, consistency]
    next_id: null
    prompt: |
      Be a compassionate behaviour-change coach helping me test, not perfect, the habit [HABIT].

      Here is my normal routine: [ROUTINE]. The habit matters because [PERSONAL_REASON]. Likely obstacles include [OBSTACLES], and I can realistically spend [TIME_OR_MONEY]. Previous attempts went like this: [PAST_ATTEMPTS]. Avoid medical diagnosis or treatment advice; if my goal raises a health concern, recommend an appropriate qualified professional.

      Design a 14-day experiment around the smallest meaningful version of the habit. Specify the cue, action, location, duration, and immediate reward. Give three versions: minimum for difficult days, standard, and stretch. Attach the habit to an existing routine rather than relying on motivation.

      Create a tracking line I can copy daily using only four fields. Set a success threshold that allows imperfect days. Write “if–then” responses for my top three obstacles and a restart rule after a missed day that contains no guilt language.

      On Day 7, ask me to review evidence and choose: continue, simplify, change the cue, or stop. On Day 14, evaluate fit, consistency, and wellbeing separately. Finish with one supportive message I can send myself after a setback, using my stated reason rather than generic inspiration.
  - id: "010"
    slug: respectful-conflict-message
    title: Respectful Conflict Message
    category: assistants
    difficulty: Advanced
    usage: "Use this to draft a calm message about conflict while keeping boundaries clear."
    use_case: "A student, colleague, or team lead can address missed work, disrespect, or misunderstanding without escalating the situation."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Handles sensitive interpersonal nuance and preserves boundaries in careful drafts."
      - tool: ChatGPT
        reason: "Produces alternative tones and supports rehearsal of likely replies."
    tip: "Describe observable behaviour and impact; avoid guessing the other person's motives."
    expected_output: "A de-escalating message, firmer alternative, and response plan."
    tags: [conflict, boundaries, messaging, communication]
    next_id: null
    prompt: |
      Help me draft a respectful conflict message that names the issue without attacking the person.

      Relationship: [RELATIONSHIP]
      What happened, using observable facts: [EVENTS]
      Impact on me or the work: [IMPACT]
      What I need next: [REQUEST_OR_BOUNDARY]
      Communication channel: [WHATSAPP_EMAIL_SMS_OR_OTHER]
      Safety or power concerns: [CONCERNS]

      Before drafting, separate facts from interpretations in two short lists. Flag loaded labels, mind-reading, threats, or claims I cannot verify. If there is a credible safety risk, harassment, or serious power imbalance, do not encourage direct confrontation; suggest seeking support through [TRUSTED_PERSON_OR_FORMAL_CHANNEL].

      Write three components: a neutral opening, an “observation–impact–request” core, and a closing that allows a practical response. Keep the complete message under [WORD_LIMIT] words. Then provide a firmer version for use if the first request has already been ignored.

      Role-play two plausible replies from the recipient: one defensive and one constructive. Under each, draft a calm one-sentence response that repeats the boundary without debating motives. Finally, run a heat check: identify any phrase that could inflame the exchange and replace it. Preserve my natural formality and any necessary Urdu greeting in [LANGUAGE_PREFERENCE].
  - id: "011"
    slug: three-source-triangulator
    title: Three-Source Triangulator
    category: research
    difficulty: Advanced
    usage: "Use this to compare independent sources before trusting a consequential claim."
    use_case: "A researcher or professional can test a policy, health, market, or education claim against varied evidence instead of one repeated story."
    preview_override: null
    best_tools:
      - tool: Perplexity
        reason: "Finds current web sources and exposes citations for direct inspection."
      - tool: Gemini
        reason: "Can compare web-grounded material and organise disagreements across sources."
    tip: "Independence matters more than quantity; three articles repeating one press release count as one source."
    expected_output: "A triangulation matrix showing agreement, conflict, provenance, and confidence."
    tags: [research, triangulation, sources, verification]
    next_id: null
    prompt: |
      Act as an evidence triangulator investigating the claim [CLAIM] for [DECISION_OR_PROJECT].

      Scope the claim by geography [LOCATION], period [DATE_RANGE], population [POPULATION], and key terms [DEFINITIONS]. If you have web access, locate at least three genuinely independent source types: one primary source or dataset, one scholarly or technical analysis, and one credible reporting or institutional source. If browsing is unavailable, stop after giving me a search plan; never invent citations.

      For every candidate source, record title, author or institution, date, direct link or identifier, source type, and who produced the underlying evidence. Trace syndicated stories, summaries, and press releases back to their origin.

      Build a triangulation matrix with rows for the claim’s major components and columns for each source. Use “supports,” “qualifies,” “contradicts,” or “not addressed,” followed by a short quoted or precisely paraphrased basis. Explain visible reasoning steps used to judge independence, relevance, and methodological strength.

      Highlight conflicts caused by different definitions, samples, dates, or incentives. Assign confidence—high, medium, low, or unresolved—to each component, with a one-sentence justification. Conclude with what can responsibly be said now, what cannot, and the next source most likely to change the assessment.
  - id: "012"
    slug: literature-landscape-mapper
    title: Literature Landscape Mapper
    category: research
    difficulty: Advanced
    usage: "Use this to map a field's themes, methods, debates, and landmark studies."
    use_case: "A student beginning a dissertation or professional review can understand how a topic is organised before reading narrowly."
    preview_override: null
    best_tools:
      - tool: Perplexity
        reason: "Supports discovery of scholarly and institutional sources with inspectable links."
      - tool: NotebookLM
        reason: "Synthesizes themes across a user-provided collection while grounding answers in those sources."
    tip: "Build the map from abstracts and metadata first, then read pivotal papers in full."
    expected_output: "A thematic literature map with clusters, debates, methods, and reading priorities."
    tags: [literature-review, themes, scholarship, mapping]
    next_id: null
    prompt: |
      Map the research landscape around [TOPIC] so I can plan an ethical, focused literature review.

      Boundaries: [DISCIPLINE], [GEOGRAPHY], [YEARS], [POPULATION], and [LANGUAGES]. My purpose is [COURSE_DISSERTATION_POLICY_OR_WORK_PROJECT]. Use only sources I provide in [SOURCE_LIST] or sources you can actually retrieve and cite. Mark any item known only from metadata; do not imply that you read a full paper when you did not.

      Organise the field as a map, not a chronological essay:
      - major conceptual clusters and how they connect;
      - recurring research methods and data sources;
      - landmark or frequently cited works;
      - active disagreements;
      - underrepresented settings, especially Pakistan or comparable contexts where relevant.

      For each cluster, name two to four representative sources with stable links, DOI, or complete citation details. Add a one-sentence reason each source belongs there. Distinguish empirical findings, theoretical proposals, and reviews.

      Then draw a text-based pathway for reading: five foundation items, three contrasting items, and two recent items. Explain the selection criteria. End with six database search strings using synonyms and Boolean operators, plus inclusion and exclusion rules I can apply consistently. Remind me to verify every citation and read original sources before making academic claims.
  - id: "013"
    slug: claim-evidence-auditor
    title: Claim Evidence Auditor
    category: research
    difficulty: Intermediate
    usage: "Use this to separate claims, evidence, assumptions, and overstatement in a text."
    use_case: "A learner reviewing an article, report, or draft can see exactly which statements are well supported and which need qualification."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Handles long passages and nuanced distinctions between claims and support."
      - tool: ChatGPT
        reason: "Extracts structured claim-evidence relationships from pasted material."
    tip: "Audit one section at a time so evidence links remain precise and traceable."
    expected_output: "A claim-versus-evidence table with support ratings and revision advice."
    tags: [claims, evidence, critical-reading, audit]
    next_id: null
    prompt: |
      Audit [PASTED_TEXT_OR_DOCUMENT] as a critical reader, separating what is asserted from what is demonstrated.

      The intended audience is [AUDIENCE], and the standard of evidence is [ACADEMIC_POLICY_BUSINESS_OR_OTHER]. Work only from the supplied text and references unless I explicitly enable research. Do not fill evidence gaps from memory.

      Create a table with these columns: exact or shortened claim, claim type, cited evidence, evidence-to-claim fit, hidden assumption, severity, and recommended repair. Classify claim type as factual, causal, predictive, normative, or interpretive. Rate fit as direct, partial, indirect, absent, or cannot verify.

      Pay special attention to absolute language, causal conclusions from correlation, tiny or unrepresentative samples, old data presented as current, and references that support a nearby but different point. Preserve paragraph or page locations so I can find each issue.

      After the table, select the three highest-risk claims. For each, give a constraint-based rewrite that is accurate without becoming evasive: retain the core meaning, add only justified qualifiers, and stay within [MAX_WORDS] words. Finish with a short evidence shopping list naming the source type—not a fabricated citation—needed to strengthen each unresolved claim.
  - id: "014"
    slug: cited-brief-producer
    title: Cited Brief Producer
    category: research
    difficulty: Intermediate
    usage: "Use this to create a current web brief whose citations can be checked."
    use_case: "A professional can rapidly understand an emerging issue before a meeting while retaining a clear route back to original sources."
    preview_override: null
    best_tools:
      - tool: Perplexity
        reason: "Specializes in current web research with inline source links."
      - tool: Microsoft Copilot
        reason: "Can produce web-grounded summaries with linked sources for verification."
    tip: "Open every citation and confirm that it supports the exact sentence attached to it."
    expected_output: "A concise, citation-rich brief with verified links and uncertainty labels."
    tags: [web-research, citations, briefing, current-events]
    next_id: null
    prompt: |
      Produce a decision-ready cited brief on [TOPIC] for [AUDIENCE] as of [CUT_OFF_DATE].

      Answer this central question: [QUESTION]. Prioritise primary documents, official statistics, peer-reviewed research, and reputable reporting. Search across viewpoints and include Pakistan-specific evidence where relevant. Do not cite search-result snippets, AI summaries, or inaccessible references as if checked.

      Structure the brief in this order:
      1. Bottom line in 80 words or fewer.
      2. Five key findings, each followed by an inline link that directly supports it.
      3. “What changed recently,” with dates.
      4. Stakeholder implications for [STAKEHOLDERS].
      5. Two unresolved questions.

      Beside every finding, label evidence as primary, secondary, or commentary. Where sources disagree, present both positions and identify the likely reason without forcing false balance. Quote sparingly and never alter quoted meaning.

      Add a source ledger listing title, publisher, publication date, access date, URL, and one-line relevance. Test each URL if your tools allow it. If a claim lacks adequate support, mark [EVIDENCE NOT FOUND] and revise the bottom line accordingly. End with three verification actions the reader should take before using the brief for a high-stakes decision.
  - id: "015"
    slug: rival-explanations-workbench
    title: Rival Explanations Workbench
    category: research
    difficulty: Advanced
    usage: "Use this to test multiple explanations for an observation without anchoring early."
    use_case: "A researcher or manager can investigate falling performance, changing behaviour, or unexpected results before choosing an intervention."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Generates competing hypotheses and structures discriminating tests interactively."
      - tool: Claude
        reason: "Maintains nuanced causal models across substantial background material."
    tip: "Seek evidence that distinguishes hypotheses, not more evidence compatible with all of them."
    expected_output: "A set of competing explanations with predictions, tests, and update rules."
    tags: [hypotheses, causality, reasoning, experiments]
    next_id: null
    prompt: |
      Act as a hypothesis challenger examining why [OBSERVATION_OR_OUTCOME] occurred.

      Known context: [CONTEXT]. Available data: [DATA]. Current favoured explanation: [CURRENT_BELIEF]. Constraints on investigation: [TIME_ACCESS_ETHICS_OR_BUDGET].

      Generate at least five meaningfully different explanations, including one measurement problem, one external factor, one process or system cause, and one explanation that contradicts my current belief. Avoid merely rephrasing the same cause.

      For each explanation provide: causal mechanism, expected pattern if true, evidence already consistent with it, evidence that would weaken it, and the cheapest ethical discriminating test. Then create a prediction matrix where rows are observations we could collect and columns are hypotheses. Indicate which result would favour which explanation.

      Use Bayesian-style updating in plain language: state a provisional prior confidence as low, medium, or high and explain the basis openly. Do not invent numerical probabilities from thin evidence.

      Identify confounders and reverse-causality risks. Recommend an investigation sequence that maximises information before cost. Close with a pre-commitment: “If [RESULT] appears, reduce confidence in [HYPOTHESIS]; if [OTHER_RESULT] appears, increase it.” Keep intervention advice separate until evidence meaningfully narrows the field.
  - id: "016"
    slug: headline-study-crosscheck
    title: Headline Study Crosscheck
    category: research
    difficulty: Intermediate
    usage: "Use this to compare news coverage with the study or data it describes."
    use_case: "A reader can check whether a viral headline accurately represents research findings, limitations, and relevance to their own context."
    preview_override: null
    best_tools:
      - tool: Perplexity
        reason: "Can locate both current coverage and the linked original research."
      - tool: NotebookLM
        reason: "Grounds comparison in uploaded news and study documents with source references."
    tip: "Read the study's methods and limitations before deciding whether the headline is fair."
    expected_output: "A side-by-side verdict on headline accuracy, study quality, and applicability."
    tags: [news, studies, media-literacy, verification]
    next_id: null
    prompt: |
      Compare the news story [NEWS_URL_OR_TEXT] with the original study or dataset [STUDY_URL_OR_FILE] as a media-literacy analyst.

      First confirm that the story actually refers to this study. Record the headline, outlet, date, study title, authors, venue, and identifier. If the original cannot be accessed, state that limitation and avoid a definitive verdict.

      Use a side-by-side format covering: population and sample size, research design, measured outcome, timeframe, effect size, uncertainty, funding or conflicts, and limitations. Quote the news wording beside the relevant study wording where possible.

      Check for common distortions: correlation described as causation, relative risk without absolute risk, animal or laboratory findings generalised to humans, preliminary work treated as settled, subgroup results presented as universal, and applicability to Pakistan assumed without evidence.

      Give the headline one verdict: accurate, mostly accurate, overstated, misleading, or unverifiable. Justify it with three concise evidence points. Then rewrite the headline and a 100-word summary to match the study more faithfully without draining all interest. End with two questions readers should ask before changing behaviour based on this finding, especially if it concerns health, finance, or safety.
  - id: "017"
    slug: research-question-sharpener
    title: Research Question Sharpener
    category: research
    difficulty: Beginner
    usage: "Use this to turn a broad topic into a feasible and ethical research question."
    use_case: "A student can narrow an initial interest into a question suited to available time, access, and academic level."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Supports iterative questioning and refinement across research designs."
      - tool: Gemini
        reason: "Generates alternative framings and identifies variables or scope boundaries."
    tip: "A narrower question answered well is stronger than a broad question answered vaguely."
    expected_output: "Several refined questions with feasibility checks and a recommended final version."
    tags: [research-question, scope, methods, feasibility]
    next_id: null
    prompt: |
      Guide me from the broad topic [TOPIC] to a researchable question appropriate for [LEVEL_OR_PROGRAMME].

      Ask me questions first and wait for my response. Ask no more than six, covering: what puzzles me, intended population, setting, timeframe, data access, and ethical or practical limits. Do not propose final questions until I answer.

      After my reply, extract the key phenomenon, relationship or experience, unit of analysis, and boundary conditions. Offer four distinct question forms: descriptive, comparative, explanatory, and exploratory. Each must be answerable rather than merely discussing a theme.

      Evaluate each candidate using FINER-style criteria: feasible, interesting, novel enough for the context, ethical, and relevant. Also identify the likely evidence and method—without pretending the method is already fixed. Flag questions that imply causation when the available design can show only association.

      Recommend one question and explain why it best fits [TIME_AVAILABLE], [WORD_LIMIT], and [ACCESS]. Provide a tighter version and a broader backup version. Then list three key terms with synonyms for an initial literature search. Finish by naming one tempting but unmanageable direction to exclude, and one supervisor question I should ask before committing.
  - id: "018"
    slug: annotated-source-cards
    title: Annotated Source Cards
    category: research
    difficulty: Intermediate
    usage: "Use this to create evaluative annotations from sources you have actually read."
    use_case: "A learner can organise readings for an assignment while keeping summaries, evaluations, and relevance notes distinct."
    preview_override: null
    best_tools:
      - tool: NotebookLM
        reason: "Creates source-grounded notes from an uploaded collection and links responses to evidence."
      - tool: Claude
        reason: "Processes long papers and produces nuanced structured annotations."
    tip: "Add page numbers while reading; locating evidence later is harder than recording it now."
    expected_output: "Consistent annotated bibliography cards with summary, evaluation, and relevance."
    tags: [bibliography, annotations, sources, academic-writing]
    next_id: null
    prompt: |
      Create rigorous annotated source cards for [RESEARCH_TOPIC] using only [UPLOADED_SOURCES_OR_PASTED_TEXT].

      Citation style: [APA_MLA_CHICAGO_OR_OTHER]. Target annotation length: [WORDS] words. My research question is [QUESTION], and my intended argument or inquiry is [DIRECTION]. Never fabricate missing bibliographic fields, page numbers, quotations, DOIs, or findings; mark missing data as [VERIFY].

      For each source, produce a card containing:
      - a formatted citation;
      - the source’s purpose and central claim;
      - method, sample, or evidence base;
      - two major findings with page locations when available;
      - one strength and one limitation;
      - relevance to my question;
      - relationship to another source in the set.

      Keep summary and evaluation in separate labelled paragraphs. If the source is commentary rather than research, adapt the method field honestly. Add three keywords not already obvious from the title.

      After all cards, group sources into conversation clusters: agreement, tension, extension, and context. Identify duplicated evidence where several sources rely on the same dataset. Finish with a verification queue of incomplete citations and claims I must inspect in the originals. The annotations must support my own reading and writing, not replace them.
  - id: "019"
    slug: evidence-gap-radar
    title: Evidence Gap Radar
    category: research
    difficulty: Advanced
    usage: "Use this to identify defensible research gaps without claiming that nothing exists."
    use_case: "A thesis writer or programme team can find neglected populations, methods, contexts, or contradictions worth investigating."
    preview_override: null
    best_tools:
      - tool: NotebookLM
        reason: "Compares patterns and omissions across a supplied body of literature."
      - tool: Perplexity
        reason: "Helps test whether an apparent gap persists in recent discoverable research."
    tip: "Describe a bounded gap in a searched corpus, never an absolute absence across all research."
    expected_output: "A ranked gap map with evidence, search checks, and viable study directions."
    tags: [research-gaps, literature, thesis, evidence]
    next_id: null
    prompt: |
      Act as an evidence-gap analyst for the literature collection [CORPUS_OR_SOURCE_LIST] on [TOPIC].

      My scope is [YEARS], [GEOGRAPHY], [POPULATION], and [DISCIPLINE]. Begin by defining what would count as a gap: missing context, neglected population, methodological weakness, inconsistent result, untested mechanism, outdated evidence, or implementation problem. Do not equate “few papers I saw” with “no research exists.”

      Build a coverage grid crossing major themes with populations, locations, methods, and time periods. Populate it only from traceable sources and include citations or source IDs. Mark cells as well covered, partly covered, apparently sparse, or not assessed.

      For each apparent gap, perform an adversarial check: propose two search strings, likely databases, alternate terminology, and neighbouring disciplines where overlooked work may exist. If browsing is available, report what that check found; otherwise label it pending.

      Rank the surviving gaps by significance, originality within scope, feasibility, ethical access, and value for Pakistan or [TARGET_CONTEXT]. For the top three, draft a cautious gap statement, a possible research question, suitable evidence, and a reason the study matters. End with wording to avoid—such as “no one has studied”—and a defensible replacement tied to the reviewed corpus.
  - id: "020"
    slug: portable-fact-check-plan
    title: Portable Fact-Check Plan
    category: research
    difficulty: Beginner
    usage: "Use this to verify a claim systematically before sharing or acting on it."
    use_case: "A student or professional can check a social post, forwarded message, statistic, quote, image caption, or workplace claim."
    preview_override: null
    best_tools:
      - tool: Perplexity
        reason: "Locates current sources and provides links that users can inspect directly."
      - tool: Gemini
        reason: "Supports web-grounded checking and can analyse supplied images or text."
    tip: "Search the exact claim and also search for the strongest plausible contradiction."
    expected_output: "A reusable verification checklist and a transparent verdict for one claim."
    tags: [fact-checking, misinformation, verification, media-literacy]
    next_id: null
    prompt: |
      Act as a fact-checking guide and help me verify [CLAIM_OR_CONTENT] before I share or use it.

      The content came from [SOURCE_OR_PLATFORM] on [DATE_SEEN], and the relevant location is [LOCATION]. The decision or risk attached to it is [WHY_IT_MATTERS]. If an image or video is involved, I will provide [FILE_OR_LINK].

      Walk through this checklist and show concise visible reasoning at each step:
      1. Rewrite the claim into independently testable parts.
      2. Identify the earliest traceable source, not merely the latest repost.
      3. Check date, location, creator, and original context.
      4. Seek primary evidence and two independent credible confirmations.
      5. Search for corrections, retractions, satire labels, or manipulated media.
      6. Compare exact numbers, units, and quotations.

      For each step, state found, not found, or cannot access, with links where available. Never invent a browsing result. Classify the final status as true, mostly true, missing context, unsupported, false, or unresolved, and separate confidence from verdict.

      End with a two-sentence share-safe summary, a list of remaining checks, and the date of verification. If the claim could create immediate health, financial, legal, or safety harm, advise pausing action and consulting a qualified or official source.
  - id: "021"
    slug: pdf-active-study-notes
    title: PDF Active Study Notes
    category: documents
    difficulty: Beginner
    usage: "Use this to transform an uploaded reading into notes that support active recall."
    use_case: "A student can study a chapter or paper efficiently while keeping summaries connected to exact pages."
    preview_override: null
    best_tools:
      - tool: NotebookLM
        reason: "Answers from uploaded sources with grounding and source-location support."
      - tool: Claude
        reason: "Handles long PDFs and produces well-structured learning materials."
    tip: "Try the recall questions before reopening the PDF or reading the answer key."
    expected_output: "Page-linked study notes, recall questions, misconceptions, and a review plan."
    tags: [pdf, study-notes, active-recall, learning]
    next_id: null
    prompt: |
      Turn the uploaded [PDF_TITLE] into active study notes for [COURSE_OR_EXAM], grounded only in the document.

      My current level is [LEVEL], the assessed topics are [TOPICS], and I have [STUDY_TIME]. Read the document’s headings, figures, tables, and conclusion. If pages are missing, scanned illegibly, or inaccessible, identify them rather than guessing.

      Build the notes in learning order, which may differ from page order. For each concept include: a plain-language explanation, essential terminology, one concrete example from the PDF, and page references. Mark definitions exactly quoted from the document with quotation marks; paraphrase everything else.

      Then create an Active Recall Pack:
      - eight short-answer questions;
      - three application questions;
      - two “spot the misconception” items;
      - a compact answer key with page pointers.

      Add a visual text map connecting the chapter’s main ideas with arrows and relationship labels. Identify any formula, framework, or process that requires memorisation, and devise one mnemonic without distorting the meaning.

      Close with a [NUMBER_OF_DAYS]-day review schedule using spaced practice. Include a “return to the PDF” list for claims, diagrams, or examples that need closer reading. Do not write assignment answers or conceal AI assistance; these notes must help me learn the source.
  - id: "022"
    slug: agreement-risk-spotter
    title: Agreement Risk Spotter
    category: documents
    difficulty: Advanced
    usage: "Use this to spot contract clauses worth discussing with a qualified lawyer."
    use_case: "A freelancer, employee, tenant, or small organisation can prepare informed questions before signing an agreement in Pakistan."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Reviews lengthy agreements and tracks definitions across clauses."
      - tool: ChatGPT
        reason: "Explains dense provisions in plain language and organises follow-up questions."
    tip: "Upload every schedule and annexure; key obligations are often outside the main document."
    expected_output: "A non-legal risk summary with clause references and lawyer questions."
    tags: [contracts, risk, documents, plain-language, pakistan]
    next_id: null
    prompt: |
      Review [UPLOADED_AGREEMENT] as a plain-language issue spotter, not as a lawyer or substitute for legal advice.

      I am the [PARTY_ROLE], the agreement concerns [PURPOSE], and the relevant jurisdiction appears to be [JURISDICTION]. My priorities are [PRIORITIES]. State clearly that enforceability and legal rights require advice from a qualified lawyer familiar with the applicable law.

      Start with a deal snapshot: parties, term, payment, renewal, termination, and main obligations, each linked to clause or page numbers. Then create a red-flag register using severity—urgent, important, or monitor—for:
      liability and indemnity; unilateral changes; intellectual property; confidentiality; data use; non-compete or exclusivity; payment and penalties; termination; dispute resolution; governing law; warranties; and missing schedules.

      For every flag, quote only the minimum relevant wording, explain the practical effect in neutral language, identify who bears the risk, and draft one clarification or negotiation question. Do not declare a clause illegal or enforceable.

      Add a cross-reference check for inconsistent definitions, dates, amounts, and annexures. List obligations due in the first 30 days. Finish with “Questions for a Pakistani lawyer” tailored to [JURISDICTION] and a missing-information list. Mask CNIC numbers, bank details, signatures, and personal addresses in your output.
  - id: "023"
    slug: executive-signal-summary
    title: Executive Signal Summary
    category: documents
    difficulty: Intermediate
    usage: "Use this to compress a long report into decisions, evidence, and implications."
    use_case: "A manager or project lead can understand a lengthy evaluation, market, policy, or technical report before a short briefing."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Maintains coherence and detail across very long documents."
      - tool: NotebookLM
        reason: "Grounds report summaries in uploaded source passages and citations."
    tip: "Tell the model which decision the summary must support; relevance changes with audience."
    expected_output: "A one-page executive summary with findings, implications, and source locations."
    tags: [executive-summary, reports, decisions, synthesis]
    next_id: null
    prompt: |
      Distil [REPORT_TITLE_OR_UPLOAD] into an executive summary for [AUDIENCE] deciding [DECISION].

      The reader has [READING_TIME] minutes and cares most about [PRIORITIES]. Work only from the report. Preserve the difference between reported evidence, author interpretation, and your synthesis. Every material number must retain its unit, period, population, and page or section reference.

      Open with a decision signal: one sentence stating why this report matters now. Follow with:
      - Purpose and scope in three lines;
      - five findings ranked by decision relevance, not document order;
      - implications for [ORGANISATION_OR_CONTEXT];
      - risks, limitations, and excluded populations;
      - decisions or actions the report explicitly supports.

      Use a “So what / Evidence / Caveat” pattern for each major finding. If recommendations are your inference rather than the authors’, label them “Analyst implication.”

      Include a small number dashboard containing only the six most consequential figures. Check each against the source twice and show its location. Name any conflict between the executive summary and body of the report.

      End with three questions an executive should ask before acting and a 30-second spoken brief. Do not smooth away uncertainty or convert recommendations into established facts.
  - id: "024"
    slug: dual-pdf-comparator
    title: Dual PDF Comparator
    category: documents
    difficulty: Advanced
    usage: "Use this to compare two documents on matching criteria with traceable evidence."
    use_case: "A learner or professional can compare policies, proposals, studies, specifications, or reports without relying on vague overall impressions."
    preview_override: null
    best_tools:
      - tool: NotebookLM
        reason: "Compares uploaded sources while grounding statements in their respective documents."
      - tool: Claude
        reason: "Handles long-document comparison and follows detailed comparison criteria."
    tip: "Define comparison criteria before reading conclusions to reduce confirmation bias."
    expected_output: "A criterion-by-criterion comparison with page evidence, conflicts, and gaps."
    tags: [pdf-comparison, documents, evidence, analysis]
    next_id: null
    prompt: |
      Compare [PDF_A] and [PDF_B] as two separate evidence sources, never blending their claims.

      My comparison purpose is [PURPOSE]. Use these criteria: [CRITERIA]. If no criteria are supplied, propose a set and ask for approval before proceeding. Identify each document’s title, author, date, version, intended audience, and scope. Flag if editions or time periods make direct comparison unfair.

      Create a comparison matrix. For every criterion provide Document A’s position with page reference, Document B’s position with page reference, the relationship—agreement, partial overlap, conflict, or silence—and a concise interpretation. Use [NOT STATED] when a document does not address something.

      Add separate sections for:
      - terminology that looks similar but is defined differently;
      - evidence quality and methodology;
      - changes in numbers, requirements, or recommendations;
      - unique contributions from each document;
      - unresolved contradictions.

      Run a role-play critique: first argue which document better serves [PURPOSE], then act as a sceptical reviewer and challenge that conclusion using the strongest counterevidence. Revise the conclusion if the critique succeeds.

      Finish with a bounded recommendation and confidence level. Do not infer author intent or claim that newer automatically means better. Provide a five-item reading list of pages requiring human review before any consequential decision.
  - id: "025"
    slug: document-action-harvester
    title: Document Action Harvester
    category: documents
    difficulty: Beginner
    usage: "Use this to extract clear tasks, owners, deadlines, and dependencies from text."
    use_case: "A project team can convert minutes, emails, proposals, or reports into an accountable action register."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Extracts structured tasks from common document formats and rewrites them clearly."
      - tool: Microsoft Copilot
        reason: "Useful when source documents and task workflows sit inside Microsoft 365."
    tip: "Treat implied tasks as proposals until a human confirms the owner and deadline."
    expected_output: "A traceable action register with owners, dates, dependencies, and ambiguities."
    tags: [action-items, tasks, accountability, documents]
    next_id: null
    prompt: |
      Extract an accountable action register from [DOCUMENT_OR_PASTED_TEXT] without inventing commitments.

      The project is [PROJECT], today is [DATE], and our naming convention is [TEAM_ROLES_OR_NAMES]. Scan for explicit actions, promises, approvals, follow-ups, decisions that create work, and unresolved requests. Preserve source page, paragraph, timestamp, or message reference.

      Build a register with: action stated as a verb, named owner, due date, priority, dependency, completion evidence, and source location. If the text says “we,” leaves the owner unclear, or gives a relative date such as “next Friday,” mark [CONFIRM OWNER] or [CONFIRM DATE]; do not guess.

      Separate the result into Confirmed Actions, Implied Actions Requiring Approval, and Open Questions. Detect duplicate tasks expressed in different wording and merge them while retaining all source references.

      Next, identify sequencing conflicts: deadlines before dependencies, one person overloaded, missing approval, or incompatible instructions. Draft a short clarification message covering only the highest-impact uncertainties.

      Conclude with a “next 48 hours” view containing actions actually due or blocking others. Do not assign work merely because someone was mentioned. Where dates are calculable, show both the original wording and the interpreted calendar date for human confirmation.
  - id: "026"
    slug: thesis-chapter-reading-companion
    title: Thesis Chapter Reading Companion
    category: documents
    difficulty: Advanced
    usage: "Use this to take analytical notes on a thesis chapter without rewriting it."
    use_case: "A postgraduate student can understand argument structure, evidence, gaps, and revision priorities while retaining authorship of the thesis."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Tracks argument structure and consistency across long academic chapters."
      - tool: NotebookLM
        reason: "Grounds analytical notes in uploaded chapter and reference materials."
    tip: "Ask for diagnosis before suggested wording so you remain the author of revisions."
    expected_output: "An argument map, evidence audit, and ethical revision checklist for one chapter."
    tags: [thesis, academic-writing, chapter-review, integrity]
    next_id: null
    prompt: |
      Act as a thesis reading companion for [CHAPTER_TITLE], helping me diagnose the draft while preserving my authorship.

      Degree and discipline: [PROGRAMME]. Research question: [QUESTION]. Chapter purpose: [PURPOSE]. Institutional guidance: [GUIDANCE]. Read the uploaded chapter and refer to paragraph, heading, or page locations. Do not write replacement passages unless I later request limited examples, and never generate fabricated data or references.

      Produce four analytical layers:
      1. Argument spine: one line per major claim, showing how each supports the chapter purpose.
      2. Evidence anchors: data or citations attached to each claim, including unsupported transitions.
      3. Reader journey: points where definitions arrive late, logic jumps, or signposting fails.
      4. Boundary check: material that belongs in another chapter or exceeds the research question.

      Then act as two reviewers. Reviewer One is a supportive supervisor seeking coherence; Reviewer Two is a rigorous examiner testing contribution, method alignment, and overclaiming. Give each reviewer five comments grounded in locations.

      Ask me to choose the three comments I accept. Only then create a revision sequence ordered by dependency and effort, expressed as tasks rather than ghostwritten prose. End with an academic-integrity check covering citation verification, source reading, disclosure rules, and my responsibility for every final claim.
  - id: "027"
    slug: transcript-clarity-editor
    title: Transcript Clarity Editor
    category: documents
    difficulty: Intermediate
    usage: "Use this to clean a meeting transcript while preserving meaning and accountability."
    use_case: "A team can turn a rough automated transcript into readable minutes without silently changing decisions or speaker intent."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Handles long transcripts and preserves context across speaker turns."
      - tool: Microsoft Copilot
        reason: "Fits meeting workflows involving Teams transcripts and Microsoft documents."
    tip: "Keep the raw transcript unchanged alongside the edited version for auditability."
    expected_output: "A cleaned transcript, uncertainty log, decisions, and verified action items."
    tags: [transcripts, meetings, editing, minutes]
    next_id: null
    prompt: |
      Clean [MEETING_TRANSCRIPT] into a readable record without changing what participants meant.

      Meeting title and date: [MEETING_DETAILS]. Known speakers: [SPEAKER_LIST]. Desired output: [CLEAN_TRANSCRIPT_OR_MINUTES]. Treat the original as the authority. Do not invent names, fix factual disagreements, or turn tentative suggestions into decisions.

      For the cleaned transcript, standardise speaker labels, punctuation, and paragraph breaks. Remove filler only when meaning and tone remain intact. Retain meaningful hesitation, disagreement, conditions, and uncertainty. Replace inaudible or doubtful segments with [UNCLEAR at TIMESTAMP] and include the nearest safe context.

      Keep timestamps at [INTERVAL_OR_TOPIC_CHANGES]. Mark any proposed correction to a number, name, or technical term in braces as {VERIFY: ...}; never silently substitute it.

      After the transcript, provide:
      - decisions explicitly made;
      - action items with owner, deadline, and timestamp;
      - proposals not yet approved;
      - unresolved questions;
      - an uncertainty log for every [UNCLEAR] or {VERIFY} marker.

      Finish with a five-sentence meeting summary that distinguishes discussion from commitment. If speakers shared personal, client, or confidential data, flag passages for redaction before circulation. Do not infer emotion from voice or wording unless it was explicitly stated.
  - id: "028"
    slug: policy-plain-language-translator
    title: Policy Plain-Language Translator
    category: documents
    difficulty: Intermediate
    usage: "Use this to explain a policy clearly without weakening its actual requirements."
    use_case: "A school, NGO, or workplace can make policies understandable to staff, students, volunteers, or community members."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Rewrites complex policy language for defined reading levels and audiences."
      - tool: Claude
        reason: "Preserves cross-references and exceptions across long policy documents."
    tip: "Have the policy owner verify every obligation after simplification."
    expected_output: "A plain-language policy guide with duties, examples, exceptions, and traceability."
    tags: [policy, plain-language, accessibility, compliance]
    next_id: null
    prompt: |
      Translate [POLICY_DOCUMENT] into a plain-language guide for [AUDIENCE] while preserving its rules and exceptions.

      Target reading level: [READING_LEVEL]. Preferred language: [ENGLISH_URDU_OR_BILINGUAL]. Jurisdiction or organisation: [CONTEXT]. This is an explanation, not legal advice or a replacement for the official policy.

      Begin with “What this policy is for” and “Who it applies to.” Then explain duties as direct questions: What must I do? What must I not do? When do I need approval? What happens if something goes wrong? Who can help? Attach each answer to the original clause or page.

      Define technical terms at first use. Convert long sentences into short steps, but retain mandatory words such as must, may, and should with their different force. Use two realistic examples and one non-example for each high-risk rule. Clearly label exceptions and appeal or reporting routes.

      Create a fidelity ledger listing any phrase that could not be simplified safely and why. Add [ORGANISATION TO CONFIRM] wherever the document is ambiguous or internally inconsistent.

      Close with a one-page quick guide and five comprehension questions. Do not introduce new requirements, deadlines, penalties, or promises. Recommend review by the policy owner and, where necessary, a qualified adviser before publication.
  - id: "029"
    slug: pasted-reference-normalizer
    title: Pasted Reference Normalizer
    category: documents
    difficulty: Beginner
    usage: "Use this to clean a pasted reference list without inventing missing details."
    use_case: "A student or report writer can standardise inconsistent citations and identify records that need manual verification."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Parses messy reference text and applies common citation-style patterns."
      - tool: Claude
        reason: "Maintains consistency across large, irregular reference lists."
    tip: "Verify metadata against the source or DOI record before submitting the final list."
    expected_output: "A formatted reference list plus duplicate, missing-field, and verification reports."
    tags: [citations, references, formatting, bibliography]
    next_id: null
    prompt: |
      Normalize my pasted references into [CITATION_STYLE_AND_EDITION] without fabricating any bibliographic information.

      References: [PASTE_REFERENCES]
      Required ordering: [ALPHABETICAL_NUMERICAL_OR_CUSTOM]
      Source language rules: [LANGUAGE_RULES]

      First parse each entry into available fields: author, year, title, container, volume, issue, pages, publisher, DOI, URL, and access date. Preserve original text in a numbered source column so every output can be traced back.

      Format entries only from supplied fields. Insert visible markers such as [MISSING YEAR], [VERIFY AUTHOR ORDER], or [INCOMPLETE URL] where necessary. Do not search for or infer missing metadata unless I explicitly request a separate verification phase.

      Detect likely duplicates, including DOI matches and small title variations. Present them for confirmation rather than deleting them. Separate records by source type—journal article, book, chapter, webpage, report, thesis, or unknown—and flag any type whose formatting is uncertain.

      Return three blocks: Clean Reference List, Verification Queue, and Duplicate Candidates. Then run a consistency pass for capitalization, italics indicators, punctuation, date form, and DOI format. Count input entries and output entries; explain any mismatch. End with a reminder that citation software and original source records should be checked before academic submission.
  - id: "030"
    slug: notes-grounded-qa-maker
    title: Notes-Grounded Q&A Maker
    category: documents
    difficulty: Intermediate
    usage: "Use this to ask and answer questions strictly from uploaded learning notes."
    use_case: "A student can revise from lecture notes or course packs while seeing where every answer came from."
    preview_override: null
    best_tools:
      - tool: NotebookLM
        reason: "Specializes in source-grounded questions and answers over uploaded notes."

    expected_output: "A source-grounded question bank with answers, locations, and confidence labels."
    tags: [question-bank, notes, revision, source-grounding]
    next_id: null
    prompt: |
      Build a revision Q&A set grounded exclusively in [UPLOADED_NOTES] for [COURSE_AND_TOPIC].

      The assessment format is [EXAM_FORMAT], my level is [LEVEL], and I struggle most with [WEAK_AREAS]. Treat the notes as a closed book of evidence: if an answer is absent, say “Not answerable from these notes” and identify what information is missing.

      Create four rounds with different cognitive demands:
      Round 1: six factual retrieval questions.
      Round 2: five explain-in-your-own-words questions.
      Round 3: four application or scenario questions.
      Round 4: three comparison or evaluation questions.

      For every answer, include a page, heading, slide, or paragraph pointer and a confidence label based on source clarity. Keep model answers proportional to likely marks under [MARK_SCHEME]. Add one plausible wrong answer and correction for the three concepts most prone to confusion.

      Include two deliberately unanswerable questions that are relevant but outside the uploaded material; explain why guessing would be unsafe. Then create a shuffled quiz version without answers and a separate answer key.

      Finish with a coverage audit showing which major note sections were tested and which were not. Do not import outside facts, complete a live graded assessment, or imply that generated questions predict the actual exam.
  - id: "031"
    slug: rtcfce-prompt-architect
    title: RTCFCE Prompt Architect
    category: prompting
    difficulty: Intermediate
    usage: "Use this to convert a rough task into a complete RTCFCE prompt."
    use_case: "A workshop participant can learn how role, task, context, format, constraints, and examples work together."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Supports interactive prompt design and clearly explains structural choices."
      - tool: Claude
        reason: "Follows detailed prompt specifications and handles rich context well."
    tip: "Use a role only when expertise or viewpoint changes how the task should be done."
    expected_output: "A completed RTCFCE worksheet and a ready-to-run prompt."
    tags: [rtcfce, prompt-design, framework, workshop]
    next_id: null
    prompt: |
      Act as an RTCFCE prompt architect helping me turn [ROUGH_TASK] into a precise, reusable instruction.

      Do not fill gaps immediately. Interview me one question at a time about Role, Task, Context, Format, Constraints, and Examples. Ask only questions whose answers could materially change the result, with a maximum of eight. If a role adds no value, recommend omitting it. Wait for my replies before building the prompt.

      After the interview, create an RTCFCE worksheet:
      R — useful expertise or perspective;
      T — exact action and success condition;
      C — audience, background, inputs, and purpose;
      F — output shape and length;
      C — hard limits, safety, tone, and exclusions;
      E — one positive example or pattern, plus a counterexample if helpful.

      Label any assumption you still need to make. Then assemble a natural prompt rather than mechanically repeating the six headings. Put the most important goal in its opening line and represent reusable inputs as [PLACEHOLDERS].

      Provide a compact version and a detailed version. Explain when each is preferable. Finally, simulate one likely model misunderstanding, identify which RTCFCE element failed to prevent it, and patch only that section. The final prompt should be vendor-neutral and should not request hidden chain-of-thought.
  - id: "032"
    slug: weak-prompt-makeover
    title: Weak Prompt Makeover
    category: prompting
    difficulty: Beginner
    usage: "Use this to see exactly how a vague prompt becomes specific and testable."
    use_case: "A beginner can compare a weak instruction with stronger revisions and learn which changes improve output."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Provides clear prompt rewrites and demonstrates their likely output differences."
      - tool: Gemini
        reason: "Generates varied reformulations and explains practical prompt improvements."
    tip: "Improve the missing information that affects success; extra words alone do not improve a prompt."
    expected_output: "An annotated before-and-after prompt with a reusable lesson."
    tags: [prompt-rewrite, before-after, clarity, beginners]
    next_id: null
    prompt: |
      Diagnose and improve this weak prompt as a practical prompt-writing teacher: [WEAK_PROMPT].

      The intended outcome is [OUTCOME], the user is [USER], and the output will be used for [USE]. Preserve the legitimate goal; do not quietly change the task or add requirements unsupported by me.

      Start by marking the original prompt with inline labels for five possible weaknesses: vague action, missing context, undefined audience, absent output format, and untestable quality words. If a category is already strong, say so.

      Create three successive rewrites:
      Version 1 — Minimal Repair: change as little as possible.
      Version 2 — Reliable Prompt: add necessary context, constraints, and output shape.
      Version 3 — Reusable Template: replace variable details with [PLACEHOLDERS].

      Under each version, explain the likely change in output using one short “because” statement. Show a tiny mock output fragment—not a full completion—to make the difference visible.

      Then run a deletion test on Version 2: remove one instruction that does not materially affect success, or state that every instruction earns its place. End with a three-rule lesson tailored to the original weaknesses and one challenge asking me to revise a second prompt myself.
  - id: "033"
    slug: grounded-answer-guardrails
    title: Grounded Answer Guardrails
    category: prompting
    difficulty: Advanced
    usage: "Use this to design prompts that reduce unsupported claims and invented details."
    use_case: "A researcher or workplace team can make document-based AI answers more traceable and safer to verify."
    preview_override: null
    best_tools:
      - tool: NotebookLM
        reason: "Grounds responses in user-provided sources and exposes supporting source locations."
      - tool: Claude
        reason: "Follows detailed evidence constraints across long source material."
    tip: "Require an abstention phrase and source locations, then test the prompt with an unanswerable question."
    expected_output: "A hallucination-resistant prompt with evidence rules and adversarial tests."
    tags: [hallucination, grounding, verification, prompt-safety]
    next_id: null
    prompt: |
      Design a grounded-answer prompt for [TASK] where unsupported claims would create [RISK].

      Allowed evidence is [APPROVED_SOURCES]. The user’s question will appear as [QUESTION]. Build instructions that force a clean boundary between supplied evidence, general background knowledge if allowed, and inference. Use the exact abstention phrase “[NOT SUPPORTED BY PROVIDED SOURCES]” whenever the evidence is insufficient.

      The resulting prompt must require:
      - a source location beside each material claim;
      - quotations only when exact wording is available;
      - uncertainty labels for ambiguous passages;
      - no invented citations, links, statistics, names, or dates;
      - a conflict note when approved sources disagree;
      - a request for missing information when it would change the answer.

      Choose an output structure suited to [AUDIENCE] rather than a generic essay. Include a final evidence ledger mapping conclusions to source IDs.

      Stress-test the prompt with three probes: one answerable question, one partly answerable question, and one plausible but absent claim. Predict the compliant behaviour for each without answering the domain question. Identify any instruction that could still reward confident guessing and tighten it.

      Return the production prompt first, followed by the tests and a short human verification protocol. Do not claim these controls eliminate hallucinations; state their limits and recommend review proportional to the risk.
  - id: "034"
    slug: clarification-gate-designer
    title: Clarification Gate Designer
    category: prompting
    difficulty: Intermediate
    usage: "Use this to make an AI ask important questions before attempting the task."
    use_case: "A user can prevent premature answers when audience, inputs, constraints, or success criteria are still unclear."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Handles multi-turn clarification and adapts later output to user responses."
      - tool: Claude
        reason: "Maintains detailed answers from an intake phase through final delivery."
    tip: "Tell the model to ask only decision-changing questions, or the intake can become tedious."
    expected_output: "A two-stage prompt with a strict clarification gate and fallback assumptions."
    tags: [clarifying-questions, intake, prompt-flow, requirements]
    next_id: null
    prompt: |
      Create a two-stage clarification-gate prompt for [TASK] so the model cannot rush into an answer.

      The minimum information needed is [REQUIRED_INPUTS]. Optional helpful context is [OPTIONAL_INPUTS]. The user may have limited time, so questions must be high value and easy to answer.

      Stage One must instruct the model to inspect the request, identify only gaps that could materially alter the output, and ask up to [MAX_QUESTIONS] numbered questions in one message. It must not draft, outline, research, or solve the task yet. Include “Why I need this” after each question in eight words or fewer. Offer selectable options when users may not know the terminology.

      Define a gate condition: Stage Two begins only after the user responds or explicitly says “Use reasonable assumptions.” If assumptions are authorised, they must be listed before work begins and must avoid sensitive personal, legal, medical, or financial guesses.

      Stage Two should restate the agreed requirements as a compact brief, invite one correction, and then produce [OUTPUT_FORMAT] under [CONSTRAINTS].

      Test the resulting prompt against two cases: a complete request that needs no questions and a vague request missing three essentials. Show expected model behaviour, not the task answer. Finish with one escape hatch for users who want a quick draft and a warning label for high-stakes use.
  - id: "035"
    slug: critique-revision-engine
    title: Critique Revision Engine
    category: prompting
    difficulty: Advanced
    usage: "Use this to build a prompt that critiques an output before revising it."
    use_case: "A writer or analyst can improve a draft through explicit criteria rather than accepting the first generated answer."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Performs nuanced long-form critique and revision while preserving intent."
      - tool: ChatGPT
        reason: "Supports rubric-based iteration and transparent change summaries."
    tip: "Make the critique cite exact draft locations so revision does not become a total rewrite."
    expected_output: "A reusable critique-then-revise prompt with stop conditions and change tracking."
    tags: [critique, revision, self-review, iteration]
    next_id: null
    prompt: |
      Build a critique-then-revise loop for improving [DRAFT_TYPE] against [GOAL].

      The draft will be supplied as [DRAFT]. The audience is [AUDIENCE], constraints are [CONSTRAINTS], and non-negotiable content is [MUST_PRESERVE]. Create a rubric with four to six criteria tailored to this task, each having a concrete pass condition. Avoid vague labels such as “good” without observable evidence.

      The loop must run in distinct passes:
      Pass A — Diagnose: quote or locate each issue and score the rubric.
      Pass B — Plan: rank no more than five changes by impact.
      Pass C — Revise: edit only what the plan justifies.
      Pass D — Verify: rescore and check facts, constraints, and preserved meaning.

      Instruct the model to show concise rationale and checkable evidence, not private hidden chain-of-thought. Require a change log that maps every major edit to one diagnosed issue. If revision would need missing facts, insert [NEEDS INPUT] instead of inventing them.

      Set a stop rule: finish when all critical criteria pass or after [MAX_ROUNDS] rounds, whichever comes first. If the score does not improve, preserve the strongest version and explain the blockage. Return the complete reusable prompt, followed by one miniature demonstration using [SHORT_SAMPLE] and a note on when human review remains essential.
  - id: "036"
    slug: constraint-stack-builder
    title: Constraint Stack Builder
    category: prompting
    difficulty: Intermediate
    usage: "Use this to organise multiple prompt constraints without creating contradictions."
    use_case: "A communications, teaching, or operations team can create reliable instructions involving length, tone, content, and compliance limits."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Organises detailed constraints and detects conflicts through interactive refinement."
      - tool: Gemini
        reason: "Handles structured instruction design and offers alternative constraint resolutions."
    tip: "Rank hard constraints above preferences so the model knows what may flex."
    expected_output: "A prioritized constraint stack, conflict analysis, and executable prompt."
    tags: [constraints, prompt-design, priorities, compliance]
    next_id: null
    prompt: |
      Act as a constraint engineer for the task [TASK], turning my requirements into a coherent prompt.

      Raw requirements: [REQUIREMENTS]. Intended audience: [AUDIENCE]. Required output: [OUTPUT]. First sort every requirement into four layers: safety and truthfulness, task essentials, format limits, and style preferences. Assign each item Hard, Strong Preference, or Optional.

      Search for collisions such as “comprehensive but 100 words,” “friendly but legally exact,” incompatible formats, or missing data required by a hard rule. For each collision, show the competing instructions and offer two resolutions. Ask me to decide whenever the choice changes the goal; do not silently pick.

      Build the final prompt with the constraints placed near the action they govern. Add a precedence rule stating what wins if requirements conflict. Translate fuzzy terms—professional, concise, engaging, detailed—into observable boundaries using [EXAMPLES_OR_METRICS].

      Include a compact compliance checklist the model can complete after drafting. It should report pass, fail, or not applicable, then revise once only for failed hard constraints. Ensure the check does not invite fabricated facts merely to satisfy format.

      Return: the sorted stack, unresolved choices, final prompt, and one edge-case test. End by identifying the first constraint to relax if the requested output proves impossible, with a reason tied to the stated priorities.
  - id: "037"
    slug: few-shot-pattern-crafter
    title: Few-Shot Pattern Crafter
    category: prompting
    difficulty: Advanced
    usage: "Use this to build examples that teach a model the desired output pattern."
    use_case: "A team can improve consistency for classification, rewriting, extraction, or formatting tasks through carefully varied examples."
    preview_override: null
    best_tools:
      - tool: Claude
        reason: "Follows complex patterns demonstrated across several long examples."
      - tool: ChatGPT
        reason: "Generates, critiques, and tests few-shot examples for structured tasks."
    tip: "Include edge cases and near-misses, not three examples that all demonstrate the easy case."
    expected_output: "A diverse few-shot set with labels, edge cases, and a leakage check."
    tags: [few-shot, examples, prompting, consistency]
    next_id: null
    prompt: |
      Design a few-shot example set that teaches an AI to perform [TASK] consistently.

      Desired input form: [INPUT_SCHEMA]. Desired output form: [OUTPUT_SCHEMA]. Rules: [RULES]. Realistic domain: [DOMAIN]. Sensitive or prohibited content: [EXCLUSIONS].

      Begin by expressing the underlying pattern in plain language. Then identify the dimensions that examples must vary: length, wording, class, ambiguity, missing data, and edge conditions. Create [NUMBER] examples that cover those dimensions without copying private or copyrighted material.

      Each example must use:
      Input: a realistic synthetic case.
      Output: the exact target response.
      Teaching point: a note for me that will be removed from the production prompt.

      Include at least one typical case, one boundary case, one case requiring abstention or [UNKNOWN], and one tempting near-miss. Keep labels balanced when the task is classification. Avoid accidental clues such as one class always having longer inputs.

      Next, perform a leakage and consistency audit: check whether outputs reveal hidden answers, examples contradict a rule, or superficial wording predicts the label. Repair issues you find.

      Assemble a production prompt containing instructions, clean examples without teaching notes, and a final [NEW_INPUT] slot. Finish with two challenge inputs and expected grading criteria, but keep their answers separate so they can test the prompt honestly.
  - id: "038"
    slug: task-tool-routing-prompt
    title: Task Tool Routing Prompt
    category: prompting
    difficulty: Beginner
    usage: "Use this to choose an appropriate AI tool based on task capabilities."
    use_case: "A workshop participant can compare available tools for research, documents, writing, studying, or office workflows without relying on hype."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Can elicit requirements and compare tools across common general-purpose capabilities."
      - tool: Perplexity
        reason: "Useful when tool selection depends on current, source-linked capability information."
    tip: "Choose by required capability and data sensitivity before considering familiarity."
    expected_output: "A capability-based recommendation with alternatives, limitations, and a test task."
    tags: [tool-selection, capabilities, workflow, prompting]
    next_id: null
    prompt: |
      Help me choose the most suitable AI tool for [TASK] based on capabilities, access, and risk—not popularity.

      My inputs are [TEXT_FILES_IMAGES_LINKS_OR_OTHER], expected output is [OUTPUT], workflow is [WORKFLOW], data sensitivity is [PUBLIC_INTERNAL_CONFIDENTIAL], and devices or accounts available are [ACCESS]. I prefer [PREFERENCES], but they are not hard requirements.

      Ask up to five clarifying questions if any decisive requirement is missing. Then create a capability checklist covering current web access, citations, file type and length, multimodal input, office integration, collaboration, privacy controls, and required human verification.

      Compare only tools you can describe accurately from current knowledge or verifiable official information. Candidate tools may include ChatGPT, Gemini, Claude, Perplexity, NotebookLM, DeepSeek, Meta AI, and Microsoft Copilot; omit irrelevant ones. Do not discuss prices unless I explicitly ask, and do not claim a feature exists without confidence.

      Recommend one primary tool and up to two alternatives. For each, state task fit, key limitation, and the condition that would change the choice. If a simple non-AI tool is safer or sufficient, say so.

      End with a ten-minute test task using non-sensitive sample data and a scorecard for accuracy, effort, traceability, and fit. Remind me to verify availability and organisational policy before uploading data.
  - id: "039"
    slug: socratic-learning-dialogue
    title: Socratic Learning Dialogue
    category: prompting
    difficulty: Intermediate
    usage: "Use this to create a tutor prompt that guides learning through questions."
    use_case: "A learner can develop reasoning in mathematics, science, business, or humanities without receiving immediate answers."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Maintains responsive multi-turn tutoring and adjusts hints to learner answers."
      - tool: Gemini
        reason: "Supports conversational explanation and varied examples across subjects."
    tip: "Require the tutor to wait after every question; otherwise it may answer itself."
    expected_output: "An adaptive Socratic tutor prompt with hint levels and learning checks."
    tags: [socratic, tutoring, learning, questions]
    next_id: null
    prompt: |
      Create a Socratic tutor prompt for learning [TOPIC] at [LEVEL] toward [LEARNING_GOAL].

      The tutor must begin with one diagnostic question and then proceed one question at a time, always waiting for the learner’s reply. It should not dump a lecture or reveal a complete solution to [PROBLEM_TYPE] before the learner attempts it.

      Design a three-level hint ladder:
      Hint 1 points attention to the relevant idea.
      Hint 2 recalls a principle or gives a smaller analogous case.
      Hint 3 provides the next step but still leaves meaningful work.

      Require the tutor to respond to wrong answers by identifying the misconception through another question, not saying only “incorrect.” For correct answers, ask for justification or transfer to a changed example. Every four turns, it should briefly summarize what the learner established and ask them to state the connection in their own words.

      Add an integrity boundary: for live graded work, offer concepts, hints, and feedback but do not impersonate the learner or produce submission-ready answers. Include an option to switch to direct explanation after [MAX_ATTEMPTS] sincere attempts.

      Return the complete tutor prompt plus three starter questions ordered by difficulty. Add a closing mastery check requiring explanation, application, and self-assessment. The tutor should be encouraging without excessive praise and should adapt examples to [CONTEXT] respectfully.
  - id: "040"
    slug: output-rubric-designer
    title: Output Rubric Designer
    category: prompting
    difficulty: Advanced
    usage: "Use this to define measurable criteria for evaluating an AI-generated output."
    use_case: "A trainer, team, or individual can judge drafts consistently and compare prompt versions using the same standard."
    preview_override: null
    best_tools:
      - tool: ChatGPT
        reason: "Builds task-specific rubrics and applies them iteratively to sample outputs."
      - tool: Claude
        reason: "Provides nuanced criterion definitions and evidence-based evaluations of long outputs."
    tip: "Weight factuality and safety separately from style so polished errors cannot score highly."
    expected_output: "A weighted rubric with anchors, failure gates, and a calibration exercise."
    tags: [rubric, evaluation, quality, prompt-testing]
    next_id: null
    prompt: |
      Design an evaluation rubric for AI-generated [OUTPUT_TYPE] used by [AUDIENCE] for [PURPOSE].

      Success requirements are [REQUIREMENTS], likely risks are [RISKS], and sample outputs if available are [SAMPLES]. Begin by separating threshold requirements from quality dimensions. A threshold is pass/fail—such as no invented citations—while a quality dimension can improve by degree.

      Propose five to eight non-overlapping criteria. For each provide: definition, weight, evidence the evaluator should inspect, and anchors for scores 1, 3, and 5. Ensure weights total 100. Include accuracy, source grounding, or safety where relevant; do not allow fluency to compensate for dangerous or materially false content.

      Add automatic failure gates for [CRITICAL_FAILURES]. Define how “not applicable” changes the denominator. Write instructions for two evaluators to resolve disagreements by pointing to output evidence rather than personal taste.

      Calibrate the rubric on [SAMPLE_A] and [SAMPLE_B], if supplied. Show criterion scores with short justifications, identify any criterion that both samples expose as ambiguous, and revise its wording once. If no samples are supplied, create two tiny synthetic fragments solely for calibration.

      Finish with a compact evaluator form and interpretation bands—unusable, needs revision, usable with checks, strong—tied to both score and failure gates. State what the rubric cannot measure and when a subject-matter expert must override the numeric result.

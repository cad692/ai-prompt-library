      - tool: "Adobe Firefly"
        reason: "Generates consistent visual references for individual frames."
    tip: "Check that the story is understandable from frame thumbnails alone."
    expected_output: "A six-frame storyboard with shot, action, audio, and continuity details."
    tags: ["storyboard", "preproduction", "video"]
    next_id: null
    prompt: |
      Take the role of a storyboard artist compressing [STORY_OR_MESSAGE] into exactly six purposeful frames.

      Audience and platform: [AUDIENCE_PLATFORM]
      Duration: [DURATION]
      Main character or object: [SUBJECT]
      Location: [LOCATION]
      Visual style: [STYLE]
      Required ending: [ENDING]

      Give the six frames distinct jobs: orientation, desire/problem, trigger, attempt, turn, resolution. For each frame, provide a thumbnail description, composition and subject placement, shot size, camera angle, lens feel, camera or subject motion leading into the next shot, lighting direction and continuity, dominant colour, visible action, narration/dialogue, ambient sound, and approximate duration.

      Maintain screen direction, wardrobe, prop count, time of day, and geography. Use at least one close detail and one wider contextual shot, but choose them because they advance the story. Transitions should arise from matched action, gaze, sound, or graphic shape rather than random effects.

      After the six frames, include a continuity ledger listing fixed visual facts and a production list separating what must be filmed, generated, recorded, or designed. Add one cheaper alternative that preserves the story with fewer locations. Do not include unsafe action, unlicensed brand marks, or claims not supported by [SOURCE_OR_BRIEF].

  - id: "060"
    slug: "brand-consistent-image-family"
    title: "Brand Consistent Image Family"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to generate several campaign images that feel related but not repetitive."
    use_case: "Defines a reusable visual grammar for a coordinated image set. It separates fixed brand rules from scene-level variation."
    preview_override: null
    best_tools:
      - tool: "Leonardo"
        reason: "Supports consistent visual development across a coordinated image series."
      - tool: "Adobe Firefly"
        reason: "Generates varied campaign scenes from controlled brand art direction."
    tip: "Approve one anchor image before generating the rest of the set."
    expected_output: "A visual system, anchor prompt, and five coordinated scene prompts."
    tags: ["brand-system", "image-series", "campaign"]
    next_id: null
    prompt: |
      Act as a campaign art director building a family of images with shared visual DNA.

      Brand promise: [BRAND_PROMISE]
      Audience: [AUDIENCE]
      Campaign uses: [USES]
      Required subjects or scenes: [SCENES]
      Existing brand assets: [ASSETS]
      Exclusions: [EXCLUSIONS]

      Define the invariant visual grammar first: art style, composition rule, focal-distance range, camera perspective, lighting signature with direction and softness, colour palette with proportions, texture, level of realism, treatment of people, and negative space. Name three elements that may vary so the set does not feel copied.

      Write an anchor-image prompt that demonstrates the system. Then create five scene prompts, each with a different action or setting while repeating the fixed grammar in concrete language. Include aspect ratio and crop intent for each use. If people appear, vary age, gender presentation, skin tone, and ability naturally without turning representation into a checklist or stereotype.

      Provide one shared negative prompt covering unintended text, logos, watermarks, inconsistent lighting, malformed anatomy, duplicated objects, clashing palettes, and visual clichés. End with a contact-sheet review rubric scoring brand fit, recognizability, consistency, distinctiveness, usability, and factual accuracy. Explain which weak image to regenerate first and which variable to change.

  - id: "061"
    slug: "respectful-cold-email"
    title: "Respectful Cold Email"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to draft a concise first-contact email grounded in real relevance."
    use_case: "Creates a personalized outreach email without invented familiarity or pressure tactics. Suitable for job, sales, or networking contexts."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Drafts concise variants and adjusts tone to the relationship."
      - tool: "Claude"
        reason: "Maintains nuance while working from detailed prospect context."
    tip: "Personalize from one verifiable fact, not a compliment that could fit anyone."
    expected_output: "A short cold email, two subject lines, and a follow-up."
    tags: ["email", "outreach", "networking"]
    next_id: null
    prompt: |
      Work as an ethical outreach writer creating a first email that respects the recipient's time.

      Sender and credibility: [SENDER]
      Recipient role: [RECIPIENT]
      Verified relevance trigger: [RELEVANCE]
      Offer or reason to connect: [OFFER]
      Evidence: [EVIDENCE]
      Desired next step: [NEXT_STEP]
      Tone: [TONE]

      Draft an email of 80-130 words. The opening must refer to the verified relevance trigger without pretending you know the recipient personally. Connect that context to one concrete problem or opportunity, explain the offer in plain language, and support it with only the evidence supplied. Ask for one low-friction next step and make declining easy.

      Do not use “just checking,” false scarcity, guilt, inflated praise, invented mutual contacts, or claims of guaranteed outcomes. If the relevance information is too weak, say what research is needed instead of faking personalization.

      Provide two honest subject lines under eight words: one direct and one curiosity-based but not clickbait. Then write a single follow-up for 4-7 working days later that adds a useful detail rather than repeating the first message. Finish with a personalization checklist showing which placeholders must be confirmed before sending.

  - id: "062"
    slug: "proposal-scope-boundary-builder"
    title: "Proposal Scope Boundary Builder"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to define project deliverables, exclusions, acceptance, and change handling."
    use_case: "Turns discovery notes into a clear proposal scope for client alignment. It is a working draft, not legal advice."
    preview_override: null
    best_tools:
      - tool: "Claude"
        reason: "Structures detailed scope language across long project notes."
      - tool: "Notion"
        reason: "Keeps scope, deliverables, and decisions in a collaborative workspace."
    tip: "Write acceptance criteria so both sides can observe whether the work is complete."
    expected_output: "A proposal scope with deliverables, boundaries, assumptions, and acceptance criteria."
    tags: ["proposal", "scope", "client-work"]
    next_id: null
    prompt: |
      Act as a project scoping facilitator converting messy discovery notes into a shared definition of done.

      Client goal: [GOAL]
      Discovery notes: [NOTES]
      Deliverables discussed: [DELIVERABLES]
      Timeline constraints: [TIMELINE]
      Client responsibilities: [CLIENT_INPUTS]
      Budget model if relevant: [BUDGET_MODEL]

      Write a proposal scope draft with these functional sections: outcome, deliverable cards, project phases, client inputs, explicit exclusions, assumptions, acceptance method, change-request path, and handover. Each deliverable card must state what will be produced, format, quantity or boundary, review rounds, dependencies, and observable acceptance criteria.

      Create a “scope edge” section using examples of nearby work that is not included, so ambiguity is reduced without sounding defensive. Identify contradictions or unanswered questions in the notes and list them before the draft as decisions required. Do not invent dates, fees, legal protections, intellectual-property terms, or service guarantees.

      Add a lightweight change process: request, impact assessment, written approval, and revised schedule or cost. Finish with a plain-language summary the client can read in one minute and a kickoff checklist. Label the document as a commercial working draft requiring appropriate business or legal review where needed.

  - id: "063"
    slug: "evidence-aware-swot"
    title: "Evidence Aware SWOT"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to build a SWOT that separates evidence from team assumptions."
    use_case: "Produces a focused SWOT tied to one decision rather than generic business labels. It converts observations into testable strategic moves."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Organizes evidence and generates decision-linked strategic questions."
      - tool: "Gemini"
        reason: "Synthesizes supplied market context and structured business inputs."
    tip: "Reject any SWOT item that could describe nearly every organization."
    expected_output: "A prioritized SWOT with evidence labels and strategic experiments."
    tags: ["swot", "strategy", "analysis"]
    next_id: null
    prompt: |
      Serve as a strategy facilitator running an evidence-aware SWOT for a specific choice, not a generic company description.

      Decision to inform: [DECISION]
      Organization or project: [ORGANIZATION]
      Internal evidence: [INTERNAL_EVIDENCE]
      External evidence: [EXTERNAL_EVIDENCE]
      Time horizon: [TIME_HORIZON]
      Geography or market: [MARKET]

      Begin by restating the decision boundary. Sort candidate observations by internal strengths/weaknesses and external opportunities/threats, but attach one label to every item: verified fact, informed interpretation, or untested assumption. Remove vague entries such as “competition” or “good team” unless made specific and comparative.

      Prioritize no more than four items per quadrant using impact on the decision and confidence in evidence. For the top items, show the evidence, why it matters now, and what could disconfirm it. Then cross the quadrants to form four strategic moves: use a strength to capture an opportunity, use a strength to reduce a threat, repair a weakness to capture an opportunity, and limit exposure where weakness meets threat.

      Convert the best two moves into small experiments with owner, signal, time box, and stop/continue rule. End with five research questions that would most change the analysis. Do not present assumptions as market facts.

  - id: "064"
    slug: "customer-interview-field-guide"
    title: "Customer Interview Field Guide"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to plan non-leading interviews about real customer behavior."
    use_case: "Creates a practical discussion guide focused on past actions and current problems. It avoids pitching during discovery."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Generates neutral questions and realistic follow-up probes."
      - tool: "Notion"
        reason: "Organizes interview guides, notes, and recurring evidence."
    tip: "Ask for the last specific example whenever an answer becomes hypothetical."
    expected_output: "A timed interview guide with neutral probes and note-taking fields."
    tags: ["customer-research", "interviews", "discovery"]
    next_id: null
    prompt: |
      You are a customer-research lead preparing a conversation that investigates behavior rather than seeks compliments.

      Learning goal: [LEARNING_GOAL]
      Participant profile: [PARTICIPANT]
      Product or problem area: [AREA]
      Interview duration: [DURATION]
      Assumptions to test: [ASSUMPTIONS]
      Sensitive topics: [SENSITIVE_TOPICS]

      Build a timed guide that opens with consent, purpose, recording choice, and assurance that there are no right answers. Move from context to the participant's most recent relevant experience, then reconstruct the timeline: trigger, alternatives, decision, effort, outcome, and workaround. Use neutral questions and supply optional probes for concrete examples, frequency, consequences, and trade-offs.

      Do not ask “Would you use…?”, “Do you like…?”, or other future-intent questions unless reframed around past behavior. Keep the product pitch out of the discovery section. Include one respectful route around each sensitive topic and allow the participant to skip.

      Add a note-taking frame that separates direct quotes, observed facts, interpretation, and follow-up. Finish with a closing question for missing context, an ethical incentive/thanks reminder, and a post-interview synthesis card. Mark which assumptions each question explores without exposing those labels to the participant.

  - id: "065"
    slug: "sop-first-draft-mapper"
    title: "SOP First Draft Mapper"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to turn process knowledge into a testable first SOP."
    use_case: "Documents a repeatable workflow with controls, exceptions, and ownership. The draft is designed for validation by the people doing the work."
    preview_override: null
    best_tools:
      - tool: "Notion"
        reason: "Publishes searchable SOPs with linked templates and revision history."
      - tool: "Claude"
        reason: "Structures detailed process notes and edge cases coherently."
    tip: "Have a new team member test the SOP while the process owner only observes."
    expected_output: "A versioned SOP draft with steps, exceptions, and a test plan."
    tags: ["sop", "operations", "documentation"]
    next_id: null
    prompt: |
      Act as an operations documenter turning expert memory into an SOP another person can actually test.

      Process name and purpose: [PROCESS]
      Trigger and endpoint: [START_END]
      Current notes or recording transcript: [NOTES]
      Roles involved: [ROLES]
      Tools and access: [TOOLS]
      Known exceptions or risks: [EXCEPTIONS]

      First extract a process boundary: what starts the work, what counts as complete, and what is outside this SOP. Then draft prerequisites, role ownership, inputs, and a numbered procedure. Every step should begin with an observable action, name the responsible role, state the output, and include a screenshot placeholder only where a visual is genuinely necessary.

      Insert decision points as if/then branches rather than hiding them in paragraphs. Add quality checks at the moment an error can still be corrected. Create separate sections for exceptions, escalation, data/privacy cautions, linked templates, and records to retain. Never invent access rights, regulatory requirements, or approval authority.

      Finish with version owner, review date placeholder, change log, and a dry-run test script. List questions the process owner must answer before publication and highlight any single-person dependency. Keep the wording direct enough for a capable new starter, while preserving safety warnings and required controls.

  - id: "066"
    slug: "service-complaint-recovery-reply"
    title: "Service Complaint Recovery Reply"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to respond calmly to a customer complaint with verified next steps."
    use_case: "Drafts an empathetic complaint response without admitting unverified facts or making unauthorized promises. It centers resolution and ownership."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Adjusts tone and produces clear, customer-friendly service replies."
      - tool: "Gemini"
        reason: "Summarizes supplied complaint details and drafts structured responses."
    tip: "Name the inconvenience specifically; generic empathy often sounds automated."
    expected_output: "A concise customer reply with ownership, action, and follow-up timing."
    tags: ["customer-service", "complaint", "email"]
    next_id: null
    prompt: |
      Work as a customer-care writer handling a difficult complaint with empathy, accuracy, and clear ownership.

      Customer message: [COMPLAINT]
      Verified account facts: [FACTS]
      Policy or limits: [POLICY]
      Actions already taken: [ACTIONS]
      Authorized remedy options: [REMEDIES]
      Follow-up timing: [TIMING]
      Channel and tone: [CHANNEL_TONE]

      Identify the customer's core problem, practical impact, and requested outcome. Draft a reply that: acknowledges the specific experience, apologizes for the impact where appropriate, distinguishes confirmed facts from what is still being checked, states the next action and owner, offers only authorized remedies, and gives a realistic update time.

      Do not blame the customer, quote policy as a shield, promise a result outside the supplied authority, or admit legal liability. Avoid overly cheerful language and repetitive apologies. If the message includes threats, safety concerns, discrimination, fraud, or legal escalation, mark it for the correct human escalation rather than improvising.

      Provide the final send-ready response first. After it, add an internal-only note containing facts to verify, system records to update, and the promised follow-up. Include a one-sentence SMS version only if [CHANNEL_TONE] requires it. Preserve privacy by omitting unnecessary account details.

  - id: "067"
    slug: "plain-language-pricing-explainer"
    title: "Plain Language Pricing Explainer"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to explain pricing structure clearly without hidden qualifiers or legal claims."
    use_case: "Turns a pricing model into customer-friendly language and examples. It highlights assumptions, exclusions, and questions for review."
    preview_override: null
    best_tools:
      - tool: "Claude"
        reason: "Handles nuanced commercial explanations while maintaining internal consistency."
      - tool: "ChatGPT"
        reason: "Creates plain-language versions and worked examples from supplied figures."
    tip: "Test every example with a calculator and have an authorized person verify taxes and terms."
    expected_output: "A transparent pricing explanation with examples and review flags."
    tags: ["pricing", "communication", "sales"]
    next_id: null
    prompt: |
      Act as a plain-language commercial writer explaining how a price works, without drafting legal terms.

      Product or service: [OFFER]
      Currency and market: [CURRENCY_MARKET]
      Pricing components: [COMPONENTS]
      Included usage or scope: [INCLUSIONS]
      Exclusions and add-ons: [EXCLUSIONS]
      Billing timing: [BILLING]
      Taxes or discounts already confirmed: [CONFIRMED_RULES]

      Start with a two-sentence overview answering “what will I usually pay and what changes that amount?” Then explain each component using consistent names and units. Create three worked examples—light, typical, and higher use—using only supplied rates. Show the arithmetic line by line and label every assumption.

      Add a “what is included / what may cost extra” comparison, followed by five questions a buyer should ask before agreeing. If taxes, exchange rates, renewals, refunds, or discount eligibility are uncertain, mark them [CONFIRM] rather than filling gaps. Do not use “free,” “unlimited,” “guaranteed,” or “no hidden fees” unless the provided facts fully support the claim.

      Finish with a 60-word sales-conversation version and a FAQ of four realistic questions. State that the explanation is informational and must be checked against the approved quote, contract, and applicable requirements; it is not legal, tax, or financial advice.

  - id: "068"
    slug: "mutual-value-partnership-outreach"
    title: "Mutual Value Partnership Outreach"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to approach an organization with a specific, balanced collaboration idea."
    use_case: "Builds a partnership message around credible overlap and mutual contribution. It avoids vague requests to collaborate."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Shapes concise outreach and adapts value framing to each partner."
      - tool: "Notion"
        reason: "Tracks partner research, proposals, owners, and follow-ups."
    tip: "Propose a small pilot before asking for a broad long-term partnership."
    expected_output: "A partnership email, pilot concept, and meeting agenda."
    tags: ["partnerships", "outreach", "collaboration"]
    next_id: null
    prompt: |
      Serve as a partnership development lead proposing a concrete exchange of value between two organizations.

      Our organization and assets: [OUR_SIDE]
      Prospective partner and verified priorities: [PARTNER]
      Audience overlap: [OVERLAP]
      Collaboration idea: [IDEA]
      What we can contribute: [OUR_CONTRIBUTION]
      What we may request: [REQUEST]
      Evidence or prior results: [EVIDENCE]

      Build the logic before drafting: shared objective, complementary assets, beneficiary, smallest viable pilot, and a fair measure of success. Flag any assumption about the partner that requires verification.

      Then write a 140-190 word outreach email. Open with specific relevance, describe the mutual opportunity in two or three sentences, outline a low-risk pilot with a defined time box, and request a short exploratory conversation. Make the contributions balanced; do not disguise a sponsorship or sales request as a partnership.

      Add a one-page discussion outline containing pilot objective, each side's role, audience benefit, timeline, success indicators, risks, data/brand approvals, and a stop-or-scale decision. Finish with a 25-minute first-meeting agenda and three respectful questions that test fit. Do not invent affiliations, imply endorsement, or commit either organization before authorized approval.

  - id: "069"
    slug: "outcome-led-weekly-status"
    title: "Outcome Led Weekly Status"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to turn weekly activity notes into a concise outcome and risk update."
    use_case: "Produces a scan-friendly weekly report for managers or clients. It distinguishes completed work, progress, blockers, and decisions."
    preview_override: null
    best_tools:
      - tool: "Notion"
        reason: "Maintains recurring status reports with linked tasks and owners."
      - tool: "ChatGPT"
        reason: "Condenses raw notes into clear outcome-focused updates."
    tip: "Write blockers as a requested action with an owner and due date."
    expected_output: "A one-page weekly status report with decisions and next commitments."
    tags: ["status-report", "project-management", "weekly"]
    next_id: null
    prompt: |
      You are an operations communicator converting raw weekly notes into a report a busy stakeholder can scan in two minutes.

      Project and period: [PROJECT_PERIOD]
      Planned outcomes: [PLANNED]
      Work completed: [COMPLETED]
      Metrics or evidence: [EVIDENCE]
      Work in progress: [IN_PROGRESS]
      Blockers and risks: [BLOCKERS]
      Decisions or help needed: [REQUESTS]
      Next week's commitments: [NEXT]

      Produce a one-page update beginning with a traffic-light status and a one-sentence reason. Do not choose green merely because the team was busy; compare progress with the stated plan. Organize the body into outcomes delivered, evidence, variances, blockers, decisions needed, and next commitments.

      Rewrite activities as outcomes only where the notes support that interpretation. Preserve exact dates and numbers. For each blocker, name impact, owner, requested action, and decision date. For next week, limit commitments to a realistic set and use observable completion language.

      Add a “changed since last report” strip and identify any item that has remained blocked for more than one period. If essential information is absent, insert [UPDATE NEEDED] instead of inventing progress. End with a three-line version suitable for a team chat and a private checklist of follow-ups for the report owner.

  - id: "070"
    slug: "local-shop-campaign-angle-lab"
    title: "Local Shop Campaign Angle Lab"
    category: "work-business"
    difficulty: "Beginner"
    usage: "Use to brainstorm practical campaign angles for a neighborhood business."
    use_case: "Generates locally relevant campaign routes across trust, convenience, occasion, and product value. Ideas respect a small-business budget."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Generates and compares varied campaign angles from local context."
      - tool: "Canva"
        reason: "Turns selected angles into affordable social and print assets."
    tip: "Test one angle with a small audience before producing a full campaign."
    expected_output: "Ten distinct campaign angles and three low-cost test plans."
    tags: ["local-business", "campaign", "marketing"]
    next_id: null
    prompt: |
      Act as a practical campaign strategist for a local shop, working with real customer habits rather than big-brand clichés.

      Shop type and location: [SHOP_LOCATION]
      Best products or services: [OFFERINGS]
      Typical customers: [CUSTOMERS]
      Occasion or business goal: [GOAL]
      Differentiators with proof: [PROOF]
      Budget, channels, and timeframe: [CONSTRAINTS]
      Languages used by customers: [LANGUAGES]

      Generate ten campaign angles from distinct motivations: convenience, trust, discovery, gifting, seasonal need, community, craftsmanship, value, routine, and transformation. If one motivation does not fit, replace it with a better local insight. For every angle, provide a human truth, a one-line promise, proof required, sample headline, visual idea, suitable channel, and risk of becoming generic.

      Do not assume all Pakistani customers share one culture, income, language, or religious practice. Avoid fake discounts, unsupported “best” claims, pressure tactics, and festivals not relevant to the supplied calendar. Use Urdu or regional-language phrases only when the user supplies or verifies them.

      Score the angles for distinctiveness, credibility, affordability, and fit. Select three for small tests and design each test with one asset, audience, duration, response measure, and learning question. Conclude with what customer information would improve the next round.

  - id: "071"
    slug: "spreadsheet-cleaning-blueprint"
    title: "Spreadsheet Cleaning Blueprint"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to plan safe cleaning before changing a messy spreadsheet."
    use_case: "Creates a reversible, auditable cleaning plan for Excel or Google Sheets. It preserves raw data and defines validation checks."
    preview_override: null
    best_tools:
      - tool: "Excel/Sheets"
        reason: "Provides filters, formulas, validation, and reproducible cleaning steps."
      - tool: "ChatGPT"
        reason: "Helps diagnose column issues and draft transformation logic."
    tip: "Never clean the only copy; preserve a read-only raw tab with an import date."
    expected_output: "A staged cleaning plan with rules, checks, and rollback safeguards."
    tags: ["spreadsheet", "data-cleaning", "quality"]
    next_id: null
    prompt: |
      Work as a cautious data steward planning a spreadsheet cleanup that can be audited and reversed.

      File purpose: [PURPOSE]
      Columns and sample rows: [SCHEMA_SAMPLE]
      Known problems: [PROBLEMS]
      Intended analysis: [ANALYSIS]
      Tool: [EXCEL_OR_SHEETS]
      Locale, date, and number conventions: [LOCALE]

      Do not clean values immediately. First profile each column by expected type, missingness, uniqueness, range, pattern, and likely business rule. Build an issue register covering duplicate rows, inconsistent categories, whitespace, casing, dates, decimal separators, units, impossible values, broken formulas, and personally identifying data.

      Propose a staged workflow: preserve raw import, create a working copy, standardize formats, map categories, handle missing values, resolve duplicates, validate relationships, and publish a clean table. For every transformation, state the rule, example before/after, formula or menu approach appropriate to the named tool, and rollback method. Never recommend deleting an outlier solely because it looks unusual.

      Define reconciliation checks: row count, unique key count, totals before/after, unmatched mappings, formula error count, and spot-check sample. Mark decisions that require a domain owner. Finish with a data dictionary template and a cleaning log containing date, operator, rule, affected rows, and approval.

  - id: "072"
    slug: "chart-to-decision-narrative"
    title: "Chart to Decision Narrative"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to explain a chart in plain language without overstating it."
    use_case: "Converts chart evidence into a concise narrative for reports or meetings. It surfaces alternative explanations and action limits."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Synthesizes supplied chart details into an audience-aware narrative."
      - tool: "Excel/Sheets"
        reason: "Allows direct verification of values, labels, and chart construction."
    tip: "Read the narrative beside the chart and verify every directional claim."
    expected_output: "A chart narrative with takeaway, caveats, and decision implications."
    tags: ["charts", "data-storytelling", "reporting"]
    next_id: null
    prompt: |
      You are a data interpreter writing the honest story of a chart for a non-specialist decision-maker.

      Chart or data: [CHART_DATA]
      Metric definition: [METRIC]
      Audience and decision: [AUDIENCE_DECISION]
      Comparison period: [PERIOD]
      Source and caveats: [SOURCE_CAVEATS]

      Inspect the evidence in four passes. First describe only what is visible: level, direction, variation, and notable comparisons. Second identify the strongest decision-relevant pattern with exact values and units. Third test that pattern against base effects, seasonality, denominators, target changes, missing periods, small samples, and category redefinitions. Fourth consider at least one plausible alternative explanation.

      Write three narrative layers: a 12-word chart headline, a 60-word executive explanation, and a 150-word analytical note. Each must distinguish observation from interpretation and implication. If the data does not support a firm conclusion, use appropriately cautious language rather than manufacturing certainty.

      Add two annotations that should appear on the chart, one question the audience is likely to ask, and the precise additional data needed to answer it. Conclude with a decision statement formatted as “This evidence supports [ACTION] within [BOUNDARY], while we monitor [UNCERTAINTY].” Do not infer causation from timing alone.

  - id: "073"
    slug: "assumptions-first-analysis"
    title: "Assumptions First Analysis"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use before quantitative analysis to expose definitions, assumptions, and decision thresholds."
    use_case: "Frames an analysis so hidden choices become reviewable before calculations begin. It reduces confident answers to the wrong question."
    preview_override: null
    best_tools:
      - tool: "Claude"
        reason: "Handles complex analytical context and tracks assumptions across a long brief."
      - tool: "ChatGPT"
        reason: "Structures decision questions, sensitivity tests, and evidence gaps."
    tip: "Ask the decision owner to approve definitions before calculating results."
    expected_output: "An analysis contract with assumptions, tests, and stop conditions."
    tags: ["analysis", "assumptions", "decision-science"]
    next_id: null
    prompt: |
      Act as an analytical reviewer who pauses calculation until the question and assumptions are explicit.

      Decision to be made: [DECISION]
      Available data: [DATA]
      Proposed method: [METHOD]
      Stakeholders: [STAKEHOLDERS]
      Constraints: [CONSTRAINTS]
      Deadline: [DEADLINE]

      Produce an “analysis contract.” Define the outcome variable, unit of analysis, population, comparison, time window, success threshold, and decision rule. Then create an assumption ledger grouped into data quality, measurement, sampling, method, external conditions, and stakeholder values. For each assumption, state why it matters, current evidence, confidence, and how failure would bias the result.

      Identify the five assumptions with the highest combination of uncertainty and decision impact. Design a sensitivity test or validation check for each. Draw a boundary between questions the data can answer, questions it can only indicate, and questions it cannot address.

      Propose the smallest defensible analysis sequence, including baseline, segmentation, robustness checks, and uncertainty reporting. Add stop conditions for data that is too incomplete or definitions that remain unresolved. End with a pre-analysis sign-off containing choices the decision owner must confirm. Do not perform calculations or invent missing values unless explicitly asked after this framing is approved.

  - id: "074"
    slug: "notion-database-system-designer"
    title: "Notion Database System Designer"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to design a practical Notion database before building views and automations."
    use_case: "Maps a workflow into properties, relations, templates, and views. It avoids turning Notion into an overcomplicated software project."
    preview_override: null
    best_tools:
      - tool: "Notion"
        reason: "Supports linked databases, templates, filtered views, and team workflows."
      - tool: "ChatGPT"
        reason: "Translates workflow requirements into a clear database specification."
    tip: "Start with one source-of-truth database and add relations only for repeated entities."
    expected_output: "A build-ready Notion schema with views, templates, and governance."
    tags: ["notion", "database", "workflow"]
    next_id: null
    prompt: |
      Take the role of a Notion systems designer building the smallest database structure that supports the real workflow.

      What is being tracked: [ITEMS]
      Users and roles: [USERS]
      Workflow stages: [STAGES]
      Questions users need answered: [QUESTIONS]
      Existing databases: [EXISTING]
      Reporting or automation needs: [NEEDS]

      Start by identifying the primary record and its unique naming rule. Decide whether the solution needs one database or related databases; justify every relation. Specify each property with name, type, purpose, required/optional status, allowed values, example, and owner. Avoid redundant properties that can be derived or rolled up.

      Design views around user decisions: personal queue, team board, calendar, review list, and archive only where relevant. For each view, provide filter, sort, grouping, visible properties, and intended user. Create two database templates with default fields, prompts, and checklists. Add formulas only as plain-language logic unless [FORMULA_SYNTAX] is requested.

      Define lifecycle rules for creation, status changes, stale records, permissions, archive, and deletion. Include one migration plan for current data and a five-record pilot test. Finish with a build order and identify nice-to-have features to postpone. Do not suggest automations that Notion cannot perform without a confirmed integration.

  - id: "075"
    slug: "meeting-notes-to-accountable-actions"
    title: "Meeting Notes to Accountable Actions"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to convert messy meeting notes into decisions, tasks, and open questions."
    use_case: "Extracts accountable actions without inventing owners or deadlines. It preserves uncertainty for confirmation."
    preview_override: null
    best_tools:
      - tool: "Notion"
        reason: "Stores meeting records and links actions to team workflows."
      - tool: "ChatGPT"
        reason: "Separates decisions, actions, and unresolved issues from raw notes."
    tip: "Send the action list within the same day while context is fresh."
    expected_output: "A decision log, action register, and concise follow-up message."
    tags: ["meetings", "tasks", "accountability"]
    next_id: null
    prompt: |
      Act as a precise meeting secretary turning rough notes into accountable follow-through without filling gaps from imagination.

      Meeting notes or transcript: [NOTES]
      Meeting purpose: [PURPOSE]
      Participant names and roles: [PARTICIPANTS]
      Project context: [CONTEXT]

      Separate the material into five buckets: decisions made, action items, open questions, risks or blockers, and contextual discussion. A decision must state what was agreed and, if present, why. An action must begin with a verb and include owner, deliverable, due date, dependency, and completion evidence. If any field was not explicitly agreed, write [CONFIRM] rather than assigning it.

      Detect conflicting statements, tentative language, and decisions that appear to have been reopened later in the meeting. Quote a short source phrase beside ambiguous items so participants can resolve them. Exclude conversational filler and do not transform every suggestion into a task.

      Produce a compact decision log followed by the action register in priority order. Add an “awaiting confirmation” section and a parking-lot list. Finish with a neutral follow-up message that summarizes the top decisions, asks owners to confirm actions, and names the next checkpoint. Preserve sensitive material only if it is necessary for execution.

  - id: "076"
    slug: "zapier-make-workflow-sketch"
    title: "Zapier or Make Workflow Sketch"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to map an automation before connecting live accounts or customer data."
    use_case: "Designs a tool-neutral workflow with triggers, transformations, failures, and human review. It can then be implemented in Zapier or Make."
    preview_override: null
    best_tools:
      - tool: "Zapier/Make"
        reason: "Connects supported apps through triggers, actions, filters, and branching."
      - tool: "Notion"
        reason: "Documents the automation specification, test cases, and ownership."
    tip: "Test with fake records before granting access to production accounts."
    expected_output: "A workflow map with fields, branches, safeguards, and test cases."
    tags: ["automation", "zapier", "make"]
    next_id: null
    prompt: |
      Work as an automation architect sketching the logic before anyone connects production systems.

      Desired outcome: [OUTCOME]
      Triggering app and event: [TRIGGER]
      Source fields: [SOURCE_FIELDS]
      Destination apps and actions: [DESTINATIONS]
      Conditions or approvals: [CONDITIONS]
      Expected volume and urgency: [VOLUME]
      Sensitive data: [SENSITIVE_DATA]

      Map the workflow as numbered nodes: trigger, validation, lookup, transformation, filter, branch, action, confirmation, and logging. Use only the node types actually required. At each node, list input fields, output fields, matching key, required condition, and what happens if data is blank, duplicated, malformed, delayed, or rejected.

      Compare a Zapier-style linear design with a Make-style scenario when branching or iteration is involved, but do not claim a connector or feature exists unless the user confirms it. Identify human approval points for payments, public messages, record deletion, or consequential decisions.

      Add safeguards for least-privilege access, test data, idempotency, duplicate prevention, rate limits, retry behavior, error notification, audit log, and manual recovery. Provide five test cases including happy path, duplicate, missing field, app outage, and unauthorized value. Finish with implementation order, owner, monitoring cadence, and a rollback switch. Never place passwords or API keys in the specification.

  - id: "077"
    slug: "kpi-definition-card-maker"
    title: "KPI Definition Card Maker"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to define KPIs consistently before building a dashboard."
    use_case: "Creates auditable metric definitions with owners, formulas, and interpretation limits. It reduces dashboard disputes."
    preview_override: null
    best_tools:
      - tool: "Excel/Sheets"
        reason: "Documents metric formulas and validates sample calculations transparently."
      - tool: "Notion"
        reason: "Maintains a shared KPI dictionary with owners and revision history."
    tip: "Calculate one example by hand with the metric owner before publishing."
    expected_output: "Standard KPI cards and a metric governance checklist."
    tags: ["kpi", "metrics", "dashboard"]
    next_id: null
    prompt: |
      You are a measurement lead defining KPIs so two analysts calculate the same answer from the same data.

      Business objective: [OBJECTIVE]
      Proposed KPI names: [KPIS]
      Available systems: [SYSTEMS]
      Reporting audience: [AUDIENCE]
      Review frequency: [FREQUENCY]
      Known disputes: [DISPUTES]

      For each KPI, create a definition card containing: decision it informs, plain-language meaning, exact formula, numerator, denominator, unit, inclusion rules, exclusion rules, time window, segment dimensions, source system, refresh timing, data owner, business owner, target source, and known limitations. Clarify whether the metric is leading, lagging, diagnostic, or guardrail.

      Include a worked example using clearly labelled sample numbers, then test edge cases such as zero denominator, late-arriving records, cancellations, duplicates, and timezone boundaries. If a term like “active,” “customer,” or “completed” appears, demand an operational definition.

      Compare any KPIs that may conflict or encourage harmful gaming. Recommend one balancing metric where needed. Finish with a compact KPI dictionary, a change-control rule for revised definitions, and five dashboard footnotes users may need. Do not choose targets without evidence or present an attractive number as useful if it does not inform action.

  - id: "078"
    slug: "unbiased-survey-designer"
    title: "Unbiased Survey Designer"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to design a short survey that measures one clear research objective."
    use_case: "Creates neutral questions, response options, and a pilot plan. It includes consent, accessibility, and analysis considerations."
    preview_override: null
    best_tools:
      - tool: "Google Forms"
        reason: "Builds accessible surveys with common question types and branching."
      - tool: "Microsoft Forms"
        reason: "Supports straightforward organizational survey collection and export."
    tip: "Pilot with five people and ask what they thought each question meant."
    expected_output: "A field-ready survey instrument with rationale and pilot checks."
    tags: ["survey", "research", "questionnaire"]
    next_id: null
    prompt: |
      Act as a survey methodologist designing the shortest instrument that can answer [RESEARCH_OBJECTIVE].

      Target population: [POPULATION]
      Sampling and distribution plan: [SAMPLING]
      Decisions based on results: [DECISIONS]
      Required topics: [TOPICS]
      Languages and accessibility needs: [LANGUAGES_ACCESS]
      Maximum completion time: [TIME]
      Sensitive questions: [SENSITIVE]

      Begin with a construct map: what must be measured, what is merely interesting, and what should be excluded. Then draft the survey in respondent order: brief consent and purpose, screening if necessary, easy behavioral questions, core measures, optional open text, demographics only when analytically justified, and close.

      Use one idea per question. Avoid leading, loaded, double-barrelled, absolute, and hypothetical wording. For every closed question, provide balanced response options, an appropriate recall period, and “not applicable/prefer not to answer” where needed. Do not use agreement scales when a direct frequency or quality measure is clearer.

      Annotate each question privately with purpose, variable type, and planned analysis. Add branch logic and randomization only when justified. Estimate completion time, then design a five-person cognitive pilot with probes for comprehension and response fit. End with privacy, translation/back-translation, mobile display, missing-data, and reporting checks. Do not promise anonymity if collection settings cannot guarantee it.

  - id: "079"
    slug: "spreadsheet-error-check-formulas"
    title: "Spreadsheet Error Check Formulas"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to design formula-based checks that flag likely spreadsheet errors."
    use_case: "Suggests review formulas for Excel or Google Sheets without overwriting source values. It emphasizes explainable flags and testing."
    preview_override: null
    best_tools:
      - tool: "Excel/Sheets"
        reason: "Supports transparent formulas, validation rules, and conditional formatting."
      - tool: "ChatGPT"
        reason: "Drafts formula patterns from a supplied schema and business rules."
    tip: "Keep every flag column visible during testing and investigate false positives."
    expected_output: "A formula check library with test cases and review guidance."
    tags: ["formulas", "spreadsheet", "error-checking"]
    next_id: null
    prompt: |
      Work as a spreadsheet quality reviewer proposing checks that flag anomalies without silently changing data.

      Tool and version: [EXCEL_OR_SHEETS]
      Column letters/names: [SCHEMA]
      Sample rows: [SAMPLES]
      Business rules: [RULES]
      Known errors: [KNOWN_ERRORS]
      Locale separators: [LOCALE]

      Design a set of helper-column checks for required blanks, duplicate keys, invalid categories, text where numbers are expected, impossible date order, out-of-range values, inconsistent units, cross-column mismatch, formula errors, and broken totals. Include only checks relevant to the supplied schema.

      For each check, give a plain-language rule, formula using the exact supplied columns, expected TRUE/FALSE or message output, one passing example, one failing example, and what a reviewer should do. Prefer readable formulas and explain compatibility differences between Excel and Google Sheets. Where a formula depends on modern functions, offer a simpler fallback.

      Add a summary section that counts each error type and highlights rows through conditional formatting without hiding source values. Distinguish hard errors from warnings. Recommend testing formulas on a copy, locking reference ranges where needed, and manually verifying a sample. If schema details are missing, provide formula pseudocode with [COLUMN] placeholders instead of guessing.

  - id: "080"
    slug: "personal-knowledge-base-architecture"
    title: "Personal Knowledge Base Architecture"
    category: "data-productivity"
    difficulty: "Beginner"
    usage: "Use to create a simple knowledge system you can maintain each week."
    use_case: "Designs a personal knowledge base around retrieval and action, not collection. It works for study, professional development, or projects."
    preview_override: null
    best_tools:
      - tool: "Notion"
        reason: "Combines notes, linked databases, templates, and searchable project context."
      - tool: "Obsidian"
        reason: "Supports local markdown notes and lightweight linking between ideas."
    tip: "Design around how you will retrieve notes, then limit capture fields."
    expected_output: "A maintainable knowledge-base structure with templates and routines."
    tags: ["knowledge-management", "notes", "productivity"]
    next_id: null
    prompt: |
      Act as a personal knowledge systems coach designing for retrieval, reflection, and action—not endless note collecting.

      Main uses: [USES]
      Current tools and notes: [CURRENT_SYSTEM]
      Types of information captured: [INFORMATION]
      Weekly maintenance time: [TIME]
      Privacy or offline needs: [PRIVACY]
      Preferred tool: [NOTION_OR_OBSIDIAN]

      Define four flows: capture, clarify, connect, and retrieve. Propose the smallest folder or database architecture that supports those flows. Separate time-bound projects, ongoing responsibilities, reference material, and original insights without forcing every note into many categories.

      Create templates for quick capture, source note, concept note, meeting/lecture note, and weekly review. Each template should have only fields that improve future search or use. Provide a naming convention, tag policy with a maximum number of tag families, linking rule, and source-citation habit. Explain how the design differs in Notion and Obsidian where relevant.

      Map a 15-minute weekly review: process inbox, link useful notes, surface open questions, archive stale material, and choose one idea to apply. Include a migration plan that starts with active material rather than importing everything. Finish with three retrieval tests the system must pass after two weeks and warning signs that the structure has become too complex.

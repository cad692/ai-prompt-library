prompts:
  - id: "041"
    slug: "investor-pitch-deck-architect"
    title: "Investor Pitch Deck Architect"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to shape an early-stage venture story before designing the slides."
    use_case: "Turn scattered venture facts into a credible pitch sequence for Pakistani or international investors. Missing evidence remains clearly labelled."
    preview_override: null
    best_tools:
      - tool: "Gamma"
        reason: "Builds a polished first-pass deck from a structured narrative."
      - tool: "PowerPoint+Copilot"
        reason: "Supports familiar slide editing and presenter-ready refinement."
    tip: "Replace ambitious claims with a sourced number or a clearly named assumption."
    expected_output: "A slide-by-slide pitch outline with evidence gaps and a closing ask."
    tags: ["pitch-deck", "startup", "fundraising"]
    next_id: null
    prompt: |
      You are a venture-story architect turning raw founder notes into an evidence-led pitch deck.

      Venture: [VENTURE]
      Audience: [INVESTOR_TYPE]
      Stage and traction: [STAGE_AND_TRACTION]
      Customer problem: [PROBLEM]
      Solution and advantage: [SOLUTION]
      Business model: [BUSINESS_MODEL]
      Market evidence: [MARKET_EVIDENCE]
      Funding ask and use: [ASK_AND_USE]

      Build a 10-12 slide storyline, but do not invent market sizes, customers, partnerships, or financial results. For each slide, provide a decisive headline that states the takeaway, the minimum supporting content, one recommended visual, and the evidence needed. Make the logic progress from costly problem to credible opportunity, demonstrated progress, and a specific ask.

      Include a “proof gap” beside any claim that lacks support. Separate current facts from forecasts. If the venture serves Pakistan, explain local realities in plain language rather than treating them as weaknesses. Give the traction slide three possible treatments depending on whether traction is revenue, usage, or validated learning.

      Finish with: the one-sentence investment thesis, the two questions investors are most likely to challenge, and a 30-second closing statement. Keep slide text sparse; place explanation in brief presenter guidance.

  - id: "042"
    slug: "concept-to-teaching-slides"
    title: "Concept to Teaching Slides"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to teach one difficult concept through examples, checks, and practice."
    use_case: "Creates a short lesson deck for a class, training, or study group. It adapts language and examples to the learners."
    preview_override: null
    best_tools:
      - tool: "Canva"
        reason: "Makes classroom-friendly slides easy to lay out and revise."
      - tool: "Gamma"
        reason: "Quickly converts a lesson sequence into visual sections."
    tip: "Test the misconception question before presenting; it reveals where the explanation needs work."
    expected_output: "An eight-slide mini-lesson with examples and learning checks."
    tags: ["teaching", "lesson", "education"]
    next_id: null
    prompt: |
      Act as a patient instructional designer preparing a visual mini-lesson, not a textbook chapter.

      Teach [CONCEPT] to [LEARNER_LEVEL] learners in [TIME_AVAILABLE] minutes. Their likely prior knowledge is [PRIOR_KNOWLEDGE], and the real-world setting is [CONTEXT]. The learning outcome is: “[LEARNERS_WILL_BE_ABLE_TO].”

      Design exactly eight slides as a learning journey:
      1) a relatable puzzle,
      2) what learners will achieve,
      3) the simplest accurate explanation,
      4) a visual analogy and where it breaks,
      5) a worked example,
      6) a common misconception,
      7) a one-minute learner challenge,
      8) an answer plus memorable recap.

      For every slide, write a learner-facing title, no more than 30 words of visible text, a visual direction, and what the facilitator does. Use examples recognizable to Pakistani students or professionals when [LOCAL_CONTEXT] is supplied, without stereotypes. Define unfamiliar terms once. Avoid decorative visuals that do not teach.

      Add one diagnostic question before the lesson and one exit question after it. Supply the expected answers and a brief explanation of what each wrong answer may reveal. End with one optional extension for fast learners and one support adjustment for learners who need more scaffolding.

  - id: "043"
    slug: "one-message-per-slide-editor"
    title: "One Message per Slide Editor"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use when slides contain dense paragraphs, mixed messages, or unclear headlines."
    use_case: "Rewrites an existing deck so every slide carries one audience takeaway. The result preserves meaning while reducing reading load."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Reorganizes pasted slide copy while preserving the intended argument."
      - tool: "Claude"
        reason: "Handles long decks and maintains narrative continuity across slides."
    tip: "Read only the revised headlines in order; they should tell the complete story."
    expected_output: "A slide rewrite map with message headlines, cuts, and split recommendations."
    tags: ["editing", "slide-design", "clarity"]
    next_id: null
    prompt: |
      Work as a ruthless-but-faithful slide editor whose rule is one meaningful message per slide.

      Here is the current slide content: [PASTE_SLIDES]
      The audience is [AUDIENCE], the decision or learning goal is [GOAL], and the tone should be [TONE].

      First, write the deck's current argument in one sentence. Then process each slide individually. Identify its strongest intended takeaway, rewrite the title as a complete message rather than a topic label, and retain only content that proves or explains that message. Put useful but nonessential material in a “move to notes” line. Mark repetition with the slide number where the idea already appears.

      When a slide contains two indispensable messages, propose a split and name both new slides. When several slides make one weak point, recommend a merge. Do not compress text merely by making sentences vague, and do not alter numbers or factual meaning.

      Present the result as a numbered rewrite map with: new headline, visible content, suggested visual, notes material, and action (keep/split/merge/remove). Conclude with the revised headline-only story and flag any logical jump where a new bridge slide or missing evidence is needed.

  - id: "044"
    slug: "speaker-notes-rehearsal-coach"
    title: "Speaker Notes Rehearsal Coach"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to convert slide bullets into natural notes for a timed presentation."
    use_case: "Produces spoken notes that complement rather than read the screen. It also builds timing and recovery cues for rehearsal."
    preview_override: null
    best_tools:
      - tool: "ChatGPT"
        reason: "Turns slide context into conversational, audience-aware speaking notes."
      - tool: "PowerPoint+Copilot"
        reason: "Keeps notes close to the slides used during delivery."
    tip: "Rehearse once from cue phrases only, then shorten any note you still read verbatim."
    expected_output: "Natural speaker notes with timing, transitions, and rehearsal cues."
    tags: ["speaker-notes", "public-speaking", "rehearsal"]
    next_id: null
    prompt: |
      Become my presentation rehearsal coach and write for the ear, not for the page.

      Slides or outline: [SLIDES]
      Audience relationship: [AUDIENCE_RELATIONSHIP]
      Total speaking time: [TOTAL_TIME]
      Desired tone: [TONE]
      Must-say facts: [MUST_SAY_FACTS]
      Likely questions: [LIKELY_QUESTIONS]

      Allocate realistic time across the slides, reserving 10% for pauses and transitions. For each slide, create notes with four distinct parts: an opening cue phrase, a natural spoken explanation, a bridge to the next idea, and a fallback sentence I can use if running late. Do not narrate text already visible. Explain why the visual matters and translate technical language into audience-friendly speech without losing accuracy.

      Add delivery marks sparingly: [PAUSE], [EMPHASISE], [POINT TO VISUAL], and [CHECK AUDIENCE]. Give difficult names or terms a pronunciation placeholder only where needed. If the supplied material cannot fit the time, identify exactly what to cut instead of making the speaking pace unrealistic.

      End with a rehearsal card containing the opening, three memory anchors, the final line, and two Q&A bridge phrases. Keep the voice credible and human; avoid inflated motivational language and invented personal stories.

  - id: "045"
    slug: "visual-metaphor-finder"
    title: "Visual Metaphor Finder"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to replace generic stock photos with meaningful visual concepts."
    use_case: "Generates visual metaphors that clarify an abstract presentation idea. Each option includes limits to prevent misleading imagery."
    preview_override: null
    best_tools:
      - tool: "Canva"
        reason: "Supports quick assembly of metaphor-led slide compositions."
      - tool: "Adobe Firefly"
        reason: "Generates custom conceptual imagery from detailed art direction."
    tip: "Choose the metaphor your audience can decode in under three seconds."
    expected_output: "Five ranked visual metaphors with composition and misuse warnings."
    tags: ["visual-metaphor", "creative-direction", "slides"]
    next_id: null
    prompt: |
      Serve as a visual-thinking partner for an abstract slide idea that currently has no useful image.

      Core message: [CORE_MESSAGE]
      Audience: [AUDIENCE]
      Context or industry: [CONTEXT]
      Brand mood: [BRAND_MOOD]
      Visuals to avoid: [AVOID]

      Generate five genuinely different metaphor families—not five variations of a road, ladder, or lightbulb. Consider relationships such as compression, balance, navigation, translation, ecosystems, repair, rhythm, or signal versus noise. For each metaphor, explain in one sentence what maps to what, then describe a 16:9 composition with a clear focal point and open space for [SLIDE_TEXT]. Suggest whether photography, illustration, diagram, or collage best carries it.

      Give each option a “decoding speed” rating from 1-5 and a caution explaining how the metaphor could confuse, oversimplify, or culturally misfire. Avoid stereotypes, flags as decoration, gendered role assumptions, and images of poverty used to signal Pakistan.

      Rank the top two for this audience. For the winner, provide a concise image-generation brief including style, composition, colour direction, lighting, and negative constraints. Also offer a no-generation alternative using simple shapes and icons available in common presentation software.

  - id: "046"
    slug: "before-after-slide-clinic"
    title: "Before and After Slide Clinic"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to diagnose and redesign one weak slide without changing its facts."
    use_case: "Critiques a slide against audience needs and proposes a concrete after-state. The method separates message problems from visual problems."
    preview_override: null
    best_tools:
      - tool: "Canva"
        reason: "Makes the recommended layout changes easy to prototype."
      - tool: "PowerPoint+Copilot"
        reason: "Helps revise content inside a common business presentation workflow."
    tip: "Fix the message hierarchy before adjusting fonts, colours, or icons."
    expected_output: "A concise critique and build-ready redesign specification for one slide."
    tags: ["slide-critique", "redesign", "presentation"]
    next_id: null
    prompt: |
      Diagnose this slide like a presentation clinician: preserve the facts, repair the communication.

      Slide screenshot or pasted content: [SLIDE]
      Audience: [AUDIENCE]
      What they should think, feel, or do: [INTENDED_RESPONSE]
      Brand constraints: [BRAND_CONSTRAINTS]
      Delivery setting: [ROOM_OR_SCREEN]

      Start with a five-second reading: what would a busy viewer notice first, and what would they probably miss? Then separate the diagnosis into message, evidence, hierarchy, readability, and visual relevance. Cite specific elements from the supplied slide; do not offer generic advice such as “use fewer words” without naming what to remove.

      Create an after-version specification. Include a takeaway headline, exact shortened body copy, layout described by regions, recommended chart or visual if one is justified, and presenter-only details to move into notes. State the minimum readable type size appropriate to the setting and any contrast risk.

      Provide a before/after comparison in six paired bullets, each showing the problem and the corresponding repair. Finally, write a 45-second talk track for the redesigned slide and one quick test the creator can perform at normal viewing distance. Do not manufacture data or imply a visual should replace evidence.

  - id: "047"
    slug: "canva-social-carousel-planner"
    title: "Canva Social Carousel Planner"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to turn one useful idea into a swipeable educational carousel."
    use_case: "Plans a Canva carousel for LinkedIn or Instagram with a coherent visual rhythm. It prioritizes value over engagement bait."
    preview_override: null
    best_tools:
      - tool: "Canva"
        reason: "Provides practical carousel sizing, layout, and brand controls."
      - tool: "ChatGPT"
        reason: "Develops concise card copy and narrative progression."
    tip: "Export and inspect every card at phone size before publishing."
    expected_output: "An eight-card carousel script with art direction and caption."
    tags: ["canva", "carousel", "social-media"]
    next_id: null
    prompt: |
      You are planning a swipeable social carousel that earns attention by being useful, not by making exaggerated promises.

      Topic: [TOPIC]
      Audience: [AUDIENCE]
      Platform: [LINKEDIN_OR_INSTAGRAM]
      Brand voice and colours: [BRAND]
      Desired action: [CALL_TO_ACTION]
      Source material: [SOURCE_MATERIAL]

      Design eight cards. Card 1 needs a specific benefit-led hook without “secret,” “guaranteed,” or fear tactics. Cards 2-3 frame the problem, Cards 4-6 teach a method or example, Card 7 gives a saveable checklist, and Card 8 closes with the requested action. This arc is a guide: change it if the source material demands a better teaching sequence.

      For each card, supply one headline, up to 24 words of supporting copy, a layout cue, and a repeated visual motif that evolves across the carousel. Specify hierarchy for mobile reading and indicate where an Urdu term may be included if [LANGUAGE_CHOICE] calls for it. Never fabricate a quotation or statistic; mark source-dependent claims with [VERIFY].

      Add a Canva build note covering dimensions suitable for the chosen platform, consistent margins, and accessible contrast. Finish with a natural post caption, meaningful alt text, and five relevant hashtags rather than a long generic hashtag list.

  - id: "048"
    slug: "stakeholder-update-deck"
    title: "Stakeholder Update Deck"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use for a concise project update that foregrounds decisions and risks."
    use_case: "Turns delivery information into a transparent update for sponsors, clients, or leadership. It makes ownership and decisions explicit."
    preview_override: null
    best_tools:
      - tool: "Beautiful.ai"
        reason: "Keeps recurring business update layouts consistent and readable."
      - tool: "PowerPoint+Copilot"
        reason: "Fits common stakeholder review and collaboration workflows."
    tip: "Lead with what changed since the last update, not a full project history."
    expected_output: "A seven-slide decision-focused update with owners and next steps."
    tags: ["stakeholders", "project-update", "leadership"]
    next_id: null
    prompt: |
      Operate as a project communications lead preparing an update for people who need clarity, not activity theatre.

      Project: [PROJECT]
      Reporting period: [PERIOD]
      Stakeholders and concerns: [STAKEHOLDERS]
      Outcomes achieved: [OUTCOMES]
      Metrics: [METRICS]
      Risks or blockers: [RISKS]
      Decisions required: [DECISIONS]
      Next-period commitments: [COMMITMENTS]

      Build a maximum seven-slide update. Open with a one-slide executive signal: overall status, what changed, and what needs attention. Follow with outcome progress, metric movement, milestones, risks, decisions, and next steps. Activity belongs only where it explains an outcome.

      On every slide, use a message headline and label information as fact, forecast, or request. For each metric, show baseline, current value, target, period, and source if supplied; write “not provided” where needed. For risks, state probability, impact, mitigation, owner, and trigger for escalation. For decisions, frame the options, recommendation, deadline, and consequence of delay without manipulating the audience.

      Add a 60-second opening script and an appendix list for detail that should not crowd the main deck. Finish with a pre-send accuracy check covering dates, owners, metric definitions, and confidentiality.

  - id: "049"
    slug: "workshop-agenda-slide-builder"
    title: "Workshop Agenda Slide Builder"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to design agenda slides that explain participation, timing, and outcomes."
    use_case: "Creates workshop opening and transition slides that reduce uncertainty for participants. It includes energy and accessibility considerations."
    preview_override: null
    best_tools:
      - tool: "Canva"
        reason: "Offers flexible visual layouts for facilitated sessions."
      - tool: "Gamma"
        reason: "Quickly assembles modular agenda and activity slides."
    tip: "Show participants what they will produce, not only what topics they will hear."
    expected_output: "A facilitation-ready agenda deck plan with timings and transitions."
    tags: ["workshop", "agenda", "facilitation"]
    next_id: null
    prompt: |
      Act as a workshop experience designer creating slides that help participants know where they are, why it matters, and what to do next.

      Workshop goal: [GOAL]
      Participants: [PARTICIPANTS]
      Duration and breaks: [DURATION]
      Activities: [ACTIVITIES]
      Room or online setup: [SETUP]
      Accessibility or language needs: [ACCESS_NEEDS]

      Turn the agenda into a small navigation system rather than one crowded timetable. Draft: a welcome slide, an outcomes slide, a visual journey slide, one instruction slide per activity, break/return slides, and a closing reflection slide. Give each segment a short action-oriented name, timing, participant mode (listen, discuss, make, share), and tangible output.

      For activity instructions, use the sequence “purpose / steps / time / deliverable / help.” Keep visible instructions brief enough to remain on screen while people work. Add facilitator notes with setup, materials, likely confusion, and a time-warning cue. Include a low-bandwidth alternative for any activity that depends on an app or internet connection.

      Recommend one visual code—colour, icon, or progress marker—that consistently distinguishes learning, practice, and breaks. End with a minute-by-minute run sheet and identify any agenda section whose timing is unrealistic for [GROUP_SIZE].

  - id: "050"
    slug: "data-slide-storyline"
    title: "Data Slide Storyline"
    category: "presentations"
    difficulty: "Beginner"
    usage: "Use to turn a chart or dataset into an honest decision narrative."
    use_case: "Builds a slide story around what data supports, what it cannot prove, and what action follows. Useful for management or research briefings."
    preview_override: null
    best_tools:
      - tool: "Excel/Sheets"
        reason: "Supports transparent chart creation and source-data checking."
      - tool: "PowerPoint+Copilot"
        reason: "Helps present chart takeaways within a decision deck."
    tip: "State the denominator and time period wherever a percentage appears."
    expected_output: "A chart recommendation, message headline, annotations, and spoken interpretation."
    tags: ["data-storytelling", "charts", "decision-making"]
    next_id: null
    prompt: |
      Take the role of a data-story editor who refuses to make the chart claim more than the evidence supports.

      Data or chart description: [DATA]
      Decision audience: [AUDIENCE]
      Decision at stake: [DECISION]
      Time period and units: [TIME_AND_UNITS]
      Known caveats: [CAVEATS]

      Begin by naming the single comparison that matters most for the decision. Recommend the chart form that makes that comparison easiest, and explain why two plausible alternatives would be weaker. Specify axes, sorting, baseline, labels, and any reference line. Never suggest a truncated axis without clearly disclosing its effect.

      Write a message headline containing the supported takeaway, followed by a subtitle that states scope. Identify up to three chart annotations tied to exact values or periods. Then provide a spoken narrative in this order: context, pattern, exception, limitation, and decision implication. Distinguish correlation from causation and flag small samples, missing denominators, changing definitions, or cherry-picked dates.

      Add a “reasonable alternative reading” of the same data and say what additional evidence would resolve the ambiguity. Close with a slide footnote template for source, refresh date, metric definition, and caveat. If raw data is incomplete, request what is missing rather than estimating it.

  - id: "051"
    slug: "studio-product-photo-director"
    title: "Studio Product Photo Director"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to create a production-ready product image prompt without false features."
    use_case: "Directs an AI product visual for e-commerce or campaigns. The prompt preserves product identity and specifies a controlled studio setup."
    preview_override: null
    best_tools:
      - tool: "Adobe Firefly"
        reason: "Creates controlled commercial-style imagery with detailed visual direction."
      - tool: "Leonardo"
        reason: "Supports polished product concepts and consistent art direction."
    tip: "Attach a clean reference image and list features the model must not alter."
    expected_output: "A tool-ready product photo prompt plus negative constraints."
    tags: ["product-photography", "ecommerce", "image-prompt"]
    next_id: null
    prompt: |
      You are a commercial product photographer translating a real item into a precise generation brief.

      Product and verified features: [PRODUCT]
      Reference image available: [YES_OR_NO]
      Audience and use: [AUDIENCE_AND_USE]
      Brand character: [BRAND_CHARACTER]
      Required aspect ratio: [ASPECT_RATIO]
      Features that must not change: [LOCKED_FEATURES]

      Compose one hero-photo prompt with the product as the unmistakable focal point. Specify visual style, camera angle, lens feel, framing, surface and background, prop placement, colour palette, lighting setup with key/fill/rim direction, shadow softness, material texture, and depth of field. Reserve clean negative space for [COPY_POSITION] while keeping the pack label unobstructed.

      Then write two controlled variations: an overhead detail composition and an in-context lifestyle setup. The lifestyle scene must be plausible for the product and should not imply an unsupported medical, environmental, or performance claim.

      Add a negative prompt preventing warped packaging, duplicate objects, illegible invented labels, changed logos, floating props, plastic-looking textures, harsh reflections, extra fingers where hands appear, and watermarks. If accurate brand text is essential, direct the user to composite the original label after generation rather than trusting generated typography. Mention that final output must be checked against the real item.

  - id: "052"
    slug: "educational-explainer-still"
    title: "Educational Explainer Still"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to visualize a process or concept in one teachable image."
    use_case: "Creates a labelled or label-ready educational still with a clear reading order. It avoids decoration that competes with learning."
    preview_override: null
    best_tools:
      - tool: "Adobe Firefly"
        reason: "Produces custom explanatory illustrations in controlled styles."
      - tool: "Canva"
        reason: "Adds accurate labels and accessible layout after image generation."
    tip: "Generate the illustration without text, then add verified labels in Canva."
    expected_output: "An image-generation brief and a separate accurate label plan."
    tags: ["education", "illustration", "explainer"]
    next_id: null
    prompt: |
      Work as a science-and-learning illustrator designing one still image that teaches [CONCEPT] at a glance.

      Learner age or level: [LEVEL]
      Essential parts or stages: [PARTS]
      Misconception to prevent: [MISCONCEPTION]
      Display format: [FORMAT]
      Preferred visual language: [STYLE_PREFERENCE]

      Decide first whether a cutaway, sequence, comparison, map, or annotated scene best explains the concept. Write a generation prompt for a clean educational illustration using an accurate but approachable style, a left-to-right or centre-out composition, one dominant focal point, restrained colours, soft even studio-like lighting, and enough blank space for labels. Specify relative scale only when it is scientifically meaningful; otherwise state “not to scale.”

      Keep generated text out of the image. Instead, provide a separate label layer: exact label wording, placement, leader-line direction, and reading order. Include a small legend only if colours encode meaning. Avoid photorealism when it would hide internal relationships, and avoid cartoon expressions that distort the concept.

      Finish with three accuracy checks a teacher should perform against a trusted source, concise alt text describing the learning content, and a simplified black-and-white version suitable for low-cost printing. Do not invent anatomical, historical, or technical details.

  - id: "053"
    slug: "linkedin-profile-banner-brief"
    title: "LinkedIn Profile Banner Brief"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to design a professional banner that supports, rather than repeats, a profile."
    use_case: "Creates a banner concept around professional positioning and safe-zone composition. It includes generation and assembly guidance."
    preview_override: null
    best_tools:
      - tool: "Canva"
        reason: "Provides practical banner sizing and editable text placement."
      - tool: "Adobe Firefly"
        reason: "Generates distinctive background imagery without relying on stock photos."
    tip: "Preview the banner on desktop and mobile because the profile photo covers different areas."
    expected_output: "A banner concept, image prompt, safe-zone layout, and alt text."
    tags: ["linkedin", "personal-brand", "banner"]
    next_id: null
    prompt: |
      Act as a personal-brand art director designing a LinkedIn banner with quiet confidence.

      Professional identity: [ROLE_OR_FIELD]
      People I help: [AUDIENCE]
      Value I create: [VALUE]
      Proof or focus areas: [FOCUS_AREAS]
      Colours and personality: [BRAND_CUES]
      Optional short line: [TAGLINE]

      Propose three concepts based on different visual ideas: one abstract system, one workspace or environmental scene, and one typographic-led composition. For each, explain the positioning signal it sends and what could make it feel generic.

      Choose the strongest concept and produce an image-generation prompt. Require a contemporary editorial style, wide panoramic composition, important imagery weighted toward the right-side safe area, soft directional lighting, controlled contrast, subtle depth, and no generated words, logos, watermarks, handshakes, rockets, glowing brains, or random business icons. Mention the intended crop and leave breathing room where profile-interface elements may overlap.

      Separately specify Canva assembly: safe-zone placement, at most one tagline, type hierarchy, colour contrast, and whether the tagline adds information not already in the headline. End with mobile-crop advice and alt text. Do not imply employers, clients, credentials, or affiliations that were not supplied.

  - id: "054"
    slug: "urdu-calligraphy-safe-poster"
    title: "Urdu Calligraphy Safe Poster"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to create a culturally respectful poster while preserving accurate Urdu text."
    use_case: "Separates image generation from Urdu typesetting to prevent broken script. Suitable for events, quotes, or awareness posters."
    preview_override: null
    best_tools:
      - tool: "Adobe Firefly"
        reason: "Generates the text-free poster artwork from precise art direction."
      - tool: "Canva"
        reason: "Supports manual placement of verified text over the generated background."
    tip: "Ask a fluent Urdu reader to proof the final joined letters, punctuation, and meaning."
    expected_output: "A text-free art prompt and a safe manual Urdu typesetting plan."
    tags: ["urdu", "poster", "typography"]
    next_id: null
    prompt: |
      You are directing an Urdu poster workflow that treats the script as designed language, not generated decoration.

      Exact approved Urdu text: [URDU_TEXT]
      Roman/English meaning: [MEANING]
      Occasion and audience: [OCCASION]
      Visual tradition or mood: [MOOD]
      Size and placement: [OUTPUT_SIZE]
      Sponsor marks: [LOGOS]

      Do not ask the image model to render the Urdu text. Create a text-free background prompt with [ART_STYLE] style, a balanced vertical composition, a calm focal ornament, intentional central or upper negative space for calligraphy, a culturally appropriate colour palette, layered paper/ink or architectural texture, and soft directional lighting that preserves readability. Avoid pseudo-Arabic marks, sacred text used as texture, inaccurate landmarks, and ornamental clutter behind the future lettering.

      Then provide a separate typesetting map: exact approved wording copied unchanged, line breaks, alignment, approximate text-block proportions, contrast treatment, and space for translation or event details. Recommend using a verified Urdu-capable font or artwork from a calligrapher; do not name a font unless the user has confirmed access and licensing.

      Include a proof checklist for joining forms, diacritics if required, punctuation direction, spelling, translation, logo clear space, and print bleed. Require review by a fluent reader before publishing. If the supplied Urdu appears uncertain, preserve it and flag it rather than silently correcting it.

  - id: "055"
    slug: "midjourney-editorial-portrait"
    title: "Midjourney Editorial Portrait"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use for a controlled editorial portrait with explicit lighting and camera language."
    use_case: "Builds a Midjourney-specific portrait prompt with composition and parameter guidance. It avoids identity or credential misrepresentation."
    preview_override: null
    best_tools:
      - tool: "Midjourney"
        reason: "Excels at stylized editorial portrait concepts and lighting treatments."
    tip: "Change one variable per reroll so you can identify what improved the portrait."
    expected_output: "A Midjourney-ready portrait prompt with variants and negative constraints."
    tags: ["midjourney", "portrait", "editorial"]
    next_id: null
    prompt: |
      Function as an editorial portrait director writing specifically for Midjourney.

      Subject description or authorized reference: [SUBJECT]
      Publication or purpose: [PURPOSE]
      Mood: [MOOD]
      Wardrobe: [WARDROBE]
      Location or backdrop: [SETTING]
      Crop: [CROP]

      Write one compact Midjourney prompt in visual priority order: subject, expression and pose, editorial style, composition, camera and lens character, depth of field, backdrop, colour treatment, then lighting. Use a precise lighting plan—such as large soft key 45 degrees camera-left, subtle negative fill, narrow rim light, and controlled catchlights—rather than “cinematic lighting.” Preserve natural skin texture and realistic fabric detail.

      Add suitable current parameters using placeholders where version-dependent: [ASPECT_RATIO], [STYLIZE], and [MODEL_VERSION]. Include `--no` constraints for extra people, distorted hands, duplicate accessories, waxy skin, text, watermark, over-smoothing, and unintended props. Do not claim an exact camera model is necessary for quality.

      Supply three single-variable variants: lighting mood, camera height, and background texture. Explain what each changes emotionally. If a real person is involved, require permission and avoid presenting the generated image as documentary evidence. Do not alter culturally significant clothing into costume or add status symbols, uniforms, or affiliations not requested.

  - id: "056"
    slug: "runway-six-second-scene"
    title: "Runway Six Second Scene"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to brief a short, controlled image-to-video moment in Runway."
    use_case: "Defines one achievable video action with camera movement and continuity constraints. It is intentionally scoped for a short clip."
    preview_override: null
    best_tools:
      - tool: "Runway"
        reason: "Supports short generative video and image-to-video workflows."
    tip: "Use one subject action and one camera move; complexity causes visual drift."
    expected_output: "A Runway-ready clip brief with motion beats and continuity controls."
    tags: ["runway", "video-generation", "motion"]
    next_id: null
    prompt: |
      Be a generative-video director designing one coherent six-second shot for Runway, not a full commercial.

      Starting image or scene: [STARTING_FRAME]
      Subject action: [ONE_ACTION]
      Emotional beat: [EMOTION]
      Destination platform: [PLATFORM]
      Aspect ratio: [ASPECT_RATIO]
      Brand look: [BRAND_LOOK]

      Describe the clip as a single continuous shot. Specify the visual style, foreground/midground/background composition, time of day, key and ambient lighting, colour grade, subject motion, environmental motion, camera height, lens feel, focus behavior, and exactly one camera move. Break six seconds into three beats: establish, action, settle. Ensure the final beat creates a usable edit point.

      Write the actual Runway prompt as a compact paragraph that describes what should move rather than restating every static detail in the source image. Add continuity constraints: stable identity, consistent wardrobe, fixed object count, believable physics, no sudden scene change, no morphing, no new text, no logo deformation, no flicker, and no camera collision.

      Then provide one lower-motion fallback if the first generation drifts, plus a silent-viewing caption idea to add during editing. Avoid unsafe stunts, deceptive documentary framing, and representations of a real person without authorization.

  - id: "057"
    slug: "capcut-caption-led-reel"
    title: "CapCut Caption Led Reel"
    category: "images-video"
    difficulty: "Beginner"
    usage: "Use to script a short vertical video designed for sound-off viewing."
    use_case: "Creates a CapCut-specific edit script with spoken lines, captions, and visual beats. Captions remain readable on a phone."
    preview_override: null

"001":
  DECISION:
    q: What decision do you need help framing?
    ex: Accept Job A in Karachi or Job B in Dubai
  OPTIONS:
    q: What are the real options on your shortlist?
    ex: 1) Job A  2) Job B  3) Stay and renegotiate
  WHY_NOW:
    q: Why does this decision need to happen now?
    ex: Offer expires Friday; lease renews next month
  DEADLINE:
    q: What is the latest date you can decide?
    ex: 18 October 2026, 5pm PKT
  PEOPLE_AFFECTED:
    q: Who is affected, and what is each person’s stake?
    ex: Spouse (move), parents (status), teammate (workload)
  SUCCESS_LOOKS_LIKE:
    q: What would a successful outcome look like?
    ex: Stable income, growth, and ability to visit family
  HARD_LIMITS:
    q: Which limits of money, time, place, or duty are fixed?
    ex: Need ≥ Rs. 180k/month; cannot leave Pakistan for 1 year
  RISK_COMFORT:
    q: How much uncertainty can you live with?
    ex: Low — I want reversible steps and a backup plan
  FACTS_I_ALREADY_KNOW:
    q: What confirmed facts do you already have?
    ex: Both offers in writing; Dubai includes housing allowance
    optional: true
  DEAL_BREAKERS:
    q: What would make you reject an option immediately?
    ex: No written contract, or unpaid overtime culture
    optional: true
"002":
  WEEK_DATES:
    q: Which calendar week should we plan?
    ex: 14–20 April or this coming week
  FIXED_COMMITMENTS:
    q: What fixed commitments already fill the week?
    ex: Mon–Fri 9–1 classes; 45-min commute; Sunday family lunch
  TASKS_AND_DEADLINES:
    q: Which tasks and deadlines need attention?
    ex: Finish report by Thu; revise two chapters; pay bills
  BEST_FOCUS_HOURS:
    q: During which hours do you focus best?
    ex: 7pm to 10pm on weeknights
  ENERGY_PATTERN:
    q: When is your energy usually highest or lowest?
    ex: Alert mornings; low energy after 3pm
  AVAILABLE_FOCUS_TIME:
    q: How much focus time can you honestly give?
    ex: About 2 hours each weekday evening
  RECOVERY_BLOCKS:
    q: Which recovery blocks must stay protected?
    ex: Sleep by 12; prayer times; 30-min walk
  CITY_OR_CONSTRAINTS:
    q: What city or living constraints shape the plan?
    ex: Karachi hostel with evening load-shedding
  WEEK_PRIORITY:
    q: What is the single most important weekly outcome?
    ex: Submit the internship application draft
  DISRUPTION_RISKS:
    q: What disruptions are most likely this week?
    ex: Load-shedding, late buses, sudden family visit
    optional: true
